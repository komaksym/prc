name: Feature request
description: Propose a new capability or a change to existing behavior
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Examples and the expected output help maintainers assess scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what is harder than it should be?
      placeholder: A reviewer cannot see the tests that exercise a changed function.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the command, output, or interaction you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Name workarounds you tried or other designs you considered.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Estimated scope
      options:
        - Small (localized behavior)
        - Medium (one module or output surface)
        - Large (cross-module or architectural change)
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for the same request.
          required: true
