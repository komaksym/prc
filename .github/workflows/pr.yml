name: pr

on:
  pull_request:
    # No "edited": a description edit would restart the macOS run. After a title fix, re-run the title job.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: komaksym/pr-gate/.github/workflows/checks.yml@d9054a367abf36081d50f80ce39a16b336a87f53 # v1.0.0
    with:
      run: ''
    permissions:
      contents: read
      pull-requests: read

  ci:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install media and OCR tools
        run: brew install ffmpeg tesseract
      - name: Sync dependencies with video extra
        run: uv sync --frozen --extra video
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Prepare locked dependencies for offline wheel tests
        shell: bash
        run: |
          uv build --offline --wheel --out-dir "$RUNNER_TEMP/prc-ci-wheel"
          uv export --frozen --extra video --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/prc-ci-constraints.txt"
          uv venv --python .venv/bin/python "$RUNNER_TEMP/prc-ci-cache"
          wheel=("$RUNNER_TEMP"/prc-ci-wheel/prc-*.whl)
          uv pip install --python "$RUNNER_TEMP/prc-ci-cache/bin/python" --constraint "$RUNNER_TEMP/prc-ci-constraints.txt" "${wheel[0]}[video]"
      - name: Run isolated release verification
        run: bash scripts/verify-release.sh
      - name: Upload verify evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verify
          path: artifacts/release/verify/
          retention-days: 14

  gate:
    if: always()
    needs: [checks, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo gate passed
