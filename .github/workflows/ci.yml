name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Sync dependencies with video extra
        run: uv sync --frozen --extra video
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
      - name: Build
        run: uv build
      - name: Real CLI E2E (fixture shop, silent video)
        run: |
          uv run prc doctor
          uv run prc board check tests/data/boards/shop.json --source fixture:shop
          rm -rf artifacts/ci-explain
          uv run prc explain --source fixture:shop --board tests/data/boards/shop.json --voice none --out artifacts/ci-explain > /tmp/prc-e2e.json
          cat /tmp/prc-e2e.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          result = json.loads(Path("/tmp/prc-e2e.json").read_text())
          assert result["check_passed"] is True, result
          folder = Path(result["out"])
          if not folder.is_absolute():
              folder = Path.cwd() / folder
          for name in ["map.html", "video.mp4", "doc.html", "card.png", "comment.md", "run.json"]:
              assert (folder / name).is_file(), name
          probe = json.loads(subprocess.check_output(["ffprobe", "-v", "error", "-select_streams", "v:0", "-show_entries", "stream=width,height,r_frame_rate", "-of", "json", str(folder / "video.mp4")]))
          stream = probe["streams"][0]
          assert (stream["width"], stream["height"], stream["r_frame_rate"]) == (1920, 1080, "30/1"), stream
          print("E2E outputs verified at", folder)
          PY

