name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Sync dependencies with video extra
        run: uv sync --frozen --extra video
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run isolated release verification
        run: bash scripts/verify-release.sh
      - name: Upload verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verify
          path: artifacts/release/verify/
          retention-days: 14

