[project]
name = "prc"
version = "0.1.0"
description = "Hardened GitHub PR comprehension MVP"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pygments==2.21.0",
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[project.scripts]
prc = "prc.cli:main"

[project.optional-dependencies]
video = [
    "playwright>=1.55",
]
voice = [
    "kokoro==0.9.4; python_version < '3.13'",
    "soundfile==0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "playwright>=1.55,<1.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prc"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["tests/data/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["prc"]
known-local-folder = ["conftest"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["tests/data/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data"]
