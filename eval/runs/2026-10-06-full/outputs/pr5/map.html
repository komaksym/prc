    --band: rgba(15, 23, 42, 0.022);
    --text: #0f1420;
    --muted: #5b6372;

    --amber: #c27c0e;

    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 6px 20px rgba(15, 23, 42, 0.07);
    --shadow-lg: 0 24px 64px rgba(15, 23, 42, 0.18);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
}

.st-added { --st: var(--green); }
.st-modified { --st: var(--amber); }
.st-deleted { --st: var(--red); }
.st-context { --st: var(--grey); }

/* Header */

.top {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-solid);
  position: relative;
  z-index: 5;
}

.headline { min-width: 0; flex: 1 1 0; }

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}

.logo {
  display: inline-grid;
  grid-template-columns: repeat(3, 4px);
  gap: 2px;
  align-items: center;
}

.logo i {
  display: block;
  width: 4px;
  height: 12px;
  border-radius: 2px;
  background: var(--green);
}

.logo i:nth-child(2) { height: 8px; background: var(--amber); }
.logo i:nth-child(3) { height: 5px; background: var(--red); }

.brand-name {
  color: var(--text);
  font-weight: 600;
  letter-spacing: 0.01em;
}

.meta { overflow: hidden; text-overflow: ellipsis; }
.meta .sep { color: var(--faint); margin: 0 6px; }
.meta .mono { font-family: var(--mono); font-size: 11.5px; }

.meta a {
  color: var(--accent);
  text-decoration: none;
}

.meta a:hover { text-decoration: underline; }

h1 {
  margin: 4px 0 0;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.012em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stats {
  display: flex;
  gap: 8px;
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
}

.stat {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 72px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--raise);
  white-space: nowrap;
}

.stat-value {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 17px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
}

.stat.good .stat-value { color: var(--green); }
.stat.bad .stat-value { color: var(--red); }
.stat.warn .stat-value { color: var(--amber); }
.stat.none .stat-value { color: var(--muted); }

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
}

.play {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 16px 0 14px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--text);
  color: var(--bg);
  font-weight: 600;
  white-space: nowrap;
  box-shadow: var(--shadow);
}

.play:hover { opacity: 0.9; }

.play-icon {
  width: 0;
  height: 0;
  border-left: 9px solid currentColor;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.playing .play-icon {
  width: 10px;
  height: 12px;
  border: 0;
  border-left: 3px solid currentColor;
  border-right: 3px solid currentColor;
}

/* Canvas */

.viewport {
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.2px);
  background-size: 24px 24px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.viewport.dragging { cursor: grabbing; }

.world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
}

.band {
  position: absolute;
  border: 1px dashed var(--border);
  border-radius: 16px;
  background: var(--band);
}

.band-label {
  position: absolute;
  left: 16px;
  top: 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  white-space: nowrap;
}

.edges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.e {
  fill: none;
  stroke: var(--edge);
  stroke-width: 1.5;
  transition: opacity 160ms ease;
}

.e-added {
  stroke: var(--green);
  stroke-width: 2;
  stroke-dasharray: 8 6;
  animation: flow 1s linear infinite;
}

.e-removed {
  stroke: var(--red);
  stroke-width: 1.75;
  stroke-dasharray: 5 5;
  opacity: 0.85;
}

.e-name {
  stroke-dasharray: 1 6;
  stroke-linecap: round;
  stroke-width: 2.25;
}

.e-added.e-name { stroke-width: 2.5; }

.arrow-added { fill: var(--green); }
.arrow-removed { fill: var(--red); }
.arrow-kept { fill: var(--edge); }

@keyframes flow {
  to { stroke-dashoffset: -28; }
}

/* Nodes */

.node {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 8px 12px 8px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
  transition: opacity 160ms ease, border-color 120ms ease, box-shadow 160ms ease;
}

.node:hover { border-color: var(--border-strong); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.node .bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--st);
}

.node.st-context {
  background: var(--card-ctx);
  border-style: dashed;
  box-shadow: none;
}

.node.st-context .bar { opacity: 0.6; }

.n-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.glyph {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1px solid var(--border-strong);
  color: var(--muted);
  font: 600 10.5px/1 var(--mono);
}

.name {
  min-width: 0;
  flex: 1 1 auto;
  font: 600 13px/1.3 var(--mono);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.st-context .name { color: var(--muted); font-weight: 500; }

.st-deleted .name {
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 1.5px;
  color: var(--muted);
}

.pill {
  flex: none;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--st);
  background: color-mix(in srgb, var(--st) 14%, transparent);
}

.path {
  font: 11px/1.35 var(--mono);
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}

.path > span { direction: ltr; unicode-bidi: isolate; }

.n-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
}

.n-row > .path { flex: 1 1 auto; min-width: 0; }

.n-row > .sites {
  flex: none;
  font-size: 11px;
  color: var(--faint);
}

.delta { font: 600 11.5px/1 var(--mono); }
.plus { color: var(--green); }
.minus { color: var(--red); }

.badge {
  margin-left: auto;
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
  background: color-mix(in srgb, var(--amber) 10%, transparent);
}

.chip {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 12px 0 16px;
  border-radius: 999px;
}

.chip .bar { width: 3px; }

.chip .name { flex: 0 1 auto; font-weight: 500; font-size: 12.5px; }
.chip.st-deleted .name { color: var(--muted); }

/* Grouped overview */

.fedges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.ge {
  fill: none;
  stroke: var(--edge);
  stroke-width: 2;
}

.ge-added { stroke: var(--green); }
.ge-removed { stroke: var(--red); }

.fcard {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 10px 14px 10px 16px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  overflow: hidden;
}

.fcard:hover { border-color: var(--border-strong); }
.fcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.f-name {
  font: 600 13px/1.3 var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.f-counts {
  font: 11px/1.4 var(--mono);
  color: var(--muted);
}

.flist {
  display: none;
  margin-top: 6px;
  border-top: 1px solid var(--border);
  padding-top: 6px;
  gap: 2px;
  overflow: auto;
}

.fcard.open {
  justify-content: flex-start;
  height: auto !important;
  max-height: 360px;
  z-index: 5;
}

.fcard.open .flist { display: grid; }

.fmem {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 4px 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  text-align: left;
}

.fmem:hover { background: var(--band); }

.fmem-name {
  flex: 1 1 auto;
  min-width: 0;
  font: 12px/1.35 var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fmem-tag {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.world.grouped .node.concealed { opacity: 0; }

.dense .sym {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 8px 0 12px;
  border-radius: 8px;
  box-shadow: none;
}

.dense .sym .bar { width: 3px; }
.dense .sym .name { font-size: 12px; }
.dense .sym .glyph { width: 16px; height: 16px; font-size: 9.5px; }
.dense .sym .pill { padding: 0 5px; font-size: 9px; }

.flag {
  flex: none;
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  font: 700 10px/1 var(--sans);
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
}

.group {
  position: absolute;
  padding: 6px 4px 0;
  font: 11px/1.3 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
  pointer-events: none;
}

.group > span { direction: ltr; unicode-bidi: isolate; }

body:not(.touring) .dense .e:not(.lit) { opacity: 0; }

.empty {
  position: absolute;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%);
  padding: 12px 20px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
  pointer-events: none;
}

.risk {
  flex: none;
  margin-left: auto;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--red);
  background: color-mix(in srgb, var(--red) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
  white-space: nowrap;
}

.world.far .path,
.world.far .sites { display: none; }
.world.far .name { font-size: 16px; }
.world.far .pill { font-size: 12px; }

.hovering .node:not(.lit),
.hovering .e:not(.lit) { opacity: 0.14; }

.hovering .e.lit { stroke-width: 2.5; }

.node.lit { border-color: var(--border-strong); }

.node.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent), var(--shadow);
}

.node.focus {
  border-color: var(--st);
  box-shadow: 0 0 0 1px var(--st), 0 0 40px color-mix(in srgb, var(--st) 40%, transparent), var(--shadow);
}

/* Tour */

.touring .node,
.touring .e { transition: none; }

.touring .e-added { animation: none; }

.spot {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 35%, color-mix(in srgb, var(--bg) 82%, transparent) 100%);
}

.touring .spot { opacity: 1; }

.progress {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 2px;
  display: none;
}

.touring .progress { display: block; }

#progress-bar {
  height: 100%;
  width: 0;
  background: var(--accent);
}

.caption {
  position: absolute;
  left: 50%;
  bottom: 40px;
  width: min(760px, calc(100% - 48px));
  transform: translateX(-50%);
  padding: 16px 24px 18px;
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .caption { display: block; }

.cap-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.cap-count { color: var(--faint); font-variant-numeric: tabular-nums; }

.cap-main {
  margin-top: 6px;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.015em;
}

.cap-main .code { font-family: var(--mono); font-size: 20px; }

.cap-sub {
  margin-top: 6px;
  font: 12.5px/1.4 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.summary {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(720px, calc(100% - 48px));
  transform: translate(-50%, -50%);
  padding: 32px 40px;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  background: var(--panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .summary { display: block; }

.sum-kicker {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.sum-title {
  margin-top: 8px;
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -0.015em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sum-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 24px;
}

.sum-cell {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--raise);
}

.sum-num {
  font-size: 40px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.sum-label { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.sum-cell.good .sum-num { color: var(--green); }
.sum-cell.bad .sum-num { color: var(--red); }
.sum-cell.warn .sum-num { color: var(--amber); }

.sum-note {
  margin-top: 16px;
  color: var(--muted);
  font-size: 14px;
}

.sum-brand {
  margin-top: 24px;
  font-size: 12px;
  color: var(--faint);
}

/* Floating controls */

.legend {
  position: absolute;
  left: 16px;
  bottom: 16px;
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 11.5px;
  color: var(--muted);
  box-shadow: var(--shadow);
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.sw {
  width: 10px;
  height: 10px;
  margin-left: 6px;
  border-radius: 3px;
  background: var(--st);
}

.sw:first-child, .ls:first-child { margin-left: 0; }
.ls { width: 32px; height: 8px; margin-left: 8px; overflow: visible; }

.zoom {
  position: absolute;
  right: 16px;
  bottom: 16px;
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.zoom button {
  min-width: 36px;
  height: 32px;
  padding: 0 10px;
  border: 0;
  border-right: 1px solid var(--border);
  background: transparent;
  font-size: 13px;
  color: var(--muted);
}

.zoom button:last-child { border-right: 0; }
.zoom button:hover { color: var(--text); background: var(--band); }

.touring .legend,
.touring .zoom { opacity: 0; pointer-events: none; }

/* Drawer */

.drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 92vw);
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--panel-solid);
  box-shadow: var(--shadow-lg);
  transform: translateX(104%);
  transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
  z-index: 4;
  cursor: auto;
  user-select: text;
}

.drawer[aria-hidden="false"] { transform: none; }

.d-head {
  position: relative;
  padding: 20px 56px 16px 24px;
  border-bottom: 1px solid var(--border);
}

.d-head .bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--st);
}

.d-tags { display: flex; align-items: center; gap: 8px; }

.d-kind {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.d-name {
  margin: 8px 0 4px;
  font: 650 18px/1.3 var(--mono);
  letter-spacing: -0.01em;
  word-break: break-all;
}

.st-deleted .d-name { text-decoration: line-through; text-decoration-color: var(--red); }

.d-path { font: 12px/1.4 var(--mono); color: var(--muted); word-break: break-all; }

.d-close {
  position: absolute;
  right: 16px;
  top: 16px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}

.d-close:hover { color: var(--text); border-color: var(--border-strong); }

.d-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
}

.fact {
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  white-space: nowrap;
}

.fact.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.fact.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

.d-body {
  flex: 1 1 auto;
  overflow: auto;
  padding: 8px 0 24px;
}

.d-section { padding: 16px 24px 0; }

.d-title {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}

.d-empty { font-size: 12.5px; color: var(--faint); }

.diff {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: auto;
  background: var(--bg);
  font: 12px/20px var(--mono);
}

.diff-rows { width: max-content; min-width: 100%; }

.hunk-head {
  padding: 2px 12px;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-top: 1px solid var(--border);
}

.diff-rows .hunk-head:first-child { border-top: 0; }

.dl {
  display: grid;
  grid-template-columns: 40px 40px 20px auto;
  white-space: pre;
}

.dl .ln {
  padding-right: 8px;
  text-align: right;
  color: var(--faint);
  user-select: none;
}

.dl .sg { text-align: center; user-select: none; }
.dl .code { padding-right: 16px; }
.dl.add { background: var(--add-bg); }
.dl.add .sg { color: var(--green); }
.dl.del { background: var(--del-bg); }
.dl.del .sg { color: var(--red); }

.links { display: grid; gap: 4px; }

.link {
  display: grid;
  grid-template-columns: 4px 1fr auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px 8px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--raise);
  text-align: left;
  overflow: hidden;
}

.link:hover { border-color: var(--border-strong); }
.link .bar { height: 100%; min-height: 32px; background: var(--st); border-radius: 0 2px 2px 0; }
.link-text { min-width: 0; }
.link-name { display: block; font: 600 12.5px/1.35 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link-path { display: block; font: 11px/1.35 var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.etag {
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 6px;
  color: var(--muted);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.etag.added { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
.etag.removed { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

/* Footer */

.foot {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 24px;
  border-top: 1px solid var(--border);
  background: var(--panel-solid);
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
}

.brand-line { font-weight: 550; color: var(--text); opacity: 0.8; }
.hints { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 1440px) {
  .top { gap: 16px; }
  .stat { min-width: 0; padding: 6px 10px; }
  .stat-value { font-size: 16px; }
  .stat-label { font-size: 10.5px; }
}

@media (max-width: 1100px) {
  .top { flex-wrap: wrap; }

  .hints { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .e-added { animation: none; }
  .drawer { transition: none; }
}

:"added","symbols":[]},{"added":36,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"name: Report Boundary E2E"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"on:"},{"new":4,"old":null,"op":"+","text":"  pull_request:"},{"new":5,"old":null,"op":"+","text":"    paths:"},{"new":6,"old":null,"op":"+","text":"      - '.github/workflows/report-tests.yml'"},{"new":7,"old":null,"op":"+","text":"      - '.github/workflows/morning-report.yml'"},{"new":8,"old":null,"op":"+","text":"      - '.github/workflows/sync-connections.yml'"},{"new":9,"old":null,"op":"+","text":"      - 'src/**'"},{"new":10,"old":null,"op":"+","text":"      - 'scripts/report_connections_doc.py'"},{"new":11,"old":null,"op":"+","text":"      - 'tests/**'"},{"new":12,"old":null,"op":"+","text":"      - 'pyproject.toml'"},{"new":13,"old":null,"op":"+","text":"  workflow_dispatch:"},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"permissions:"},{"new":16,"old":null,"op":"+","text":"  contents: read"},{"new":17,"old":null,"op":"+","text":""},{"new":18,"old":null,"op":"+","text":"jobs:"},{"new":19,"old":null,"op":"+","text":"  synthetic-e2e:"},{"new":20,"old":null,"op":"+","text":"    runs-on: ubuntu-latest"},{"new":21,"old":null,"op":"+","text":"    timeout-minutes: 10"},{"new":22,"old":null,"op":"+","text":"    steps:"},{"new":23,"old":null,"op":"+","text":"      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262"},{"new":24,"old":null,"op":"+","text":"        with:"},{"new":25,"old":null,"op":"+","text":"          persist-credentials: false"},{"new":26,"old":null,"op":"+","text":"      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e"},{"new":27,"old":null,"op":"+","text":"        with:"},{"new":28,"old":null,"op":"+","text":"          version: '0.12.18'"},{"new":29,"old":null,"op":"+","text":"          python-version: '3.12'"},{"new":30,"old":null,"op":"+","text":"          enable-cache: false"},{"new":31,"old":null,"op":"+","text":"      - name: Install test runtime"},{"new":32,"old":null,"op":"+","text":"        run: uv sync --extra dev"},{"new":33,"old":null,"op":"+","text":"      - name: Verify report HTTP boundaries with synthetic data"},{"new":34,"old":null,"op":"+","text":"        run: PYTHONPATH=src:. .venv/bin/python tests/e2e_doc_report.py --evidence report-evidence.json"},{"new":35,"old":null,"op":"+","text":"      - name: Verify existing reconciliation behavior"},{"new":36,"old":null,"op":"+","text":"        run: .venv/bin/python -m pytest -q"}],"new_start":1,"old_start":0}],"kind":"config","language":null,"path":".github/workflows/report-tests.yml","removed":0,"sensitive":"CI workflow","status":"added","symbols":[]},{"added":3,"hunks":[{"lines":[{"new":9,"old":9,"op":" ","text":"jobs:"},{"new":10,"old":10,"op":" ","text":"  sync-connections:"},{"new":11,"old":11,"op":" ","text":"    if: github.ref == 'refs/heads/main'"},{"new":12,"old":null,"op":"+","text":"    concurrency:"},{"new":13,"old":null,"op":"+","text":"      group: connections-reconciliation"},{"new":14,"old":null,"op":"+","text":"      cancel-in-progress: false"},{"new":15,"old":12,"op":" ","text":"    runs-on: ubuntu-latest"},{"new":16,"old":13,"op":" ","text":"    timeout-minutes: 10"},{"new":17,"old":14,"op":" ","text":""}],"new_start":9,"old_start":9}],"kind":"config","language":null,"path":".github/workflows/sync-connections.yml","removed":0,"sensitive":"CI workflow","status":"modified","symbols":[]},{"added":57,"hunks":[{"lines":[{"new":null,"old":1,"op":"-","text":"# Snapshot pagination fix"},{"new":1,"old":null,"op":"+","text":"# Implementation plans"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"## Google Docs morning report"},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"### Contract"},{"new":6,"old":null,"op":"+","text":""},{"new":7,"old":null,"op":"+","text":"- Add a dependency-light report adapter and orchestration CLI on `feature/google-docs-report`; call `reconcile_connections()` directly and do not change the reconciliation engine."},{"new":8,"old":null,"op":"+","text":"- `ReportResult` has `COMPLETE`, `BLOCKED`, or `FAILED`, an aware actual run timestamp, and counts only for `COMPLETE`. Provider or incomplete-snapshot failures publish unavailable counts; Supabase/internal failures publish unavailable counts with an explicit uncertain-write warning."},{"new":9,"old":null,"op":"+","text":"- Google config, refresh auth, document metadata, complete paginated permission privacy, and marker structure are preflighted before reconciliation. The document must be an editable, nontrashed Google Doc with only one owner user permission and no other grants. Recheck the same gate before one atomic marker-region replacement guarded by `requiredRevisionId`; refetch and recheck once only for revision conflict."},{"new":10,"old":null,"op":"+","text":"- Markers are exact standalone paragraphs `[BEGIN AUTOMATED REPORT]` / `[END AUTOMATED REPORT]` in one tab. Validate uniqueness/order/plain text, use UTF-16 indices, preserve all outside content, notes, and formatting."},{"new":11,"old":null,"op":"+","text":"- Google failures preserve the previous document and fail the CLI. Public output is fixed generic status text only; never print exception details or report data."},{"new":12,"old":null,"op":"+","text":"- Add standalone synthetic-transport E2E scenarios with safe repeatable JSON verdict evidence. Add a main-only, opt-in scheduled/manual workflow; share `connections-reconciliation` concurrency with sync, cancel false. No report outputs, caches, artifacts, summaries, or secrets outside the reporter step."},{"new":13,"old":null,"op":"+","text":"- Document OAuth setup, restricted sharing, seven-day Testing refresh-token expiry, scheduler opt-in, and best-effort static UTC schedule limitations."},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"### Milestones"},{"new":16,"old":null,"op":"+","text":""},{"new":17,"old":null,"op":"+","text":"1. Write E2E contract scenarios and evidence runner before implementation."},{"new":18,"old":null,"op":"+","text":"2. Implement report result/publisher, orchestration script, workflow serialization/opt-in, and setup guide."},{"new":19,"old":null,"op":"+","text":"3. Run standalone E2E scenarios, then repository lint/typecheck/existing tests/build; fix failures."},{"new":20,"old":null,"op":"+","text":"4. Publish a separate dependent PR with the system infographic; keep scheduling disabled until live OAuth delivery is verified."},{"new":21,"old":null,"op":"+","text":""},{"new":22,"old":null,"op":"+","text":"### E2E scenarios"},{"new":23,"old":null,"op":"+","text":""},{"new":24,"old":null,"op":"+","text":"- Complete nonempty and complete empty runs publish all six counts and preserve notes surrounding the managed region, including emoji/non-BMP UTF-16 indexing."},{"new":25,"old":null,"op":"+","text":"- LinkedIn failure and incomplete snapshot publish `BLOCKED` and unavailable counts, then exit nonzero."},{"new":26,"old":null,"op":"+","text":"- Supabase failure publishes `FAILED`, unavailable counts, and uncertain-write wording, then exits nonzero."},{"new":27,"old":null,"op":"+","text":"- OAuth/config failure occurs before LinkedIn/Supabase reconciliation; permission inspection paginates fully and rejects any extra/non-user/deleted/unknown grants or bad metadata."},{"new":28,"old":null,"op":"+","text":"- One revision conflict triggers fresh read, full permission recheck, and one retry; repeated conflict or other Docs failure leaves the old text untouched."},{"new":29,"old":null,"op":"+","text":"- Redirects, malformed/duplicate/reversed/cross-tab/rich-text markers, or ambiguous document shape fail closed."},{"new":30,"old":null,"op":"+","text":"- Captured CLI output and `--evidence` JSON contain only fixed statuses and scenario verdicts, never tokens, document contents, counts, provider data, or exception text."},{"new":31,"old":null,"op":"+","text":""},{"new":32,"old":null,"op":"+","text":"### Verification outcome"},{"new":33,"old":null,"op":"+","text":""},{"new":34,"old":null,"op":"+","text":"- Complete: 25 synthetic HTTP-boundary E2E scenarios, including actual client pagination, database write uncertainty, owner-only and published sharing gates, UTF-16 note preservation, and revision retry."},{"new":35,"old":null,"op":"+","text":"- Complete: Ruff, scoped mypy, 19 existing tests, workflow YAML contract checks, sdist and wheel build. Whole-source mypy has a pre-existing `client.py:124` type error outside this change."},{"new":36,"old":null,"op":"+","text":"- Added a credentials-free PR workflow to repeat the synthetic E2E and existing tests."},{"new":37,"old":null,"op":"+","text":"- Created and read back an owner-only Google Doc, currently marked SETUP PENDING. Its ID and contents are not committed."},{"new":38,"old":null,"op":"+","text":"- Pending operator setup: durable Google OAuth grant, repository secrets, merge dependency and this PR, manual workflow-to-Doc verification, then schedule opt-in. Synthetic tests do not verify live OAuth delivery."},{"new":39,"old":null,"op":"+","text":""},{"new":40,"old":null,"op":"+","text":"- Addressed Greptile cleanup diagnostics: LinkedIn and Supabase close failures now emit the same sanitized cleanup status as Google close failures. Two additional pipeline scenarios prove the diagnostic without leaking exception details."},{"new":41,"old":null,"op":"+","text":""},{"new":42,"old":null,"op":"+","text":"## Snapshot pagination fix"},{"new":43,"old":2,"op":" ","text":""},{"new":44,"old":3,"op":" ","text":"## Prospect evidence resolution"},{"new":45,"old":4,"op":" ","text":""}],"new_start":1,"old_start":1},{"lines":[{"new":65,"old":24,"op":" ","text":""},{"new":66,"old":25,"op":" ","text":"Summary: `memberSnapshotData` can return overlapping snapshot elements across pages without version metadata that proves which page is current. Merge distinct JSON rows across all returned elements so pagination cannot silently discard data, and make the verifier independent enough to detect the old single-snapshot defect."},{"new":67,"old":26,"op":" ","text":""},{"new":null,"old":27,"op":"-","text":"## Verification failure modes"},{"new":68,"old":null,"op":"+","text":"### Verification failure modes"},{"new":69,"old":28,"op":" ","text":""},{"new":70,"old":29,"op":" ","text":"1. One snapshot element is selected and distinct rows from another page are dropped."},{"new":71,"old":30,"op":" ","text":"2. Overlapping snapshot elements duplicate rows in the public result."}],"new_start":65,"old_start":24},{"lines":[{"new":73,"old":32,"op":" ","text":"4. Exact duplicates must collapse while materially different rows remain distinct."},{"new":74,"old":33,"op":" ","text":"5. Verification must not reuse production JSON canonicalization, or both paths can self-confirm the same defect."},{"new":75,"old":34,"op":" ","text":""},{"new":null,"old":35,"op":"-","text":"## Milestones"},{"new":76,"old":null,"op":"+","text":"### Milestones"},{"new":77,"old":36,"op":" ","text":""},{"new":78,"old":37,"op":" ","text":"1. Pin the regression where overlapping pages share rows but each can contain distinct data."},{"new":79,"old":38,"op":" ","text":"2. Merge distinct snapshot rows without changing the public response shape."},{"new":80,"old":39,"op":" ","text":"3. Make the live MCP E2E derive expected rows with an independent structural-equality oracle and self-check that the old single-snapshot behavior is rejected."},{"new":81,"old":40,"op":" ","text":"4. Add a Codex project-local `verify` skill that launches, doctors, drives, captures evidence, and cleans up the real MCP service."},{"new":82,"old":41,"op":" ","text":"5. Prove the skill once end to end, then run narrow tests, full tests, build, live E2E, and PR review."},{"new":83,"old":null,"op":"+","text":""},{"new":84,"old":null,"op":"+","text":"## Snapshot exhaustion fix"},{"new":85,"old":null,"op":"+","text":""},{"new":86,"old":null,"op":"+","text":"Keep this small fix on PR 5's existing branch, in one commit as requested."},{"new":87,"old":null,"op":"+","text":""},{"new":88,"old":null,"op":"+","text":"1. Add full-pipeline E2E cases before production edits. Known no-data exhaustion after successful pages must retain rows and publish COMPLETE. First-page no-data, generic later-page 404, non-404 errors, and page-limit truncation must remain blocked."},{"new":89,"old":null,"op":"+","text":"2. Preserve the structured provider error message and classify only exact known snapshot no-data 404s after successful pages as normal exhaustion. Preserve public signatures and nearby behavior."},{"new":90,"old":null,"op":"+","text":"3. Run the regression first red, then green. Run scoped lint/typecheck, E2E, existing tests and build. Independently review the diff."},{"new":91,"old":null,"op":"+","text":"4. Push one commit to the existing PR branch. Use the approved validation workflow to run that exact commit and read back the live Google Doc, including timestamp, status, verified counts, notes and owner-only sharing. Publish sanitized evidence and an updated raster system infographic in the PR."},{"new":92,"old":null,"op":"+","text":""},{"new":93,"old":null,"op":"+","text":"Throughput checkpoint: implementation and independent review run in parallel; live credentials remain in GitHub, and the test runner keeps report contents out of public logs."},{"new":94,"old":null,"op":"+","text":""},{"new":95,"old":null,"op":"+","text":"Validation before commit: the regression against the original client failed with expected exit 0 versus actual exit 1 and `morning report: blocked`. The patched client passes all 32 HTTP-boundary E2E scenarios and 19 existing tests. Scoped Ruff, mypy and package build pass. The `processedAt` comprehension received a type-only narrowing correction so the touched client passes mypy. Independent review found no actionable issues. The exact committed SHA will be used for the live report check; its private readback evidence and infographic will be recorded in the PR conversation."}],"new_start":73,"old_start":32}],"kind":"docs","language":null,"path":"PLANS.md","removed":3,"sensitive":null,"status":"modified","symbols":[]},{"added":68,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Private morning report"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"Bookmark one owner-only Google Doc. The reporter updates its automated section after each run, preserving your notes around it. It publishes aggregate CONNECTIONS reconciliation counts; it does not produce a person-by-person action queue."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"## One-time setup"},{"new":6,"old":null,"op":"+","text":""},{"new":7,"old":null,"op":"+","text":"1. Create a Google Doc in your own Drive with **General access: Restricted** and no other users. Do not publish it to the web or put it in a shared drive. Give the automated section these exact standalone marker paragraphs:"},{"new":8,"old":null,"op":"+","text":""},{"new":9,"old":null,"op":"+","text":"   ```text"},{"new":10,"old":null,"op":"+","text":"   [BEGIN AUTOMATED REPORT]"},{"new":11,"old":null,"op":"+","text":"   Status: SETUP PENDING"},{"new":12,"old":null,"op":"+","text":"   [END AUTOMATED REPORT]"},{"new":13,"old":null,"op":"+","text":""},{"new":14,"old":null,"op":"+","text":"   Operator notes"},{"new":15,"old":null,"op":"+","text":"   ```"},{"new":16,"old":null,"op":"+","text":""},{"new":17,"old":null,"op":"+","text":"2. Use a Google Cloud project you control. Enable the Google Docs API and Google Drive API, configure the OAuth consent screen, and create an OAuth client. Authorize your own account with offline access for these scopes:"},{"new":18,"old":null,"op":"+","text":""},{"new":19,"old":null,"op":"+","text":"   ```text"},{"new":20,"old":null,"op":"+","text":"   https://www.googleapis.com/auth/documents"},{"new":21,"old":null,"op":"+","text":"   https://www.googleapis.com/auth/drive.metadata.readonly"},{"new":22,"old":null,"op":"+","text":"   ```"},{"new":23,"old":null,"op":"+","text":""},{"new":24,"old":null,"op":"+","text":"   Obtain a refresh token through Google's documented OAuth authorization-code flow. Keep the client secret and refresh token out of source code, command logs, chat, and PRs. The connected Codex Google Drive app's authorization is separate and cannot be reused by GitHub Actions. An external OAuth app in **Testing** generally gets a seven-day refresh token for these scopes; use a durable consent configuration before enabling an unattended schedule. See [Google's OAuth guide](https://developers.google.com/identity/protocols/oauth2/web-server) and [refresh-token expiration rules](https://developers.google.com/identity/protocols/oauth2#expiration)."},{"new":25,"old":null,"op":"+","text":""},{"new":26,"old":null,"op":"+","text":"3. Add these **GitHub Actions repository secrets** using GitHub's secret settings:"},{"new":27,"old":null,"op":"+","text":""},{"new":28,"old":null,"op":"+","text":"   - `GOOGLE_REPORT_DOCUMENT_ID`: the Doc's ID, kept private even though it is not a password."},{"new":29,"old":null,"op":"+","text":"   - `GOOGLE_OAUTH_CLIENT_ID`"},{"new":30,"old":null,"op":"+","text":"   - `GOOGLE_OAUTH_CLIENT_SECRET`"},{"new":31,"old":null,"op":"+","text":"   - `GOOGLE_OAUTH_REFRESH_TOKEN`"},{"new":32,"old":null,"op":"+","text":""},{"new":33,"old":null,"op":"+","text":"   Reuse the existing `ORION_TOKEN` and `SUPABASE_SERVICE_ROLE_KEY` secrets. The Google account must own the target document; the publisher rejects every additional sharing grant, including published access."},{"new":34,"old":null,"op":"+","text":""},{"new":35,"old":null,"op":"+","text":"4. After the reporting change and its reconciliation dependency reach `main`, manually run **Private Morning Report** on `main`. Open the Doc and verify its actual timestamp, status, and counts against the reconciliation outcome. Check that your notes survived. A synthetic test does not replace this live authorization and delivery check."},{"new":36,"old":null,"op":"+","text":""},{"new":37,"old":null,"op":"+","text":"5. Only after that check, set the repository variable `GOOGLE_DOC_REPORT_ENABLED` to `true`. Remove it or set it to `false` to disable automatic runs. Manual dispatch remains available for recovery."},{"new":38,"old":null,"op":"+","text":""},{"new":39,"old":null,"op":"+","text":"## Schedule and privacy"},{"new":40,"old":null,"op":"+","text":""},{"new":41,"old":null,"op":"+","text":"The workflow requests a run daily at 06:17 UTC: 07:17 in Warsaw in winter and 08:17 in summer. GitHub scheduling is best effort, can be delayed, and can be disabled after inactivity in public repositories. The workflow runs only from `main` and shares a concurrency group with the existing sync workflow so the two do not reconcile simultaneously. GitHub concurrency can replace pending runs; it is not a durable queue. Bookmarking the Doc gives one-click access even if the latest run fails, so always check its timestamp."},{"new":42,"old":null,"op":"+","text":""},{"new":43,"old":null,"op":"+","text":"The reporting workflow prints only fixed status messages. It does not upload the report as an artifact, write a job summary, or cache report data. The code, workflow, run status, and generic failure category remain public because the repository is public. The older **Sync LinkedIn Connections** workflow still prints its existing aggregate summary; this change does not alter its output."},{"new":44,"old":null,"op":"+","text":""},{"new":45,"old":null,"op":"+","text":"Privacy and marker checks happen before reconciliation and again before each Doc update. The content replacement is atomic and requires the revision that was read. If you edit concurrently, the publisher refetches and retries once; other Google failures leave the previous dated report in place and fail the workflow. Sharing can change between the check and the update: Google does not provide a transaction spanning Drive permissions and Docs content. Keep the Doc restricted."},{"new":46,"old":null,"op":"+","text":""},{"new":47,"old":null,"op":"+","text":"## Reading the result"},{"new":48,"old":null,"op":"+","text":""},{"new":49,"old":null,"op":"+","text":"LinkedIn can end snapshot pagination with a specific no-data HTTP 404 after successful pages. The client treats that exact response as normal completion and retains all fetched rows. A first-page 404, an unrecognized later-page 404, or a page limit still blocks reconciliation. The advertised pagination total is not a reliable stopping rule."},{"new":50,"old":null,"op":"+","text":""},{"new":51,"old":null,"op":"+","text":"| Status | Meaning | Action |"},{"new":52,"old":null,"op":"+","text":"| --- | --- | --- |"},{"new":53,"old":null,"op":"+","text":"| COMPLETE | The full provider snapshot reconciled; all six counts are available. | Review unmatched rows if nonzero. Counts alone do not identify individual prospects. |"},{"new":54,"old":null,"op":"+","text":"| BLOCKED | The provider snapshot was unavailable or incomplete; counts are unknown. | Restore provider access or pagination, then rerun. |"},{"new":55,"old":null,"op":"+","text":"| FAILED | Reconciliation failed; counts are unknown and database writes may have happened. | Check database state, fix the failure, then rerun the duplicate-safe reconciliation. |"},{"new":56,"old":null,"op":"+","text":""},{"new":57,"old":null,"op":"+","text":"Google authorization/publication failures cannot update the same Doc with a failure report. The previous timestamp remains visible; check the GitHub run status if it is stale. Revoke the refresh token and remove the GitHub secrets to remove the workflow's Google access."},{"new":58,"old":null,"op":"+","text":""},{"new":59,"old":null,"op":"+","text":"## Repeatable verification"},{"new":60,"old":null,"op":"+","text":""},{"new":61,"old":null,"op":"+","text":"```sh"},{"new":62,"old":null,"op":"+","text":"uv sync --extra dev"},{"new":63,"old":null,"op":"+","text":"PYTHONPATH=src:. .venv/bin/python tests/e2e_doc_report.py --evidence /tmp/google-doc-report-evidence.json"},{"new":64,"old":null,"op":"+","text":"```"},{"new":65,"old":null,"op":"+","text":""},{"new":66,"old":null,"op":"+","text":"This exercises the real reporter and reconciliation code against synthetic HTTP boundaries. The evidence file contains scenario verdicts only, not real reconciliation results or credentials. Live workflow-to-Doc verification requires the one-time setup above."},{"new":67,"old":null,"op":"+","text":""},{"new":68,"old":null,"op":"+","text":"The **Report Boundary E2E** PR check repeats this synthetic pipeline and the existing tests without access to repository secrets. Its verdicts are public; they contain no production report data."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"docs/google-docs-report.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":0,"hunks":[],"kind":"opaque","language":null,"path":"docs/images/google-doc-report.jpg","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":119,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"\"\"\"Run reconciliation and publish only sanitized status to the console.\"\"\""},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"from __future__ import annotations"},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"import asyncio"},{"new":6,"old":null,"op":"+","text":"import sys"},{"new":7,"old":null,"op":"+","text":"from datetime import datetime, timezone"},{"new":8,"old":null,"op":"+","text":"from typing import Any, Literal"},{"new":9,"old":null,"op":"+","text":""},{"new":10,"old":null,"op":"+","text":"from linkedin_mdp_mcp.client import LinkedInAPIError, LinkedInMDPClient"},{"new":11,"old":null,"op":"+","text":"from linkedin_mdp_mc       line.setAttribute("d", folderPath(p, q, across));
      line.setAttribute("marker-end", `url(#arrow-${st})`);
      line.setAttribute("data-folder-edge", `${from.key}-${to.key}`);
      line.setAttribute("data-count", String(count));
      line.setAttribute("stroke-width", String(Math.min(10, Math.round((1.5 + 2 * Math.sqrt(count)) * 10) / 10)));
      folderLayer.appendChild(line);
    }
  }

  const round = (v) => Math.round(v * 10) / 10;

  const drawOrder = { kept: 0, removed: 1, added: 2 };

  for (const edge of [...edges].sort((p, q) => drawOrder[p.status] - drawOrder[q.status])) {
    const path = svg("path", `e e-${edge.status}${edge.byName ? " e-name" : ""}`);
    path.setAttribute("d", edge.route);
    path.setAttribute("marker-end", `url(#arrow-${edge.status})`);
    path.setAttribute("data-edge", edge.key);
    edge.el = path;
    edgeLayer.appendChild(path);
  }

  function pathLine(path) {
    const box = el("div", "path");
    box.appendChild(el("span", "", path));
    return box;
  }

  function rowCard(node) {
    add(node.el, el("div", "bar"), el("span", "glyph", GLYPH[node.sym.kind] || "f"), el("span", "name", node.name));
    if (PILL[node.status]) node.el.appendChild(el("span", "pill", PILL[node.status]));
    if (node.untested) node.el.appendChild(el("span", "flag", "!"));
    node.el.setAttribute("title", node.untested ? `${node.name} · ${NO_TEST}` : node.name);
  }

  function symbolCard(node) {
    if (LAYOUT.dense) return rowCard(node);
    const sym = node.sym;
    const card = node.el;
    const head = el("div", "n-row");
    add(head, el("span", "glyph", GLYPH[sym.kind] || "f"), el("span", "name", node.name));
    if (PILL[node.status]) head.appendChild(el("span", "pill", PILL[node.status]));
    if (node.status === "context") {
      const sub = add(el("div", "n-row"), pathLine(node.path));
      if (sym.call_sites) sub.appendChild(el("span", "sites", plural(sym.call_sites, "call site", "call sites")));
      add(card, el("div", "bar"), head, sub);
      return;
    }
    add(card, el("div", "bar"), head, pathLine(node.path));
    const foot = el("div", "n-foot");
    const delta = el("span", "delta");
    add(delta, el("span", "plus", `+${sym.added}`), document.createTextNode(" "), el("span", "minus", `${MINUS}${sym.removed}`));
    add(foot, delta);
    if (node.status !== "deleted" && !isTest(node)) foot.appendChild(el("span", "sites", plural(sym.call_sites, "call site", "call sites")));
    if (node.untested) foot.appendChild(el("span", "badge", NO_TEST));
    card.appendChild(foot);
  }

  function fileCard(node) {
    const card = node.el;
    add(card, el("div", "bar"), el("span", "name", node.name));
    if (node.file.sensitive) card.appendChild(el("span", "risk", node.file.sensitive));
    card.setAttribute("title", node.path);
  }

  const expanded = new Set();
  const memberFolder = new Map();

  for (const folder of folderNodes) {
    for (const member of folder.members) memberFolder.set(member, folder.index);
  }

  function countsLine(info) {
    return `${info.added} added${DOT}${info.modified} modified${DOT}` +
      `${info.deleted} deleted${DOT}${info.tests} tests`;
  }

  function folderBounds() {
    return bounds(folderNodes);
  }

  function applyConceal() {
    for (const [member, fi] of memberFolder) {
      member.el.classList.toggle("concealed", !expanded.has(fi));
    }
    for (const folder of folderNodes) {
      const open = expanded.has(folder.index);
      folder.el.classList.toggle("open", open);
      folder.el.setAttribute("aria-expanded", open ? "true" : "false");
    }
  }

  function toggleFolder(folder) {
    if (touring) exitTour();
    if (expanded.has(folder.index)) expanded.delete(folder.index);
    else expanded.add(folder.index);
    applyConceal();
    flyTo(fitTo(
      expanded.has(folder.index) ? bounds([...folder.members, ...folderNodes]) : folderBounds(),
      viewArea(),
      1.25,
    ));
  }

  function collapseAll() {
    expanded.clear();
    applyConceal();
    userMoved = false;
    flyTo(fitTo(folderBounds(), viewArea(), 1.1));
  }

  for (const folder of folderNodes) {
    const card = el("button", "fcard");
    card.setAttribute("data-folder", folder.key);
    card.setAttribute("type", "button");
    card.setAttribute("aria-expanded", "false");
    card.setAttribute("title", folder.info.label);
    card.style.left = `${folder.x}px`;
    card.style.top = `${folder.y}px`;
    card.style.width = `${folder.w}px`;
    card.style.height = `${folder.h}px`;
    add(card, el("div", "f-name", folder.info.label), el("div", "f-counts", countsLine(folder.info)));
    const list = el("div", "flist");
    for (const member of folder.members) {
      const row = el("button", `fmem st-${member.status}`);
      row.setAttribute("type", "button");
      add(row, el("span", "fmem-name", member.name), el("span", "fmem-tag", member.status));
      row.addEventListener("click", (event) => {
        event.stopPropagation();
        select(member, true);
      });
      list.appendChild(row);
    }
    card.appendChild(list);
    card.addEventListener("click", (event) => {
      event.stopPropagation();
      if (!dragged) toggleFolder(folder);
    });
    card.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.stopPropagation();
      toggleFolder(folder);
    });
    folder.el = card;
    world.appendChild(card);
  }

  for (const node of nodes) {
    const card = el("div", `node ${node.kind === "file" ? "chip" : "sym"} st-${node.status}`);
    card.setAttribute("data-node", node.key);
    card.setAttribute("tabindex", "0");
    card.setAttribute("role", "button");
    card.style.left = `${node.x}px`;
    card.style.top = `${node.y}px`;
    card.style.width = `${node.w}px`;
    card.style.height = `${node.h}px`;
    node.el = card;
    if (node.kind === "symbol") symbolCard(node);
    else fileCard(node);
    world.appendChild(card);
  }

  if (grouped) applyConceal();

  /* Camera */

  const cam = { x: 0, y: 0, k: 1 };
  const all = { x: 0, y: 0, w: LAYOUT.w, h: LAYOUT.h };
  let userMoved = false;

  function applyCamera() {
    world.style.transform = `translate(${round(cam.x)}px, ${round(cam.y)}px) scale(${cam.k.toFixed(4)})`;
    viewport.style.backgroundPosition = `${round(cam.x)}px ${round(cam.y)}px`;
    viewport.style.backgroundSize = `${round(24 * cam.k)}px ${round(24 * cam.k)}px`;
    world.classList.toggle("far", cam.k < 0.55);
  }

  function bounds(list) {
    if (!list.length) return all;
    const x = Math.min(...list.map((n) => n.x));
    const y = Math.min(...list.map((n) => n.y));
    return { x, y, w: Math.max(...list.map((n) => n.x + n.w)) - x, h: Math.max(...list.map((n) => n.y + n.h)) - y };
  }

  function fitTo(box, area, maxK) {
    const pad = 32;
    const k = clamp(Math.min(area.w / (box.w + 2 * pad), area.h / (box.h + 2 * pad)), 0.12, maxK);
    return {
      k,
      x: area.x + area.w / 2 - (box.x + box.w / 2) * k,
      y: area.y + area.h / 2 - (box.y + box.h / 2) * k,
    };
  }

  function viewArea() {
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    const drawer = drawerOpen() ? Math.min(520, w * 0.92) : 0;
    return { x: 16, y: 16, w: Math.max(200, w - 32 - drawer), h: Math.max(200, h - 88) };
  }

  function fit() {
    Object.assign(cam, fitTo(all, viewArea(), 1.1));
    applyCamera();
  }

  function open() {
    if (grouped) {
      Object.assign(cam, fitTo(folderBounds(), viewArea(), 1.1));
      applyCamera();
      return;
    }
    const area = viewArea();
    const whole = fitTo(all, area, 1.1);
    const band = LAYOUT.bands.find((b) => b[0] === "changed");
    if (whole.k >= LEGIBLE || !band) {
      Object.assign(cam, whole);
    } else {
      const box = { x: band[1], y: band[2], w: band[3], h: band[4] };
      const lane = fitTo(box, area, 1.1);
      if (lane.k >= LEGIBLE) Object.assign(cam, lane);
      else Object.assign(cam, {
        k: LEGIBLE,
        x: box.w * LEGIBLE <= area.w ? area.x + area.w / 2 - (box.x + box.w / 2) * LEGIBLE : area.x - box.x * LEGIBLE,
        y: area.y - box.y * LEGIBLE,
      });
    }
    applyCamera();
  }

  let flight = 0;

  function flyTo(target) {
    const from = { ...cam };
    const start = performance.now();
    const id = ++flight;
    const step = (now) => {
      if (id !== flight) return;
      const p = ease(clamp((now - start) / 420, 0, 1));
      const k = from.k * Math.pow(target.k / from.k, p);
      const cx = lerp(centreX(from), centreX(target), p);
      const cy = lerp(centreY(from), centreY(target), p);
      Object.assign(cam, { k, x: viewport.clientWidth / 2 - cx * k, y: viewport.clientHeight / 2 - cy * k });
      applyCamera();
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  const lerp = (a, b, p) => a + (b - a) * p;
  const centreX = (c) => (viewport.clientWidth / 2 - c.x) / c.k;
  const centreY = (c) => (viewport.clientHeight / 2 - c.y) / c.k;

  function zoomAt(factor, sx, sy) {
    const k = clamp(cam.k * factor, 0.12, 2.5);
    cam.x = sx - ((sx - cam.x) * k) / cam.k;
    cam.y = sy - ((sy - cam.y) * k) / cam.k;
    cam.k = k;
    userMoved = true;
    applyCamera();
  }

  let drag = null;
  let dragged = false;

  viewport.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || $("drawer").contains(event.target) || event.target.closest(".zoom")) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY, cx: cam.x, cy: cam.y, captured: false };
    dragged = false;
  });

  viewport.addEventListener("pointermove", (event) => {
    if (!drag || drag.id !== event.pointerId) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (!drag.captured && Math.hypot(dx, dy) < 4) return;
    if (!drag.captured) {
      drag.captured = true;
      dragged = true;
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add("dragging");
      pause();
    }
    flight++;
    cam.x = drag.cx + dx;
    cam.y = drag.cy + dy;
    userMoved = true;
    applyCamera();
  });

  const endDrag = () => {
    drag = null;
    viewport.classList.remove("dragging");
  };
  viewport.addEventListener("pointerup", endDrag);
  viewport.addEventListener("pointercancel", endDrag);

  viewport.addEventListener("wheel", (event) => {
    if ($("drawer").contains(event.target)) return;
    event.preventDefault();
    flight++;
    pause();
    const rect = viewport.getBoundingClientRect();
    if (event.ctrlKey || event.metaKey) {
      zoomAt(Math.exp(-event.deltaY * 0.01), event.clientX - rect.left, event.clientY - rect.top);
    } else {
      cam.x -= event.deltaX;
      cam.y -= event.deltaY;
      userMoved = true;
      applyCamera();
    }
  }, { passive: false });

  viewport.addEventListener("click", (event) => {
    if (dragged || touring) return;
    if (event.target === viewport || event.target === world || event.target.classList.contains("band")) {
      select(null);
    }
  });

  $("zoom-in").addEventListener("click", () => zoomAt(1.25, viewport.clientWidth / 2, viewport.clientHeight / 2));
  $("zoom-out").addEventListener("click", () => zoomAt(0.8, viewport.clientWidth / 2, viewport.clientHeight / 2));
  $("zoom-fit").addEventListener("click", () => {
    userMoved = false;
    fit();
  });

  /* Hover and selection */

  let selected = null;

  function light(node) {
    world.classList.toggle("hovering", Boolean(node));
    for (const n of nodes) n.el.classList.toggle("lit", Boolean(node) && (n === node || node.near.has(n)));
    for (const e of edges) e.el.classList.toggle("lit", Boolean(node) && (e.src === node || e.dst === node));
  }

  for (const node of nodes) {
    node.el.addEventListener("pointerenter", () => {
      if (!touring && !drag) light(node);
    });
    node.el.addEventListener("pointerleave", () => {
      if (!touring) light(selected);
    });
    node.el.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.stopPropagation();
      select(node);
    });
    node.el.addEventListener("click", (event) => {
      event.stopPropagation();
      if (dragged) return;
      select(node);
    });
  }

  const drawer = $("drawer");
  const drawerOpen = () => drawer.getAttribute("aria-hidden") === "false";

  function select(node, centre) {
    if (touring) exitTour();
    if (selected) selected.el.classList.remove("selected");
    selected = node;
    light(node);
    if (!node) {
      drawer.setAttribute("aria-hidden", "true");
      return;
    }
    node.el.classList.add("selected");
    fillDrawer(node);
    drawer.setAttribute("aria-hidden", "false");
    if (centre) {
      const area = viewArea();
      const k = Math.max(cam.k, 0.8);
      flyTo({ k, x: area.x + area.w / 2 - (node.x + node.w / 2) * k, y: area.y + area.h / 2 - (node.y + node.h / 2) * k });
    }
  }

  function section(title, body) {
    return add(el("section", "d-section"), el("h3", "d-title", title), body);
  }

  function diffView(hunks) {
    if (!hunks.length) return el("div", "d-empty", "No line changes recorded for this item.");
    const box = el("div", "diff");
    const rows = el("div", "diff-rows");
    for (const hunk of hunks) {
      rows.appendChild(el("div", "hunk-head", `@@ ${MINUS}${hunk.old_start} +${hunk.new_start} @@`));
      for (const line of hunk.lines) {
        const kind = line.op === "+" ? "add" : line.op === "-" ? "del" : "ctx";
        add(rows, add(el("div", `dl ${kind}`),
          el("span", "ln", line.old === null ? "" : line.old),
          el("span", "ln", line.new === null ? "" : line.new),
          el("span", "sg", kind === "add" ? "+" : kind === "del" ? MINUS : ""),
          el("span", "code", line.text)));
      }
    }
    return add(box, rows);
  }

  const EDGE_TAG = { added: "new call", removed: "removed call", kept: "call" };

  function linkList(items, empty) {
    if (!items.length) return el("div", "d-empty", empty);
    const list = el("div", "links");
    for (const { node, tag, tagClass } of items) {
      const row = el("button", `link st-${node.status}`);
      row.setAttribute("type", "button");
      const text = el("span", "link-text");
      add(text, el("span", "link-name", node.name), el("span", "link-path", node.path));
      add(row, el("span", "bar"), text, tag ? el("span", `etag ${tagClass || ""}`, tag) : null);
      row.addEventListener("click", () => select(node, true));
      list.appendChild(row);
    }
    return list;
  }

  const edgeItem = (edge, other) => ({
    node: other,
    tag: `${EDGE_TAG[edge.status]}${edge.byName ? " \u00b7 by name" : ""}`,
    tagClass: edge.status,
  });

  function fillDrawer(node) {
    drawer.replaceChildren();
    drawer.className = `drawer st-${node.status}`;
    const head = el("div", "d-head");
    const tags = el("div", "d-tags");
    if (PILL[node.status]) tags.appendChild(el("span", "pill", PILL[node.status]));
    tags.appendChild(el("span", "d-kind", node.kind === "file" ? `${node.file.kind} file` : node.sym.kind));
    const close = el("button", "d-close", "\u00d7");
    close.setAttribute("type", "button");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", () => select(null));
    add(head, el("div", "bar"), tags, el("div", "d-name", node.kind === "file" ? node.path : node.name),
      node.kind === "file" ? null : el("div", "d-path", node.path), close);

    const facts = el("div", "d-facts");
    const body = el("div", "d-body");

    if (node.kind === "file") {
      const file = node.file;
      add(facts, el("span", "fact", `+${file.added} ${MINUS}${file.removed}`));
      if (file.sensitive) facts.appendChild(el("span", "fact bad", file.sensitive));
      const brief = briefFile.get(file.path);
      if (file.sensitive && brief && !brief.named) facts.appendChild(el("span", "fact warn", "not mentioned in the description"));
      if (file.language === null && file.kind === "code") facts.appendChild(el("span", "fact", "not parsed"));
      add(body, section("Diff", diffView(file.hunks)));
      const inside = file.symbols.map((id) => symbolNode.get(id)).filter(Boolean);
      if (inside.length) body.appendChild(section("Symbols", linkList(inside.map((n) => ({ node: n })), "")));
    } else {
      const sym = node.sym;
      if (node.status !== "context") add(facts, el("span", "fact", `+${sym.added} ${MINUS}${sym.removed}`));
      facts.appendChild(el("span", "fact", plural(sym.call_sites, "call site", "call sites")));
      if (sym.span) facts.appendChild(el("span", "fact", `lines ${sym.span[0]}\u2013${sym.span[1]}`));
      else if (sym.base_span) facts.appendChild(el("span", "fact", `was lines ${sym.base_span[0]}\u2013${sym.base_span[1]}`));
      if (node.untested) facts.appendChild(el("span", "fact warn", `${NO_TEST}: no test in this map calls it`));
      const callers = node.in.filter((e) => !isTest(e.src));
      const tests = node.in.filter((e) => isTest(e.src));
      add(body,
        section("Diff", node.status === "context" ? el("div", "d-empty", "Unchanged. Shown because it calls or is called by changed code.") : diffView(sym.hunks)),
        section("Callers", linkList(callers.map((e) => edgeItem(e, e.src)), "No caller in the map.")),
        section("Callees", linkList(node.out.map((e) => edgeItem(e, e.dst)), "Calls nothing in the map.")),
        isTest(node) ? null : section("Tests", linkList(tests.map((e) => edgeItem(e, e.src)), "No test calls this directly.")));
    }

    head.appendChild(facts);
    add(drawer, head, body);
  }

  /* Tour */

  const names = (list) => {
    const shown = list.slice(0, 2).map((n) => n.name);
    return list.length > 2 ? `${shown.join(", ")} +${list.length - 2} more` : shown.join(" and ");
  };

  function focusNodes(ids) {
    const found = [];
    for (const id of ids) {
      const node = symbolNode.get(id) || fileNode.get(id);
      if (node) found.push(node);
      else if (fileByPath.has(id)) {
        for (const sid of fileByPath.get(id).symbols) if (symbolNode.has(sid)) found.push(symbolNode.get(sid));
      }
    }
    return found;
  }

  function symbolFacts(node) {
    const sym = node.sym;
    const parts = [node.path, `+${sym.added} ${MINUS}${sym.removed}`];
    if (node.status !== "deleted" && !isTest(node)) parts.push(plural(sym.call_sites, "call site", "call sites"));
    if (node.untested) parts.push(NO_TEST);
    return parts.join(DOT);
  }

  function describe(step, index, total) {
    const count = `${index + 1} / ${total}`;
    const focus = focusNodes(step.focus);
    const node = focus[0];
    const via = step.via ? symbolNode.get(step.via) : null;

    if (step.kind === "overview") {
      return {
        kicker: "Overview", count, main: MAP.title,
        sub: [plural(MAP.files.length, "file", "files"), plural(changed.length, "symbol changed", "symbols changed"),
          plural(added, "call added", "calls added"), `${removed} removed`].join(DOT),
      };
    }

    if (step.kind === "risky_file") {
      const path = step.focus[0] || "";
      const file = fileByPath.get(path);
      const brief = briefFile.get(path);
      const reason = (file && file.sensitive) || (brief && brief.sensitive) || "Sensitive file";
      const unnamed = brief && !brief.named ? `${DOT}not mentioned in the description` : "";
      return { kicker: "Risky surface", count, main: `${reason} changed${unnamed}`, sub: path };
    }

    if (step.kind === "summary") return { kicker: "Summary", count, main: "", sub: "" };

    if (step.kind === "folder") {
      const folder = folderByIndex.get(step.folder);
      const info = folder ? folder.info : { added: 0, modified: 0, deleted: 0, tests: 0 };
      return {
        kicker: "Group", count, main: folder ? folder.info.label : "",
        sub: [plural(focus.length, "symbol", "symbols"),
          `${info.added} added`, `${info.modified} modified`,
          `${info.deleted} deleted`, `${info.tests} tests`].join(DOT),
      };
    }

    if (!node || node.kind !== "symbol") return { kicker: step.kind, count, main: step.focus.join(", "), sub: "" };

    const word = node.sym.kind;
    const name = node.name;

    if (step.kind === "test") {
      const targets = node.out.filter(live).map((e) => e.dst);
      const covers = targets.length ? `${DOT}covers ${names(targets)}` : "";
      const main = node.status === "added" ? `New test ${name}${covers}`
        : node.status === "deleted" ? `Deleted test ${name}` : `Test ${name} changed${covers}`;
      return { kicker: "Test", count, main, sub: symbolFacts(node) };
    }

    if (step.kind === "callee" && via) {
      const link = node.in.find((e) => e.src === via);
      let main;
      if (node.status === "deleted") main = `Deleted ${name}${DOT}${via.name} no longer calls it`;
      else if (node.status === "added") main = `New ${word} ${name}${DOT}called by ${via.name}`;
      else if (link && link.status === "added") main = `${via.name} now calls ${name}`;
      else if (link && link.status === "removed") main = `${via.name} no longer calls ${name}`;
      else main = `${name} changed${DOT}called by ${via.name}`;
      return { kicker: `Called from ${via.name}`, count, main, sub: symbolFacts(node) };
    }

    const callers = node.in.filter((e) => live(e) && !isTest(e.src)).map((e) => e.src);
    let main;
    if (node.status === "deleted") {
      const former = node.in.filter((e) => !isTest(e.src)).map((e) => e.src);
      main = `Deleted ${name}${former.length ? `${DOT}${names(former)} no longer ${former.length === 1 ? "calls" : "call"} it` : ""}`;
    } else if (node.status === "added") {
      main = `New ${word} ${name}${callers.length ? `${DOT}called by ${names(callers)}` : `${DOT}nothing calls it yet`}`;
    } else {
      main = `${name} changed${callers.length ? `${DOT}called by ${names(callers)}` : ""}`;
    }
    return { kicker: step.kind === "entry" ? "Entry point" : "Changed", count, main, sub: symbolFacts(node) };
  }

  const timeline = (() => {
    const plan = grouped && MAP.tour.length >= 2 ? [
      MAP.tour[0],
      ...folderNodes.map((folder) => ({
        kind: "folder",
        folder: folder.index,
        focus: folder.members.map((member) => member.sym.id),
        via: null,
      })),
      ...MAP.tour.slice(1),
    ] : MAP.tour;
    const base = plan.map((s) => STEP_SECONDS[s.kind] || 3);
    const fixed = plan.reduce((sum, s, i) => sum + (s.kind === "overview" || s.kind === "summary" ? base[i] : 0), 0);
    const middle = base.reduce((sum, v) => sum + v, 0) - fixed;
    const scale = middle > 0 && fixed + middle > MAX_TOUR ? Math.max((MAX_TOUR - fixed) / middle, 0) : 1;
    let start = 0;
    return plan.map((step, i) => {
      const plain = step.kind === "overview" || step.kind === "summary";
      const duration = Math.round((plain ? base[i] : Math.max(base[i] * scale, MIN_STEP)) * 1000) / 1000;
      const focus = focusNodes(step.focus);
      const via = step.via ? symbolNode.get(step.via) : null;
      const lit = new Set(focus);
      if (via) lit.add(via);
      if (step.kind !== "risky_file" && step.kind !== "folder") for (const n of focus) for (const m of n.near) lit.add(m);
      const item = {
        kind: step.kind, focus: step.focus, via: step.via, folder: step.folder ?? null,
        start: Math.round(start * 1000) / 1000, duration,
        caption: describe(step, i, plan.length), nodes: focus, viaNode: via, lit, plain: plain || !focus.length,
      };
      start += duration;
      return item;
    });
  })();

  const duration = Math.round(timeline.reduce((sum, s) => sum + s.duration, 0) * 1000) / 1000;

  function tourCamera(step) {
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    const area = { x: 48, y: 32, w: Math.max(200, w - 96), h: Math.max(160, h - 32 - 176) };
    if (step.folder !== undefined && step.folder !== null) {
      const folder = folderByIndex.get(step.folder);
      const box = folder
        ? { x: folder.x - 16, y: folder.y - 16, w: folder.w + 32, h: folder.h + 32 }
        : all;
      return fitTo(box, area, 1.25);
    }
    if (step.plain) return fitTo(all, step.kind === "summary" ? { x: 16, y: 16, w: w - 32, h: h - 32 } : area, 1.1);
    const core = step.viaNode ? [...step.nodes, step.viaNode] : step.nodes;
    const wide = fitTo(bounds([...step.lit]), area, 1.25);
    return wide.k >= 0.62 ? wide : fitTo(bounds(core), area, 1.25);
  }

  let cameras = null;

  function camerasFor() {
    const size = `${viewport.clientWidth}x${viewport.clientHeight}`;
    if (!cameras || cameras.size !== size) cameras = { size, list: timeline.map(tourCamera) };
    return cameras.list;
  }

  const plainLevel = (step) => (step.kind === "summary" ? BEHIND_SUMMARY : 1);
  const nodeLevel = (step, node) => (step.plain ? plainLevel(step) : step.lit.has(node) ? 1 : DIM_NODE);
  const hidden = LAYOUT.dense ? 0 : DIM_EDGE;
  const edgeLevel = (step, edge) => {
    if (step.plain) return LAYOUT.dense ? 0 : plainLevel(step);
    return step.nodes.includes(edge.src) || step.nodes.includes(edge.dst) ? 1 : hidden;
  };

  const caption = $("caption");
  const summary = $("summary");
  let captionFor = -1;

  function fillCaption(index) {
    if (captionFor === index) return;
    captionFor = index;
    const text = timeline[index].caption;
    const kicker = add(el("div", "cap-kicker"), el("span", "", text.kicker), el("span", "cap-count", text.count));
    caption.replaceChildren(kicker, el("div", "cap-main", text.main), el("div", "cap-sub", text.sub));
  }

  function fillSummary() {
    summary.replaceChildren();
    const cell = (num, label, cls) => add(el("div", `sum-cell ${cls || ""}`), el("div", "sum-num", num), el("div", "sum-label", label));
    const grid = add(el("div", "sum-grid"),
      cell(changed.length, changed.length === 1 ? "symbol changed" : "symbols changed"),
      cell(added ? `+${added}` : "0", added === 1 ? "call added" : "calls added", added ? "good" : ""),
      cell(removed ? `${MINUS}${removed}` : "0", removed === 1 ? "call removed" : "calls removed", removed ? "bad" : ""),
      cell(callSites, "call sites affected"),
      cell(untested.length, `changed ${untested.length === 1 ? "symbol" : "symbols"} with ${NO_TEST}`, untested.length ? "warn" : "good"),
      cell(ci.word, ci.failed ? `CI failed: ${ci.failed.map((c) => c.name).join(", ")}` : "CI on the head commit", ci.cls));
    const toured = new Set(MAP.tour.flatMap((step) => step.focus));
    const skipped = changedCode.filter((n) => !toured.has(n.sym.id)).length;
    const note = skipped ? el("div", "sum-note", `${plural(skipped, "more changed symbol", "more changed symbols")} on the map, not in this tour`) : null;
    add(summary, el("div", "sum-kicker", "What this PR rewired"), el("div", "sum-title", MAP.title), grid, note,
      el("div", "sum-brand", "PR map \u00b7 computed from the code, no AI drew this"));
  }

  fillSummary();

  let touring = false;

  function enterTour() {
    if (touring) return;
    select(null);
    light(null);
    touring = true;
    document.body.classList.add("touring");
  }

  function exitTour() {
    pause();
    if (!touring) return;
    touring = false;
    document.body.classList.remove("touring");
    for (const n of nodes) {
      n.el.style.opacity = "";
      n.el.classList.remove("focus");
    }
    for (const e of edges) {
      e.el.style.opacity = "";
      e.el.style.strokeDashoffset = "";
    }
    captionFor = -1;
  }

  function stepAt(t) {
    let index = 0;
    while (index + 1 < timeline.length && timeline[index + 1].start <= t) index++;
    return index;
  }

  function seek(time) {
    if (!timeline.length) return;
    const t = clamp(Number(time) || 0, 0, duration);
    enterTour();
    const index = stepAt(t);
    const step = timeline[index];
    const prev = timeline[Math.max(index - 1, 0)];
    const u = t - step.start;
    const p = index === 0 ? 1 : ease(clamp(u / MOVE, 0, 1));
    const cams = camerasFor();
    const from = cams[Math.max(index - 1, 0)];
    const to = cams[index];
    const k = from.k * Math.pow(to.k / from.k, p);
    const vw = viewport.clientWidth / 2;
    const vh = viewport.clientHeight / 2;
    const cx = lerp((vw - from.x) / from.k, (vw - to.x) / to.k, p);
    const cy = lerp((vh - from.y) / from.k, (vh - to.y) / to.k, p);
    Object.assign(cam, { k, x: vw - cx * k, y: vh - cy * k });
    applyCamera();

    for (const n of nodes) {
      n.el.style.opacity = String(round(lerp(nodeLevel(prev, n), nodeLevel(step, n), p) * 100) / 100);
      n.el.classList.toggle("focus", !step.plain && step.nodes.includes(n));
    }
    const offset = String(-round((t * 28) % 28));
    for (const e of edges) {
      e.el.style.opacity = String(round(lerp(edgeLevel(prev, e), edgeLevel(step, e), p) * 100) / 100);
      if (e.status === "added") e.el.style.strokeDashoffset = offset;
    }

    const last = index === timeline.length - 1;
    const fadeIn = clamp((u - 0.25) / 0.45, 0, 1);
    const fadeOut = last ? 1 : clamp((step.duration - u) / 0.35, 0, 1);
    fillCaption(index);
    caption.style.opacity = step.kind === "summary" ? "0" : String(round(Math.min(fadeIn, fadeOut) * 100) / 100);
    summary.style.opacity = step.kind === "summary" ? String(round(clamp((u - 0.3) / 0.6, 0, 1) * 100) / 100) : "0";
    $("progress-bar").style.width = `${round((t / duration) * 1000) / 10}%`;
  }

  /* Playback */

  const player = { t: 0, playing: false, until: null, last: 0 };

  function setPlaying(on) {
    player.playing = on;
    document.body.classList.toggle("playing", on);
    $("play-label").textContent = on ? "Pause" : player.t >= duration && touring ? "Replay" : "Play tour";
  }

  function frame(now) {
    if (!player.playing) return;
    player.t = Math.min(duration, player.t + (now - player.last) / 1000);
    player.last = now;
    if (player.until !== null && player.t >= player.until) player.t = player.until;
    seek(player.t);
    if (player.t >= duration || (player.until !== null && player.t >= player.until)) setPlaying(false);
    else requestAnimationFrame(frame);
  }

  function run(from, until) {
    flight++;
    player.t = from;
    player.until = until;
    player.last = performance.now();
    seek(from);
    setPlaying(true);
    requestAnimationFrame(frame);
  }

  function pause() {
    if (player.playing) setPlaying(false);
  }

  function goto(index) {
    const i = clamp(index, 0, timeline.length - 1);
    const step = timeline[i];
    run(step.start, step.start + Math.min(step.duration - 0.4, MOVE + 0.6));
  }

  function next() {
    if (!touring) return goto(0);
    goto(stepAt(player.t) + 1);
  }

  function prev() {
    if (!touring) return goto(0);
    goto(stepAt(player.t) - 1);
  }

  $("play").addEventListener("click", () => {
    if (player.playing) return pause();
    const from = touring && player.t < duration ? player.t : 0;
    run(from, null);
  });

  document.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const key = event.key;
    if (key === "Escape") {
      if (drawerOpen()) select(null);
      else if (grouped && expanded.size) collapseAll();
      else if (touring) exitTour();
    } else if (key === "ArrowRight" || key === " " || key === "PageDown") {
      next();
    } else if (key === "ArrowLeft" || key === "PageUp") {
      prev();
    } else if (key === "f" || key === "F") {
      if (touring) exitTour();
      userMoved = false;
      fit();
    } else if (key === "+" || key === "=") {
      zoomAt(1.25, viewport.clientWidth / 2, viewport.clientHeight / 2);
    } else if (key === "-" || key === "_") {
      zoomAt(0.8, viewport.clientWidth / 2, viewport.clientHeight / 2);
    } else {
      return;
    }
    event.preventDefault();
  });

  window.addEventListener("resize", () => {
    if (touring) seek(player.t);
    else if (!userMoved) open();
  });

  open();

  window.prcTour = Object.freeze({
    duration,
    steps: timeline.map((s) => Object.freeze({
      kind: s.kind, focus: [...s.focus], via: s.via, start: s.start, duration: s.duration,
      caption: Object.freeze({ ...s.caption }),
    })),
    seek: (t) => {
      pause();
      player.t = clamp(Number(t) || 0, 0, duration);
      seek(player.t);
    },
  });
})();
</script></body></html>
