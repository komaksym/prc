    --card-ctx: #f9fafb;
    --border: #e1e4ea;
    --border-strong: #cfd4dc;
    --band: rgba(15, 23, 42, 0.022);
    --text: #0f1420;
    --muted: #5b6372;
    --faint: #8b93a1;
    --green: #129b5a;
    --amber: #c27c0e;
    --red: #d6363f;
    --grey: #9aa1ad;
    --accent: #4f5bd5;

    --add-bg: rgba(18, 155, 90, 0.1);
    --del-bg: rgba(214, 54, 63, 0.09);
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 6px 20px rgba(15, 23, 42, 0.07);
    --shadow-lg: 0 24px 64px rgba(15, 23, 42, 0.18);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
}

.st-added { --st: var(--green); }
.st-modified { --st: var(--amber); }
.st-deleted { --st: var(--red); }
.st-context { --st: var(--grey); }

/* Header */

.top {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-solid);
  position: relative;
  z-index: 5;
}

.headline { min-width: 0; flex: 1 1 0; }

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}

.logo {
  display: inline-grid;
  grid-template-columns: repeat(3, 4px);
  gap: 2px;
  align-items: center;
}

.logo i {
  display: block;
  width: 4px;
  height: 12px;
  border-radius: 2px;
  background: var(--green);
}

.logo i:nth-child(2) { height: 8px; background: var(--amber); }
.logo i:nth-child(3) { height: 5px; background: var(--red); }

.brand-name {
  color: var(--text);
  font-weight: 600;
  letter-spacing: 0.01em;
}

.meta { overflow: hidden; text-overflow: ellipsis; }
.meta .sep { color: var(--faint); margin: 0 6px; }
.meta .mono { font-family: var(--mono); font-size: 11.5px; }

.meta a {
  color: var(--accent);
  text-decoration: none;
}

.meta a:hover { text-decoration: underline; }

h1 {
  margin: 4px 0 0;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.012em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stats {
  display: flex;
  gap: 8px;
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
}

.stat {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 72px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--raise);
  white-space: nowrap;
}

.stat-value {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 17px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
}

.stat.good .stat-value { color: var(--green); }
.stat.bad .stat-value { color: var(--red); }
.stat.warn .stat-value { color: var(--amber); }
.stat.none .stat-value { color: var(--muted); }

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
}

.play {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 16px 0 14px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--text);
  color: var(--bg);
  font-weight: 600;
  white-space: nowrap;
  box-shadow: var(--shadow);
}

.play:hover { opacity: 0.9; }

.play-icon {
  width: 0;
  height: 0;
  border-left: 9px solid currentColor;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.playing .play-icon {
  width: 10px;
  height: 12px;
  border: 0;
  border-left: 3px solid currentColor;
  border-right: 3px solid currentColor;
}

/* Canvas */

.viewport {
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.2px);
  background-size: 24px 24px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.viewport.dragging { cursor: grabbing; }

.world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
}

.band {
  position: absolute;
  border: 1px dashed var(--border);
  border-radius: 16px;
  background: var(--band);
}

.band-label {
  position: absolute;
  left: 16px;
  top: 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  white-space: nowrap;
}

.edges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.e {
  fill: none;
  stroke: var(--edge);
  stroke-width: 1.5;
  transition: opacity 160ms ease;
}

.e-added {
  stroke: var(--green);
  stroke-width: 2;
  stroke-dasharray: 8 6;
  animation: flow 1s linear infinite;
}

.e-removed {
  stroke: var(--red);
  stroke-width: 1.75;
  stroke-dasharray: 5 5;
  opacity: 0.85;
}

.e-name {
  stroke-dasharray: 1 6;
  stroke-linecap: round;
  stroke-width: 2.25;
}

.e-added.e-name { stroke-width: 2.5; }

.arrow-added { fill: var(--green); }
.arrow-removed { fill: var(--red); }
.arrow-kept { fill: var(--edge); }

@keyframes flow {
  to { stroke-dashoffset: -28; }
}

/* Nodes */

.node {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 8px 12px 8px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
  transition: opacity 160ms ease, border-color 120ms ease, box-shadow 160ms ease;
}

.node:hover { border-color: var(--border-strong); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.node .bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--st);
}

.node.st-context {
  background: var(--card-ctx);
  border-style: dashed;
  box-shadow: none;
}

.node.st-context .bar { opacity: 0.6; }

.n-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.glyph {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1px solid var(--border-strong);
  color: var(--muted);
  font: 600 10.5px/1 var(--mono);
}

.name {
  min-width: 0;
  flex: 1 1 auto;
  font: 600 13px/1.3 var(--mono);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.st-context .name { color: var(--muted); font-weight: 500; }

.st-deleted .name {
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 1.5px;
  color: var(--muted);
}

.pill {
  flex: none;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--st);
  background: color-mix(in srgb, var(--st) 14%, transparent);
}

.path {
  font: 11px/1.35 var(--mono);
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}

.path > span { direction: ltr; unicode-bidi: isolate; }

.n-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
}

.n-row > .path { flex: 1 1 auto; min-width: 0; }

.n-row > .sites {
  flex: none;
  font-size: 11px;
  color: var(--faint);
}

.delta { font: 600 11.5px/1 var(--mono); }
.plus { color: var(--green); }
.minus { color: var(--red); }

.badge {
  margin-left: auto;
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
  background: color-mix(in srgb, var(--amber) 10%, transparent);
}

.chip {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 12px 0 16px;
  border-radius: 999px;
}

.chip .bar { width: 3px; }

.chip .name { flex: 0 1 auto; font-weight: 500; font-size: 12.5px; }
.chip.st-deleted .name { color: var(--muted); }

/* Grouped overview */

.fedges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.ge {
  fill: none;
  stroke: var(--edge);
  stroke-width: 2;
}

.ge-added { stroke: var(--green); }
.ge-removed { stroke: var(--red); }

.fcard {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 10px 14px 10px 16px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  overflow: hidden;
}

.fcard:hover { border-color: var(--border-strong); }
.fcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.f-name {
  font: 600 13px/1.3 var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.f-counts {
  font: 11px/1.4 var(--mono);
  color: var(--muted);
}

.flist {
  display: none;
  margin-top: 6px;
  border-top: 1px solid var(--border);
  padding-top: 6px;
  gap: 2px;
  overflow: auto;
}

.fcard.open {
  justify-content: flex-start;
  height: auto !important;
  max-height: 360px;
  z-index: 5;
}

.fcard.open .flist { display: grid; }

.fmem {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 4px 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  text-align: left;
}

.fmem:hover { background: var(--band); }

.fmem-name {
  flex: 1 1 auto;
  min-width: 0;
  font: 12px/1.35 var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fmem-tag {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.world.grouped .node.concealed { opacity: 0; }

.dense .sym {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 8px 0 12px;
  border-radius: 8px;
  box-shadow: none;
}

.dense .sym .bar { width: 3px; }
.dense .sym .name { font-size: 12px; }
.dense .sym .glyph { width: 16px; height: 16px; font-size: 9.5px; }
.dense .sym .pill { padding: 0 5px; font-size: 9px; }

.flag {
  flex: none;
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  font: 700 10px/1 var(--sans);
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
}

.group {
  position: absolute;
  padding: 6px 4px 0;
  font: 11px/1.3 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
  pointer-events: none;
}

.group > span { direction: ltr; unicode-bidi: isolate; }

body:not(.touring) .dense .e:not(.lit) { opacity: 0; }

.empty {
  position: absolute;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%);
  padding: 12px 20px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
  pointer-events: none;
}

.risk {
  flex: none;
  margin-left: auto;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--red);
  background: color-mix(in srgb, var(--red) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
  white-space: nowrap;
}

.world.far .path,
.world.far .sites { display: none; }
.world.far .name { font-size: 16px; }
.world.far .pill { font-size: 12px; }

.hovering .node:not(.lit),
.hovering .e:not(.lit) { opacity: 0.14; }

.hovering .e.lit { stroke-width: 2.5; }

.node.lit { border-color: var(--border-strong); }

.node.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent), var(--shadow);
}

.node.focus {
  border-color: var(--st);
  box-shadow: 0 0 0 1px var(--st), 0 0 40px color-mix(in srgb, var(--st) 40%, transparent), var(--shadow);
}

/* Tour */

.touring .node,
.touring .e { transition: none; }

.touring .e-added { animation: none; }

.spot {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 35%, color-mix(in srgb, var(--bg) 82%, transparent) 100%);
}

.touring .spot { opacity: 1; }

.progress {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 2px;
  display: none;
}

.touring .progress { display: block; }

#progress-bar {
  height: 100%;
  width: 0;
  background: var(--accent);
}

.caption {
  position: absolute;
  left: 50%;
  bottom: 40px;
  width: min(760px, calc(100% - 48px));
  transform: translateX(-50%);
  padding: 16px 24px 18px;
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .caption { display: block; }

.cap-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.cap-count { color: var(--faint); font-variant-numeric: tabular-nums; }

.cap-main {
  margin-top: 6px;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.015em;
}

.cap-main .code { font-family: var(--mono); font-size: 20px; }

.cap-sub {
  margin-top: 6px;
  font: 12.5px/1.4 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.summary {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(720px, calc(100% - 48px));
  transform: translate(-50%, -50%);
  padding: 32px 40px;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  background: var(--panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .summary { display: block; }

.sum-kicker {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.sum-title {
  margin-top: 8px;
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -0.015em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sum-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 24px;
}

.sum-cell {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--raise);
}

.sum-num {
  font-size: 40px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.sum-label { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.sum-cell.good .sum-num { color: var(--green); }
.sum-cell.bad .sum-num { color: var(--red); }
.sum-cell.warn .sum-num { color: var(--amber); }

.sum-note {
  margin-top: 16px;
  color: var(--muted);
  font-size: 14px;
}

.sum-brand {
  margin-top: 24px;
  font-size: 12px;
  color: var(--faint);
}

/* Floating controls */

.legend {
  position: absolute;
  left: 16px;
  bottom: 16px;
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 11.5px;
  color: var(--muted);
  box-shadow: var(--shadow);
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.sw {
  width: 10px;
  height: 10px;
  margin-left: 6px;
  border-radius: 3px;
  background: var(--st);
}

.sw:first-child, .ls:first-child { margin-left: 0; }
.ls { width: 32px; height: 8px; margin-left: 8px; overflow: visible; }

.zoom {
  position: absolute;
  right: 16px;
  bottom: 16px;
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.zoom button {
  min-width: 36px;
  height: 32px;
  padding: 0 10px;
  border: 0;
  border-right: 1px solid var(--border);
  background: transparent;
  font-size: 13px;
  color: var(--muted);
}

.zoom button:last-child { border-right: 0; }
.zoom button:hover { color: var(--text); background: var(--band); }

.touring .legend,
.touring .zoom { opacity: 0; pointer-events: none; }

/* Drawer */

.drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 92vw);
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--panel-solid);
  box-shadow: var(--shadow-lg);
  transform: translateX(104%);

  user-select: text;
}

.drawer[aria-hidden="false"] { transform: none; }

.d-head {
  position: relative;
  padding: 20px 56px 16px 24px;
  border-bottom: 1px solid var(--border);
}

.d-head .bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--st);
}

.d-tags { display: flex; align-items: center; gap: 8px; }

.d-kind {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.d-name {
  margin: 8px 0 4px;
  font: 650 18px/1.3 var(--mono);
  letter-spacing: -0.01em;

}

.st-deleted .d-name { text-decoration: line-through; text-decoration-color: var(--red); }

.d-path { font: 12px/1.4 var(--mono); color: var(--muted); word-break: break-all; }

.d-close {
  position: absolute;
  right: 16px;
  top: 16px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}

.d-close:hover { color: var(--text); border-color: var(--border-strong); }

.d-facts {

  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
}

.fact {

}

.fact.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.fact.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

  overflow: auto;
  padding: 8px 0 24px;
}

.d-section { padding: 16px 24px 0; }

.d-title {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}

.d-empty { font-size: 12.5px; color: var(--faint); }

.diff {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: auto;
  background: var(--bg);
  font: 12px/20px var(--mono);
}

.diff-rows { width: max-content; min-width: 100%; }

.hunk-head {
  padding: 2px 12px;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-top: 1px solid var(--border);
}

.diff-rows .hunk-head:first-child { border-top: 0; }

.dl {
  display: grid;
  grid-template-columns: 40px 40px 20px auto;
  white-space: pre;
}

.dl .ln {
  padding-right: 8px;
  text-align: right;
  color: var(--faint);
  user-select: none;
}

.dl .sg { text-align: center; user-select: none; }
.dl .code { padding-right: 16px; }
.dl.add { background: var(--add-bg); }
.dl.add .sg { color: var(--green); }
.dl.del { background: var(--del-bg); }
.dl.del .sg { color: var(--red); }

.links { display: grid; gap: 4px; }

.link {
  display: grid;
  grid-template-columns: 4px 1fr auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px 8px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--raise);
  text-align: left;
  overflow: hidden;
}

.link:hover { border-color: var(--border-strong); }
.link .bar { height: 100%; min-height: 32px; background: var(--st); border-radius: 0 2px 2px 0; }
.link-text { min-width: 0; }
.link-name { display: block; font: 600 12.5px/1.35 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link-path { display: block; font: 11px/1.35 var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.etag {
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 6px;
  color: var(--muted);
  border: 1px solid var(--border);
  white-space: nowrap;

.etag.added { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
.etag.removed { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

.foot {

  background: var(--panel-solid);
  font-size: 12px;

.brand-line { font-weight: 550; color: var(--text); opacity: 0.8; }
.hints { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 1440px) {

@media (max-width: 1100px) {

}

@media (prefers-reduced-motion: reduce) {

shortlist result behind one input boundary and a thin private-file CLI. Exact profile identities determine exclusions; verified company aliases determine cap allocation; each rank factor retains evidence or an explicit unknown reason."},{"new":9,"old":null,"op":"+","text":"- [x] Write the E2E failure cases before implementation. Exercise the real CLI and repository client data shapes; keep repeatable evidence free of member records."},{"new":10,"old":null,"op":"+","text":"- [x] Implement source validation, historical exclusions, qualification gates, all-history event bindings, deterministic ranking and private report/audit plans."},{"new":11,"old":null,"op":"+","text":"- [x] Verify the private live export and actionable research queue. Run lint, typecheck, E2E/full tests and build. The all-history audit correctly withholds recommendations until event-specific employer research is supplied. Independent review accepted the complete-source and historical identity gates. The parent reran 47 scenario checks, the CLI wrapper, 22 full-suite checks, scoped lint, 12-file typecheck and both package builds. The raster infographic is included for PR publication."},{"new":12,"old":null,"op":"+","text":""},{"new":13,"old":null,"op":"+","text":"The source snapshots retain no provider generation timestamp. Show this uncertainty separately from acquisition time and complete transport. The collector's `M/D/YY, h:mm AM/PM` dates retain provider-local calendar-day precision with unknown timezone. Supabase invitation timestamps count only when their payload states actual-event semantics; observation times remain unknown. Existing imported research fields contain alignment errors and are not automatically qualification facts. A caller-attested cited envelope must bind exact profile, current role, US location, PVF employer and verified company aliases. The builder validates citation structure and dates but does not fetch the cited pages. No acceptance probability is claimed."},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"The user selected all-history. Every outgoing invitation event, including a dated CRM send, needs an exact-profile, event-date-specific cited employer binding. CRM's current Company value, acceptance, and connection status cannot satisfy that binding. Unknown or unsupported history withholds all recommendations and preserves source pointers in the private research queue."},{"new":16,"old":null,"op":"+","text":""},{"new":17,"old":null,"op":"+","text":"Throughput checkpoint:"},{"new":18,"old":null,"op":"+","text":"- Completed gates: complete live read, failing E2E before implementation, all-history scope, event-date semantics, private audit-only run, and local lint/type/test/build checks."},{"new":19,"old":null,"op":"+","text":"- Independent workstreams: one exclusive implementation owner builds the shortlist; parent researches qualification; a read-only reviewer challenges identity, cap and source gates."},{"new":20,"old":null,"op":"+","text":"- Shared mutable state: the implementation owner alone edits this branch. Private research and source files stay outside the Git checkout. Pushes and report writes remain serialized."},{"new":21,"old":null,"op":"+","text":"- Smallest safe decomposition: one shortlist feature with pure decision logic, private-file CLI, docs and E2E. No migrations, new production dependencies, schedules or outreach sends."},{"new":22,"old":2,"op":" ","text":""},{"new":23,"old":3,"op":" ","text":"## Inbox evidence and actionable report"},{"new":24,"old":4,"op":" ","text":""}],"new_start":1,"old_start":1},{"lines":[{"new":180,"old":160,"op":" ","text":"- Independent workstreams: n/a. The contract couples snapshot validation, planning, and apply behavior, and the clone has one owner."},{"new":181,"old":161,"op":" ","text":"- Shared mutable state: one owner writes the exclusive clone; plan, scenario runner, implementation, and evidence happen in order."},{"new":182,"old":162,"op":" ","text":"- Smallest safe decomposition: one implementation owner keeps the 1:1/group/thread safety invariant visible across the single slice."},{"new":183,"old":null,"op":"+","text":""},{"new":184,"old":null,"op":"+","text":"PR #10 review wave: reproduced 15 failures before production edits across complete empty provider pages, normalized/conflicting CRM send-date labels, imported opt-out flags and non-UTC date precision. Correct interpretation at those input boundaries; preserve strict raw/exported set equality and UTC instant semantics. Expanded the E2E matrix to 70 scenarios. Also reproduced CodeRabbit’s descriptor cleanup failure with a real OS file-size limit; caller-owned descriptor cleanup now preserves the original filesystem error. Parent validation passed all 70 scenarios plus wrapper, 22 full-suite checks, scoped Ruff, 12-file mypy, sdist/wheel and private live-source CLI."},{"new":185,"old":null,"op":"+","text":""},{"new":186,"old":null,"op":"+","text":"## PR10 current-employer contract amendment"},{"new":187,"old":null,"op":"+","text":""},{"new":188,"old":null,"op":"+","text":"The owner's latest current-employer and read-only report contract supersedes earlier plans for employer-at-invitation proof and recommendation persistence. `qualification.current_employers` maps exact normalized profile identities to a registered company and citations. Count each outgoing person once against that mapped employer across provider, CRM, and actual Supabase invitation evidence. Event dates and prior employers remain audit metadata. They do not decide capacity."},{"new":189,"old":null,"op":"+","text":""},{"new":190,"old":null,"op":"+","text":"Conflicting or invalid current-employer assignments, and historical send evidence with unknown identity or employer, enter an explicit private queue and withhold all capacity claims. A candidate whose qualification employer conflicts with the mapping is withheld. The report emits no recommendation event plan. Transport freshness, identity normalization, ranking, suppression, connection exclusion, and previously-invited exclusion remain active."},{"new":191,"old":null,"op":"+","text":""},{"new":192,"old":null,"op":"+","text":"Red-first E2E against `19a769a` produced five expected failures while the prior 70 scenarios passed. The current implementation passes all 75 scenarios. Parent validation passed the 75-scenario matrix plus wrapper, 22 full-suite checks, scoped strict Ruff, 12-file mypy, and sdist/wheel build. The private live-input CLI produced an explicit current-employer queue with no recommendations or event plan and mode0700/0600 artifacts. The qualification envelope is intentionally empty, so no real shortlist eligibility is claimed. The revised raster infographic and reproducible source records are included. Independent correctness review found no actionable defect. PR publication and fresh current-head reviews remain pending; no merge is authorized."},{"new":193,"old":null,"op":"+","text":""},{"new":194,"old":null,"op":"+","text":"PR10 fresh review audit corrections: six invalid canonical-alias scenarios and one distinct unsupported-key queue scenario failed before production fixes. Queued profiles no longer retain resolved current employer assignments or capacity attribution. Every employer queue entry retains a stable opaque key ID and source pointer.82 scenario matrix plus wrapper,22 full-suite checks, scoped strict Ruff,12-file mypy and package builds pass. No report publication or database writes occurred."},{"new":195,"old":null,"op":"+","text":""},{"new":196,"old":null,"op":"+","text":"PR10 Unicode repair verification before publication: 84 scenarios plus wrapper, 22 full-suite checks, strict scoped Ruff, 12-file mypy and builds passed before the usage pause. Pending diff inspected on resume; no source behavior changed since that validation. Separate synthetic CLI proof and independent review requested. Fixed fresh CodeRabbit wording finding by spacing adjacent counts in the matrix record."}],"new_start":180,"old_start":160}],"kind":"docs","language":null,"path":"PLANS.md","removed":0,"sensitive":null,"status":"modified","symbols":[]},{"added":33,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# PR10 present-employer red-first matrix"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"Data shape under test: `current_employers` maps raw LinkedIn profile URL keys to `{company_id, citations}`. URLs normalize through the inbox exact-identity normalizer. The owner-approved assumption is that the latest known employer is present. Invitation, CRM, and actual Supabase send evidence is grouped by canonical person and charged once to that employer across all history. Evidence IDs and source pointers remain in report audit data."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"| Failure case | Expected behavior |"},{"new":6,"old":null,"op":"+","text":"| --- | --- |"},{"new":7,"old":null,"op":"+","text":"| Invitation has no source date | Still counts against mapped latest employer. |"},{"new":8,"old":null,"op":"+","text":"| Same person appears in provider, CRM, and actual send event history | Counts once and retains all three evidence references. |"},{"new":9,"old":null,"op":"+","text":"| Historical CRM Company disagrees with latest employer | Ignore it as employer proof; latest employer owns the count. |"},{"new":10,"old":null,"op":"+","text":"| Profile URL aliases normalize to conflicting current employers | Withhold all capacity claims and queue the identity conflict. |"},{"new":11,"old":null,"op":"+","text":"| Candidate qualification employer differs from owner mapping | Withhold that candidate. |"},{"new":12,"old":null,"op":"+","text":"| Historical invitation has unsupported identity or absent/unregistered mapping | Withhold the global shortlist and retain an explicit queue item. |"},{"new":13,"old":null,"op":"+","text":"| Recommendation report is built | No recommendation event plan or persistence key is emitted. |"},{"new":14,"old":null,"op":"+","text":"| Existing sent/accepted/connectivity/suppression, ranking, exact identity, and transport freshness rules | Preserve prior behavior. |"},{"new":15,"old":null,"op":"+","text":""},{"new":16,"old":null,"op":"+","text":"## Red-first evidence"},{"new":17,"old":null,"op":"+","text":""},{"new":18,"old":null,"op":"+","text":"Run `uv run --cache-dir /private/tmp/action-report-uv-cache --extra dev pytest -q tests/e2e_invitation_shortlist.py` against base `19a769a55a85330ccb43b26e3433c34303e431f0` before implementation. Existing 70 scenarios passed. The five new behavior assertions failed as intended: current-employer all-history accounting, canonical mapping conflict, candidate/mapping conflict, unknown historical identity, and no event plan."},{"new":19,"old":null,"op":"+","text":""},{"new":20,"old":null,"op":"+","text":"- Result: 70 passed, 5 failed. `pytest` first failed to start because the global shim pointed at a removed Python; rerunning through the isolated UV environment completed the red-first matrix."},{"new":21,"old":null,"op":"+","text":"- Sanitized result digest: `sha256:8cd8d7a1ea3aa939`"},{"new":22,"old":null,"op":"+","text":""},{"new":23,"old":null,"op":"+","text":"## Green verification"},{"new":24,"old":null,"op":"+","text":""},{"new":25,"old":null,"op":"+","text":"The revised matrix passes 75 scenarios plus its artifact wrapper. Parent full suite passes 22 checks; scoped strict Ruff, mypy over 12 source files, and wheel/source distribution builds pass. Private real-source CLI returns an explicit unresolved current-employer queue under the empty qualification envelope, without event plans or database access. Outputs retain 0700/0600 permissions. No live shortlist eligibility or finished report publication is claimed."},{"new":26,"old":null,"op":"+","text":""},{"new":27,"old":null,"op":"+","text":"## Review correction"},{"new":28,"old":null,"op":"+","text":""},{"new":29,"old":null,"op":"+","text":"Greptile found a valid canonical employer assignment could remain in audit after an invalid alias queued that same person. Six cases covering malformed assignment, unknown company and missing citations in both orders failed before the correction. Every queued exact profile now loses its resolved assignment and capacity attribution. CodeRabbit found two distinct unsupported employer identity keys collapsed into one queue item; a dedicated scenario reproduced that loss before the correction. Each employer key now has a stable opaque evidence ID and input key index pointer. All 82 scenarios plus the wrapper, 22 full-suite checks, scoped Ruff, 12-file mypy and builds pass. The existing raster diagram still describes these unknown-handling guards accurately."},{"new":30,"old":null,"op":"+","text":""},{"new":31,"old":null,"op":"+","text":"## Unicode key repair"},{"new":32,"old":null,"op":"+","text":""},{"new":33,"old":null,"op":"+","text":"Two JSON-decoded unpaired surrogate key cases failed before the repair because raw UTF-8 hashing raised UnicodeEncodeError before unresolved evidence was recorded. Current-employer key IDs now hash ASCII-escaped JSON bytes. Identity normalization stays unchanged, and invalid keys remain unresolved without exposing them. The 84-scenario matrix plus wrapper, 22 full-suite checks, scoped strict Ruff, 12-file mypy and source/wheel builds pass. Surrogate fixtures use distinct numeric codepoints without a lint suppression."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"PR10-present-employer-e2e-matrix.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":36,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"{"},{"new":2,"old":null,"op":"+","text":"  \"schema_version\": 1,"},{"new":3,"old":null,"op":"+","text":"  \"scenario_count\": 113,"},{"new":4,"old":null,"op":"+","text":"  \"all_scenarios_passed\": true,"},{"new":5,"old":null,"op":"+","text":"  \"red_first_failures_reproduced\": ["},{"new":6,"old":null,"op":"+","text":"    \"provider-local invitation dates lost to ISO-only parsing\","},{"new":7,"old":null,"op":"+","text":"    \"observation timestamps misused as invitation dates\","},{"new":8,"old":null,"op":"+","text":"    \"raw-only provider invitations omitted from exported rows\","},{"new":9,"old":null,"op":"+","text":"    \"history rows without event IDs collapsed to one event\","},{"new":10,"old":null,"op":"+","text":"    \"duplicate prospect IDs allowed event identity misattachment\","},{"new":11,"old":null,"op":"+","text":"    \"CRM-only policy permitted for an all-history report\","},{"new":12,"old":null,"op":"+","text":"    \"complete empty provider pages rejected\","},{"new":13,"old":null,"op":"+","text":"    \"normalized CRM send dates lost or conflicting aliases selected\","},{"new":14,"old":null,"op":"+","text":"    \"text or ambiguous opt-out flags admitted recommendations\","},{"new":15,"old":null,"op":"+","text":"    \"date-precision event calendar days shifted by UTC conversion\","},{"new":16,"old":null,"op":"+","text":"    \"private-file cleanup masked a real filesystem write failure\","},{"new":17,"old":null,"op":"+","text":"    \"undated invitation evidence omitted from latest-employer capacity\","},{"new":18,"old":null,"op":"+","text":"    \"provider, CRM, and Supabase send evidence counted more than once per profile\","},{"new":19,"old":null,"op":"+","text":"    \"conflicting canonical current-employer assignments permitted capacity claims\","},{"new":20,"old":null,"op":"+","text":"    \"candidate qualification employer disagreed with owner mapping\","},{"new":21,"old":null,"op":"+","text":"    \"unknown historical identity omitted from global withhold queue\","},{"new":22,"old":null,"op":"+","text":"    \"read-only report constructed a recommendation persistence event\","},{"new":23,"old":null,"op":"+","text":"    \"invalid canonical employer aliases left contradictory resolved audit entries\","},{"new":24,"old":null,"op":"+","text":"    \"distinct invalid employer identity keys collapsed without source pointers\","},{"new":25,"old":null,"op":"+","text":"    \"unpaired Unicode employer keys failed before unresolved queue recording\","},{"new":26,"old":null,"op":"+","text":"    \"escaped surrogate snapshot metadata blocked complete matching raw and exported rows\","},{"new":27,"old":null,"op":"+","text":"    \"candidate qualification citation attested a different profile\","},{"new":28,"old":null,"op":"+","text":"    \"unique legacy baseline provider identity left unsupported\","},{"new":29,"old":null,"op":"+","text":"    \"Unicode-normalized legacy name left unsupported\","},{"new":30,"old":null,"op":"+","text":"    \"unrelated invitation event prevented the selected baseline binding\","},{"new":31,"old":null,"op":"+","text":"    \"legacy audit evidence remained unresolved despite a unique provider match\","},{"new":32,"old":null,"op":"+","text":"    \"resolved legacy identity retained unsupported rather than missing-employer reasons\","},{"new":33,"old":null,"op":"+","text":"    \"private legacy CLI happy case wrote a withheld report\""},{"new":34,"old":null,"op":"+","text":"  ],"},{"new":35,"old":null,"op":"+","text":"  \"artifact_digest\": \"2922acbc5e96eb7c0af44a58998f35a19d092dfe4a37ef4681930d75a1f8709c\""},{"new":36,"old":null,"op":"+","text":"}"}],"new_start":1,"old_start":0}],"kind":"config","language":null,"path":"artifacts/invitation-shortlist-e2e-evidence.json","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":14,"hunks":[{"lines":[{"new":1,"old":1,"op":" ","text":"# Actionable LinkedIn report"},{"new":2,"old":2,"op":" ","text":""},{"new":null,"old":3,"op":"-","text":"The report has two person-level lists. Aggregate sync counts are diagnostics, not the report's useful output. Each row includes a name, direct profile link, a reason, source evidence, and a concrete next action or message draft."},{"new":3,"old":null,"op":"+","text":"The report gives person-level recommendations with a name, direct profile link, reason, source evidence, and a manual next action. Aggregate sync counts remain diagnostics."},{"new":4,"old":4,"op":" ","text":""},{"new":5,"old":5,"op":" ","text":"## Prioritized invitations"},{"new":6,"old":6,"op":" ","text":""},{"new":null,"old":7,"op":"-","text":"Select up to 25 qualified prospects after excluding existing connections, previously invited profiles, opt-outs, and unresolved identities. Retain the existing US PVF targeting and three-per-company lifetime cap across verified company aliases."},{"new":7,"old":null,"op":"+","text":"Select up to 25 qualified prospects after excluding existing connections, previously invited profiles, opt-outs, unresolved identities, and candidates whose qualification employer conflicts with the current-employer mapping. Keep the existing US PVF targeting and three-per-company lifetime cap across company aliases."},{"new":8,"old":8,"op":" ","text":""},{"new":null,"old":9,"op":"-","text":"Rank eligible candidates using observed professional activity, mutual connections when available, connection count, and profile completeness, including whether a profile photo is present. Show the factors, their dates, unknown signals, and the scoring version. These are inputs to a heuristic priority score. A score is not an acceptance probability until real invitation outcomes support calibration. Save sent and accepted outcomes separately to make that calibration possible. Do not fill the list with ineligible people just to reach 25."},{"new":9,"old":null,"op":"+","text":"The owner-approved capacity assumption uses each person's latest known employer as present. Count each canonical profile once across all outgoing invitation history. The report must retain source evidence IDs and pointers for provider invitation rows, CRM sent facts, and actual Supabase invitation events. Historical event dates remain audit metadata. They do not establish which employer receives the cap count."},{"new":10,"old":null,"op":"+","text":""},{"new":11,"old":null,"op":"+","text":"Rank eligible candidates using observed professional activity, mutual connections when available, connection count, and profile completeness, including whether a profile photo is present. Show the factors, their dates, unknown signals, and the scoring version. The score is a heuristic priority score, not an acceptance probability. Do not fill the list with ineligible people to reach 25."},{"new":12,"old":10,"op":" ","text":""},{"new":13,"old":11,"op":" ","text":"## DM actions"},{"new":14,"old":12,"op":" ","text":""},{"new":null,"old":13,"op":"-","text":"Group the DM list by action:"},{"new":15,"old":null,"op":"+","text":"Group DM recommendations by action:"},{"new":16,"old":14,"op":" ","text":""},{"new":null,"old":15,"op":"-","text":"- Reply when the latest verified inbound LinkedIn message is later than the latest outbound message. Include the relevant message and a reminder to respond; the owner writes the reply."},{"new":null,"old":16,"op":"-","text":"- Prepare a researched first-DM draft for a verified accepted connection when complete relevant inbox evidence establishes no prior outbound DM. Automatically write a personalized opener grounded in the saved background research."},{"new":null,"old":17,"op":"-","text":"- Follow up when a verified outbound DM is at least 72 hours old and has no later reply. Show elapsed time and read status as a reminder; the owner writes the follow-up. Missing read evidence means unknown. No reply does not prove the person ignored the message."},{"new":null,"old":18,"op":"-","text":""},{"new":null,"old":19,"op":"-","text":"Only first-DM drafts are generated automatically. Replies and follow-ups remain manual, with no generated response text. The report does not send any messages."},{"new":17,"old":null,"op":"+","text":"- Reply when the latest verified inbound LinkedIn message is later than the latest outbound message. Include the relevant message and a reminder to respond. The owner writes the reply."},{"new":18,"old":null,"op":"+","text":"- Prepare a researched first-DM draft for a verified accepted connection when complete relevant inbox evidence establishes no prior outbound DM. Ground the opener in saved background research."},{"new":19,"old":null,"op":"+","text":"- Follow up when a verified outbound DM is at least 72 hours old and has no later reply. Show elapsed time and read status as a reminder. The owner writes the follow-up. Missing read evidence means unknown. No reply does not prove that the person ignored the message."},{"new":20,"old":20,"op":" ","text":""},{"new":21,"old":21,"op":" ","text":"Exclude opt-outs and terminal negative responses from automatic follow-up recommendations. Keep LinkedIn and email history separate. Invitation notes must not count as first DMs. Missing, stale, malformed, or truncated sources withhold affected actions instead of producing false empty queues."},{"new":22,"old":22,"op":" ","text":""},{"new":null,"old":23,"op":"-","text":"## Research and storage"},{"new":23,"old":null,"op":"+","text":"## Read-only report boundary"},{"new":24,"old":24,"op":" ","text":""},{"new":null,"old":25,"op":"-","text":"For newly accepted connections eligible for first DMs, automatically research the exact person through Exa, Clay, or another available research provider. Save supported professional facts, cited URLs, source dates when known, retrieval time, provider, identity binding, uncertainty, and status in Supabase before publishing a personalized first-message opener. Surface research failures and allow bounded retries. Never invent a personalization fact when research fails."},{"new":25,"old":null,"op":"+","text":"The report reads source exports and writes private JSON and Markdown report files. It does not write to Supabase, store recommendations or drafts, or send messages. LinkedIn MDP sync owns persistence of observed real invitations, sent messages, acceptances, and replies. The owner sends every invitation and DM."},{"new":26,"old":26,"op":" ","text":""},{"new":null,"old":27,"op":"-","text":"Log source observations, research attempts and results, report recommendations, drafts, actual sends, acceptances, replies, and run outcomes as distinct facts. A draft or recommendation does not establish that a message was sent. Replay must not duplicate evidence. Preserve failed research attempts separately so they cannot prevent a later successful result from being saved."},{"new":null,"old":28,"op":"-","text":""},{"new":null,"old":29,"op":"-","text":"The scheduled agent orchestrates the run. Keep ingestion, validation, queue building, persistence, and publication in repository code where practical. The agent can use connected Exa tools and pass a validated research envelope to repository code for persistence. GitHub CI cannot reuse the agent connector's authorization. Schema and scheduled infrastructure changes require separate approval."},{"new":27,"old":null,"op":"+","text":"Later reviewed slices may classify MDP inbox records into sent and received DMs, derive status from complete observations, include researched first-DM drafts, and show reply or follow-up reminders. A suggested action does not prove that the action happened. Missing or delayed MDP snapshots mean unknown, not not-sent. No reply or follow-up text is generated."},{"new":28,"old":30,"op":" ","text":""},{"new":29,"old":31,"op":" ","text":"## Current slice and remaining work"},{"new":30,"old":32,"op":" ","text":""},{"new":null,"old":33,"op":"-","text":"This PR adds only private INBOX evidence planning and optional persistence for existing prospects. It preserves exact participant identity, message content and subject, attachment evidence, provider time, and uncertainty. It does not produce the two lists yet."},{"new":31,"old":null,"op":"+","text":"PR10 builds a private invitation shortlist with all-history capacity accounting under the latest-known-present employer assumption. It retains exact person identity, current-employer citations, source evidence IDs and pointers, observed invitation date metadata, ranking facts, and explicit unknowns. It does not write report output to Supabase."},{"new":32,"old":34,"op":" ","text":""},{"new":null,"old":35,"op":"-","text":"Live inbox persistence and replay are verified. Next, classify invitation notes versus DMs, establish relevant source coverage, integrate invitation eligibility, build the queues, connect research persistence and first-message drafting, and publish the actual person-level report. Enable the scheduled path after live report verification, then observe a scheduled run before claiming completion."},{"new":33,"old":null,"op":"+","text":"The next reviewed slices cover independent MDP action ingestion and status projection, researched first-DM drafts in the private report, incoming reply and due follow-up reminders, and prospect `date_added` visibility from the existing database insertion timestamp. Do not add schema or infrastructure changes without a separately reviewed diff."}],"new_start":1,"old_start":1}],"kind":"docs","language":null,"path":"docs/action-report-contract.md","removed":16,"sensitive":null,"status":"modified","symbols":[]},{"added":84,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Invitation shortlist"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"`scripts/build_invitation_shortlist.py` reads a complete private collector export and a cited qualification envelope. It writes a private JSON report and Markdown report. It does not connect to Supabase, store recommendations, schedule work, or send invitations."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"## Input completeness"},{"new":6,"old":null,"op":"+","text":""},{"new":7,"old":null,"op":"+","text":"The provider collector must report success, `truncated: false`, and a positive `page_count` for `CONNECTIONS`, `INVITATIONS`, and `INBOX`. `page_count` counts fetched HTTP pages. `raw_elements` retains snapshot elements, so its length can differ from the page count. Its distinct raw row set must equal the collector's exported distinct `rows`; exact duplicate raw elements are allowed. Row comparison hashes canonical ASCII-escaped JSON, so JSON-permitted escaped surrogate metadata does not invalidate matching rows."},{"new":8,"old":null,"op":"+","text":""},{"new":9,"old":null,"op":"+","text":"Supabase `prospects` and `events` envelopes must report success, `truncated: false`, a positive page count, stable consistency metadata, and an exact `row_count`. Source acquisition time must be no more than 24 hours old. Provider generation time stays unknown when the snapshot does not supply it."},{"new":10,"old":null,"op":"+","text":""},{"new":11,"old":null,"op":"+","text":"## Qualification and current employers"},{"new":12,"old":null,"op":"+","text":""},{"new":13,"old":null,"op":"+","text":"Qualification facts bind to exact canonical LinkedIn profile URLs. Current name, role, US country, and PVF employer require an HTTP citation with timezone-aware `retrieved_at` no older than 90 days plus a `profile_url` attestation that normalizes to the candidate's exact profile. The caller attests that the cited fact was researched. The builder validates citation shape, retrieval freshness, and this exact-profile binding, but does not fetch webpage contents."},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"The `current_employers` object maps raw profile URL keys to a registered company ID and citations. URLs normalize with the same Unicode-preserving identity normalizer used for inbox participants. Multiple keys that normalize to one profile may repeat the same company assignment. Conflicting assignments, unregistered companies, invalid citations, or unsupported identities enter the private queue and withhold all capacity claims. The owner's explicit assumption is that each person's latest known employer is present. Citation retrieval time must be recent; source publication or indexing date does not determine historical employer eligibility."},{"new":16,"old":null,"op":"+","text":""},{"new":17,"old":null,"op":"+","text":"Each unresolved employer key retains a stable opaque evidence ID and input key index pointer. An invalid assignment for any canonical alias removes that person from resolved employer and capacity audit entries."},{"new":18,"old":null,"op":"+","text":""},{"new":19,"old":null,"op":"+","text":"A candidate's qualification company must match the current-employer mapping. A conflict withholds that candidate. The report retains the current-employer citations and labels the present-employer assumption in its audit."},{"new":20,"old":null,"op":"+","text":""},{"new":21,"old":null,"op":"+","text":"The example uses synthetic identities and URLs."},{"new":22,"old":null,"op":"+","text":""},{"new":23,"old":null,"op":"+","text":"```json"},{"new":24,"old":null,"op":"+","text":"{"},{"new":25,"old":null,"op":"+","text":"  \"schema_version\": 1,"},{"new":26,"old":null,"op":"+","text":"  \"company_registry\": ["},{"new":27,"old":null,"op":"+","text":"    {\"company_id\": \"co-1\", \"name\": \"Example PVF\", \"aliases\": [\"Example PVF\", \"Example PVF LLC\"]}"},{"new":28,"old":null,"op":"+","text":"  ],"},{"new":29,"old":null,"op":"+","text":"  \"current_employers\": {"},{"new":30,"old":null,"op":"+","text":"    \"https://www.linkedin.com/in/example-person\": {"},{"new":31,"old":null,"op":"+","text":"      \"company_id\": \"co-1\","},{"new":32,"old":null,"op":"+","text":"      \"citations\": [{\"url\": \"https://evidence.example/employer\", \"source_date\": null, \"retrieved_at\": \"2026-10-02T10:00:00Z\"}]"},{"new":33,"old":null,"op":"+","text":"    }"},{"new":34,"old":null,"op":"+","text":"  },"},{"new":35,"old":null,"op":"+","text":"  \"candidates\": ["},{"new":36,"old":null,"op":"+","text":"    {"},{"new":37,"old":null,"op":"+","text":"      \"profile_url\": \"https://www.linkedin.com/in/example-person\","},{"new":38,"old":null,"op":"+","text":"      \"identity\": {"},{"new":39,"old":null,"op":"+","text":"        \"name\": {\"value\": \"Example Person\", \"citations\": [{\"url\": \"https://evidence.example/profile\", \"profile_url\": \"https://www.linkedin.com/in/example-person\", \"source_date\": null, \"retrieved_at\": \"2026-10-02T10:00:00Z\"}]},"},{"new":40,"old":null,"op":"+","text":"        \"current_role\": {\"value\": \"Buyer\", \"citations\": [{\"url\": \"https://evidence.example/role\", \"profile_url\": \"https://www.linkedin.com/in/example-person\", \"source_date\": null, \"retrieved_at\": \"2026-10-02T10:00:00Z\"}]},"},{"new":41,"old":null,"op":"+","text":"        \"country\": {\"value\": \"US\", \"citations\": [{\"url\": \"https://evidence.example/location\", \"profile_url\": \"https://www.linkedin.com/in/example-person\", \"source_date\": null, \"retrieved_at\": \"2026-10-02T10:00:00Z\"}]},"},{"new":42,"old":null,"op":"+","text":"        \"pvf_employer\": {\"value\": true, \"company_id\": \"co-1\", \"company_name\": \"Example PVF LLC\", \"citations\": [{\"url\": \"https://evidence.example/employer\", \"profile_url\": \"https://www.linkedin.com/in/example-person\", \"source_date\": null, \"retrieved_at\": \"2026-10-02T10:00:00Z\"}]}"},{"new":43,"old":null,"op":"+","text":"      },"},{"new":44,"old":null,"op":"+","text":"      \"rank_factors\": {}"},{"new":45,"old":null,"op":"+","text":"    }"},{"new":46,"old":null,"op":"+","text":"  ]"},{"new":47,"old":null,"op":"+","text":"}"},{"new":48,"old":null,"op":"+","text":"```"},{"new":49,"old":null,"op":"+","text":""},{"new":50,"old":null,"op":"+","text":"## All-history capacity"},{"new":51,"old":null,"op":"+","text":""},{"new":52,"old":null,"op":"+","text":"The CLI and pure function require `--cap-scope all_history`. Every outgoing invitation source is grouped by normalized exact profile identity. The report counts each person once against their mapped latest-known employer across provider invitations, explicit CRM sent facts, and actual Supabase invitation events. Historical invitation dates and previous employer claims remain audit data. They do not gate capacity or change the mapped employer."},{"new":53,"old":null,"op":"+","text":""},{"new":54,"old":null,"op":"+","text":"The JSON audit retains each source evidence ID, source row pointer, observed event date when available, profile URL, and the current-employer citations. Unknown or unsupported invitation identities and profiles without a valid current-employer mapping enter `research_queue`. Any unresolved queue row withholds the entire shortlist and all remaining-slot claims. The `Company` field in CRM is never employer proof. Accepted dates and connections do not consume invitation slots. They still exclude people from recommendations under the existing eligibility rules."},{"new":55,"old":null,"op":"+","text":""},{"new":56,"old":null,"op":"+","text":"Provider `Sent At` values preserve the retained `M/D/YY, h:mm AM/PM` text and provider-local calendar date when parseable. The timezone remains unknown. Supabase event dates remain source audit metadata; observation or import time is never substituted for the provider date."},{"new":57,"old":null,"op":"+","text":""},{"new":58,"old":null,"op":"+","text":"## Legacy baseline reconciliation"},{"new":59,"old":null,"op":"+","text":""},{"new":60,"old":null,"op":"+","text":"Unsupported CRM invitation history can bind to a canonical provider profile only when its prospect has exactly one `GOOGLE_SHEETS_CRM_BASELINE` / `LINKEDIN_INVITE_SENT` event. The CRM `Person` name (or `Name` when absent) uses Unicode NFKC, whitespace collapse, and casefold. Punctuation remains significant. That name must match exactly one outgoing invitation row across the complete history, counting rows with invalid URLs or dates as collisions. Incoming invitations do not participate."},{"new":61,"old":null,"op":"+","text":""},{"new":62,"old":null,"op":"+","text":"The matching row must have a valid canonical LinkedIn profile URL and a provider calendar date equal to the agreeing CRM/event baseline date or exactly one day earlier. Missing, invalid, conflicting, or disagreeing baseline dates leave the history unresolved. Target legacy prospects must have distinct normalized names and distinct matched canonical profiles; collisions remain unresolved even when another target fails a date check."},{"new":63,"old":null,"op":"+","text":""},{"new":64,"old":null,"op":"+","text":"The overlay changes only `profile_url` on the selected baseline event evidence and corresponding unsupported CRM send evidence after ordinary history extraction. It preserves evidence IDs, row pointers, source timestamps, dates, precision, and timezone metadata. The general prospect identity index and other events retain their existing exact identity rules. Provider, CRM, and baseline evidence then count once per canonical person. A resolved legacy identity still needs valid current-employer evidence; otherwise capacity and recommendations remain withheld."},{"new":65,"old":null,"op":"+","text":""},{"new":66,"old":null,"op":"+","text":"## Ranking and output"},{"new":67,"old":null,"op":"+","text":""},{"new":68,"old":null,"op":"+","text":"The priority heuristic is versioned as `invitation-priority-v1`. It awards up to 4 points for observed exact-person activity, 3 for mutual connections, 2 for connection count, and 1 for a profile photo. Activity must be at most 30 days old. Other ranking signals must be at most 90 days old. Numeric inputs are capped at 20 mutual connections and 500 total connections for scoring. Missing or stale signals stay unknown and do not produce an all-unknown zero score. The score is a sorting aid, not an acceptance probability. Stable ties use the canonical profile URL. Eligibility and remaining lifetime company slots apply before the report selects at most 25 rows."},{"new":69,"old":null,"op":"+","text":""},{"new":70,"old":null,"op":"+","text":"The report preserves existing exact identity checks, suppression handling, connected and previously invited exclusions, candidate qualification checks, ranking behavior, and transport freshness rules. The report includes no event plan, persistence key, draft, or hypothetical Supabase event."},{"new":71,"old":null,"op":"+","text":""},{"new":72,"old":null,"op":"+","text":"Run with private files and a new output directory:"},{"new":73,"old":null,"op":"+","text":""},{"new":74,"old":null,"op":"+","text":"```sh"},{"new":75,"old":null,"op":"+","text":"python scripts/build_invitation_shortlist.py \\"},{"new":76,"old":null,"op":"+","text":"  --source /private/path/source.json \\"},{"new":77,"old":null,"op":"+","text":"  --qualification /private/path/qualification.json \\"},{"new":78,"old":null,"op":"+","text":"  --output-dir /private/path/shortlist-2026-10-02 \\"},{"new":79,"old":null,"op":"+","text":"  --cap-scope all_history"},{"new":80,"old":null,"op":"+","text":"```"},{"new":81,"old":null,"op":"+","text":""},{"new":82,"old":null,"op":"+","text":"Input files must be regular files with no group or world permissions. The CLI creates the new output directory with mode `0700` and both reports with mode `0600`. It refuses existing output directories. Standard output contains only a fixed completion status. Validation errors never include row content, names, URLs, or message text. `tests/e2e_invitation_shortlist.py` covers synthetic source boundaries. `tests/test_invitation_shortlist_e2e.py` runs the matrix and writes a sanitized artifact with fixed verdicts and a digest."},{"new":83,"old":null,"op":"+","text":""},{"new":84,"old":null,"op":"+","text":"A successfully fetched empty provider page may have zero snapshot elements when its status and exported rows prove completeness. CRM opt-out fields treat explicit negative values (`false`, `no`, `0`, empty, or absent) as negative. Affirmative or uninterpretable nonempty values suppress a prospect."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"docs/invitation-shortlist.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":3,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"Technical system infographic for the current invitation-planner PR. Teach how all-history capacity, exact identities and latest-known employer assumption produce private suggestions. Structural-breakdown, technical-schematic, landscape16:9, English, native imagegen, resolved by technical/system default profile. No personal data or claims of deployed sync. Saved preferences use backendauto with unspecified layout/style/language."},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"Native raster generated from saved prompt and visually inspected. Labels are readable, opaque neutral canvas has a visible boundary, content matches revised planner policy. No personal data. No vector/code rendering or text overlay. Intended publication as replacement current-feature infographic after owner checkout handoff."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/invitation-shortlist/analysis.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":0,"hunks":[],"kind":"opaque","language":null,"path":"infographic/invitation-shortlist/infographic.png","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":10,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"Use case: infographic-diagram. Create a small professional technical system infographic for a GitHub PR explaining an invitation shortlist. Landscape16:9. Structural-breakdown layout with technical-schematic style, clean blue and teal geometric layers, restrained amber guards, light gray opaque neutral canvas with visible dark outer border. English large high-contrast sans-serif text. No real names, profile data, secrets or screenshots. Show a layered planner object with concise callout cards, not a flowchart or DAG. Use only these exact labels, grouped with generous space:"},{"new":2,"old":null,"op":"+","text":"Title \"Invitation shortlist\""},{"new":3,"old":null,"op":"+","text":"Input layer \"All outgoing history\" \"Exact people\" \"Latest known employer\""},{"new":4,"old":null,"op":"+","text":"Policy layer \"Assumed present\" \"Count each person once\" \"Three per company\""},{"new":5,"old":null,"op":"+","text":"Guard callout \"Unknown identity or employer: withhold\""},{"new":6,"old":null,"op":"+","text":"Exclusions \"Already invited\" \"Connected\" \"Opted out\""},{"new":7,"old":null,"op":"+","text":"Priority callout \"Activity · Mutuals · Connections · Photo\""},{"new":8,"old":null,"op":"+","text":"Output layer \"Up to 25 invitations\" \"Private report only\""},{"new":9,"old":null,"op":"+","text":"Bottom boundary \"No Supabase writes\" \"Owner sends manually\""},{"new":10,"old":null,"op":"+","text":"All text must fit within canvas and be readable at preview size. Do not add database events, historical-date proof gates, calibrated probabilities, or deployed cron claims. Render as a polished raster infographic, not code or a screenshot."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/invitation-shortlist/prompts/01-infographic-invitation-shortlist.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":8,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Invitation shortlist, revised owner contract"},{"new":2,"old":null,"op":"+","text":"All outgoing invitation history counts, including recipients outside the CRM."},{"new":3,"old":null,"op":"+","text":"Each exact person counts once against their latest known employer, assumed present by the owner."},{"new":4,"old":null,"op":"+","text":"Unknown identity or employer withholds recommendations."},{"new":5,"old":null,"op":"+","text":"Up to 25 qualified invitations, at most three per company including history and the new shortlist."},{"new":6,"old":null,"op":"+","text":"Prior invitations, current connections and opt-outs are excluded."},{"new":7,"old":null,"op":"+","text":"Activity, mutual connections, connection count and profile photo provide heuristic priority signals."},{"new":8,"old":null,"op":"+","text":"Private report only. No recommendation events or Supabase writes. Owner sends outreach manually."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/invitation-shortlist/source.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":8,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Invitation shortlist"},{"new":2,"old":null,"op":"+","text":"Learning objective: distinguish observed invitation history from read-only suggestions."},{"new":3,"old":null,"op":"+","text":"Input layers: All outgoing history. Exact people. Latest known employer."},{"new":4,"old":null,"op":"+","text":"Policy layer: Assumed present. Count each person once. Three per company."},{"new":5,"old":null,"op":"+","text":"Guard: Unknown identity or employer withholds recommendations."},{"new":6,"old":null,"op":"+","text":"Exclusions: Already invited. Connected. Opted out."},{"new":7,"old":null,"op":"+","text":"Priority: Activity. Mutuals. Connections. Profile photo."},{"new":8,"old":null,"op":"+","text":"Output: Up to25 invitations. Private report only. No Supabase writes. Owner sends manually."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/invitation-shortlist/structured-content.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":89,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"#!/usr/bin/env python3"},{"new":2,"old":null,"op":"+","text":"\"\"\"Build a private, read-only invitation shortlist report.\"\"\""},{"new":3,"old":null,"op":"+","text":""},{"new":4,"old":null,"op":"+","text":"from __future__ import annotations"},{"new":5,"old":null,"op":"+","text":""},{"new":6,"old":null,"op":"+","text":"import argparse"},{"new":7,"old":null,"op":"+","text":"import json"},{"new":8,"old":null,"op":"+","text":"import os"},{"new":9,"old":null,"op":"+","text":"import stat"},{"new":10,"old":null,"op":"+","text":"from datetime import datetime"},{"new":11,"old":null,"op":"+","text":"from pathlib import Path"},{"new":12,"old":null,"op":"+","text":"from typing import Any, NoReturn"},{"new":13,"old":null,"op":"+","text":""},{"new":14,"old":null,"op":"+","text":"from linkedin_mdp_mcp.invitation_shortlist import ("},{"new":15,"old":null,"op":"+","text":"    ShortlistInputError,"},{"new":16,"old":null,"op":"+","text":"    _make_markdown,"},{"new":17,"old":null,"op":"+","text":"    build_invitation_shortlist,"},{"new":18,"old":null,"op":"+","text":")"},{"new":19,"old":null,"op":"+","text":""},{"new":20,"old":null,"op":"+","text":""},{"new":21,"old":null,"op":"+","text":"class _Parser(argparse.ArgumentParser):"},{"new":22,"old":null,"op":"+","text":"    \"\"\"Keep malformed command invocations on the fixed-output diagnostic path.\"\"\""},{"new":23,"old":null,"op":"+","text":""},{"new":24,"old":null,"op":"+","text":"    def error(self, message: str) -\u003e NoReturn:"},{"new":25,"old":null,"op":"+","text":"        \"\"\"Raise a fixed safe error instead of printing arguments or environment details.\"\"\""},{"new":26,"old":null,"op":"+","text":"        raise ShortlistInputError(\"arguments_invalid\")"},{"new":27,"old":null,"op":"+","text":""},{"new":28,"old":null,"op":"+","text":""},{"new":29,"old":null,"op":"+","text":"def _private_json(path: Path) -\u003e Any:"},{"new":30,"old":null,"op":"+","text":"    \"\"\"Read one regular private JSON file without printing its path or contents.\"\"\""},{"new":31,"old":null,"op":"+","text":"    metadata = path.lstat()"},{"new":32,"old":null,"op":"+","text":"    if not stat.S_ISREG(metadata.st_mode) or stat.S_IMODE(metadata.st_mode) \u0026 0o077:"},{"new":33,"old":null,"op":"+","text":"        raise ShortlistInputError(\"input_file_permissions_invalid\")"},{"new":34,"old":null,"op":"+","text":"    try:"},{"new":35,"old":null,"op":"+","text":"        return json.loads(path.read_text(encoding=\"utf-8\"))"},{"new":36,"old":null,"op":"+","text":"    except (OSError, UnicodeError, json.JSONDecodeError) as exc:"},{"new":37,"old":null,"op":"+","text":"        raise ShortlistInputError(\"input_json_invalid\") from exc"},{"new":38,"old":null,"op":"+","text":""},{"new":39,"old":null,"op":"+","text":""},{"new":40,"old":null,"op":"+","text":"def _write_new_private(path: Path, content: str) -\u003e None:"},{"new":41,"old":null,"op":"+","text":"    \"\"\"Create one new mode-0600 artifact without replacing an existing file.\"\"\""},{"new":42,"old":null,"op":"+","text":"    descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)"},{"new":43,"old":null,"op":"+","text":"    try:"},{"new":44,"old":null,"op":"+","text":"        with os.fdopen(descriptor, \"w\", encoding=\"utf-8\", closefd=False) as output:"},{"new":45,"old":null,"op":"+","text":"            output.write(content)"},{"new":46,"old":null,"op":"+","text":"    finally:"},{"new":47,"old":null,"op":"+","text":"        os.close(descriptor)"},{"new":48,"old":null,"op":"+","text":""},{"new":49,"old":null,"op":"+","text":""},{"new":50,"old":null,"op":"+","text":"def _arguments(argv: list[str] | None) -\u003e argparse.Namespace:"},{"new":51,"old":null,"op":"+","text":"    \"\"\"Parse explicit private input, output, and lifetime-cap policy paths.\"\"\""},{"new":52,"old":null,"op":"+","text":"    parser = _Parser(description=\"Build a private LinkedIn invitation shortlist.\")"},{"new":53,"old":null,"op":"+","text":"    parser.add_argument(\"--source\", required=True, type=Path)"},{"new":54,"old":null,"op":"+","text":"    parser.add_argument(\"--qualification\", required=True, type=Path)"},{"new":55,"old":null,"op":"+","text":"    parser.add_argument(\"--output-dir\", required=True, type=Path)"},{"new":56,"old":null,"op":"+","text":"    parser.add_argument(\"--cap-scope\", required=True, choices=(\"all_history
