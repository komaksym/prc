}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --dot: rgba(15, 23, 42, 0.09);
    --panel: rgba(255, 255, 255, 0.9);
    --panel-solid: #ffffff;
    --raise: #ffffff;
    --card: #ffffff;
    --card-ctx: #f9fafb;
    --border: #e1e4ea;
    --border-strong: #cfd4dc;
    --band: rgba(15, 23, 42, 0.022);
    --text: #0f1420;
    --muted: #5b6372;
    --faint: #8b93a1;
    --green: #129b5a;
    --amber: #c27c0e;
    --red: #d6363f;
    --grey: #9aa1ad;
    --accent: #4f5bd5;
    --edge: #a3a9b5;
    --add-bg: rgba(18, 155, 90, 0.1);
    --del-bg: rgba(214, 54, 63, 0.09);
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 6px 20px rgba(15, 23, 42, 0.07);
    --shadow-lg: 0 24px 64px rgba(15, 23, 42, 0.18);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
}

.st-added { --st: var(--green); }
.st-modified { --st: var(--amber); }
.st-deleted { --st: var(--red); }
.st-context { --st: var(--grey); }

/* Header */

.top {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-solid);
  position: relative;
  z-index: 5;
}

.headline { min-width: 0; flex: 1 1 0; }

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}

.logo {
  display: inline-grid;
  grid-template-columns: repeat(3, 4px);
  gap: 2px;
  align-items: center;
}

.logo i {
  display: block;
  width: 4px;
  height: 12px;
  border-radius: 2px;
  background: var(--green);
}

.logo i:nth-child(2) { height: 8px; background: var(--amber); }
.logo i:nth-child(3) { height: 5px; background: var(--red); }

.brand-name {
  color: var(--text);
  font-weight: 600;
  letter-spacing: 0.01em;
}

.meta { overflow: hidden; text-overflow: ellipsis; }
.meta .sep { color: var(--faint); margin: 0 6px; }
.meta .mono { font-family: var(--mono); font-size: 11.5px; }

.meta a {
  color: var(--accent);
  text-decoration: none;
}

.meta a:hover { text-decoration: underline; }

h1 {
  margin: 4px 0 0;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.012em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stats {
  display: flex;
  gap: 8px;
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
}

.stat {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 72px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--raise);
  white-space: nowrap;
}

.stat-value {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 17px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
}

.stat.good .stat-value { color: var(--green); }
.stat.bad .stat-value { color: var(--red); }
.stat.warn .stat-value { color: var(--amber); }
.stat.none .stat-value { color: var(--muted); }

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
}

.play {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 16px 0 14px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--text);
  color: var(--bg);
  font-weight: 600;
  white-space: nowrap;
  box-shadow: var(--shadow);
}

.play:hover { opacity: 0.9; }

.play-icon {
  width: 0;
  height: 0;
  border-left: 9px solid currentColor;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.playing .play-icon {
  width: 10px;
  height: 12px;
  border: 0;
  border-left: 3px solid currentColor;
  border-right: 3px solid currentColor;
}

/* Canvas */

.viewport {
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.2px);
  background-size: 24px 24px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.viewport.dragging { cursor: grabbing; }

.world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
}

.band {
  position: absolute;
  border: 1px dashed var(--border);
  border-radius: 16px;
  background: var(--band);
}

.band-label {
  position: absolute;
  left: 16px;
  top: 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  white-space: nowrap;
}

.edges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.e {
  fill: none;
  stroke: var(--edge);
  stroke-width: 1.5;
  transition: opacity 160ms ease;
}

.e-added {
  stroke: var(--green);
  stroke-width: 2;
  stroke-dasharray: 8 6;
  animation: flow 1s linear infinite;
}

.e-removed {
  stroke: var(--red);
  stroke-width: 1.75;
  stroke-dasharray: 5 5;
  opacity: 0.85;
}

.e-name {
  stroke-dasharray: 1 6;
  stroke-linecap: round;
  stroke-width: 2.25;
}

.e-added.e-name { stroke-width: 2.5; }

.arrow-added { fill: var(--green); }
.arrow-removed { fill: var(--red); }
.arrow-kept { fill: var(--edge); }

@keyframes flow {
  to { stroke-dashoffset: -28; }
}

/* Nodes */

.node {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 8px 12px 8px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
  transition: opacity 160ms ease, border-color 120ms ease, box-shadow 160ms ease;
}

.node:hover { border-color: var(--border-strong); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.node .bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--st);
}

.node.st-context {
  background: var(--card-ctx);
  border-style: dashed;
  box-shadow: none;
}

.node.st-context .bar { opacity: 0.6; }

.n-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.glyph {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1px solid var(--border-strong);
  color: var(--muted);
  font: 600 10.5px/1 var(--mono);
}

.name {
  min-width: 0;
  flex: 1 1 auto;
  font: 600 13px/1.3 var(--mono);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.st-context .name { color: var(--muted); font-weight: 500; }

.st-deleted .name {
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 1.5px;
  color: var(--muted);
}

.pill {
  flex: none;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--st);
  background: color-mix(in srgb, var(--st) 14%, transparent);
}

.path {
  font: 11px/1.35 var(--mono);
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}

.path > span { direction: ltr; unicode-bidi: isolate; }

.n-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
}

.n-row > .path { flex: 1 1 auto; min-width: 0; }

.n-row > .sites {
  flex: none;
  font-size: 11px;
  color: var(--faint);
}

.delta { font: 600 11.5px/1 var(--mono); }
.plus { color: var(--green); }
.minus { color: var(--red); }

.badge {
  margin-left: auto;
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
  background: color-mix(in srgb, var(--amber) 10%, transparent);
}

.chip {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 12px 0 16px;
  border-radius: 999px;
}

.chip .bar { width: 3px; }

.chip .name { flex: 0 1 auto; font-weight: 500; font-size: 12.5px; }
.chip.st-deleted .name { color: var(--muted); }

/* Grouped overview */

.fedges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.ge {
  fill: none;
  stroke: var(--edge);
  stroke-width: 2;
}

.ge-added { stroke: var(--green); }
.ge-removed { stroke: var(--red); }

.fcard {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 10px 14px 10px 16px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  overflow: hidden;
}

.fcard:hover { border-color: var(--border-strong); }
.fcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.f-name {
  font: 600 13px/1.3 var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.f-counts {
  font: 11px/1.4 var(--mono);
  color: var(--muted);
}

.flist {
  display: none;
  margin-top: 6px;
  border-top: 1px solid var(--border);
  padding-top: 6px;
  gap: 2px;
  overflow: auto;
}

.fcard.open {
  justify-content: flex-start;
  height: auto !important;
  max-height: 360px;
  z-index: 5;
}

.fcard.open .flist { display: grid; }

.fmem {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 4px 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  text-align: left;
}

.fmem:hover { background: var(--band); }

.fmem-name {
  flex: 1 1 auto;
  min-width: 0;
  font: 12px/1.35 var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fmem-tag {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.world.grouped .node.concealed { opacity: 0; }

.dense .sym {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 8px 0 12px;
  border-radius: 8px;
  box-shadow: none;
}

.dense .sym .bar { width: 3px; }
.dense .sym .name { font-size: 12px; }
.dense .sym .glyph { width: 16px; height: 16px; font-size: 9.5px; }
.dense .sym .pill { padding: 0 5px; font-size: 9px; }

.flag {
  flex: none;
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  font: 700 10px/1 var(--sans);
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
}

.group {
  position: absolute;
  padding: 6px 4px 0;
  font: 11px/1.3 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
  pointer-events: none;
}

.group > span { direction: ltr; unicode-bidi: isolate; }

body:not(.touring) .dense .e:not(.lit) { opacity: 0; }

.empty {
  position: absolute;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%);
  padding: 12px 20px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
  pointer-events: none;
}

.risk {
  flex: none;
  margin-left: auto;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--red);
  background: color-mix(in srgb, var(--red) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
  white-space: nowrap;
}

.world.far .path,
.world.far .sites { display: none; }
.world.far .name { font-size: 16px; }
.world.far .pill { font-size: 12px; }

.hovering .node:not(.lit),
.hovering .e:not(.lit) { opacity: 0.14; }

.hovering .e.lit { stroke-width: 2.5; }

.node.lit { border-color: var(--border-strong); }

.node.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent), var(--shadow);
}

.node.focus {
  border-color: var(--st);
  box-shadow: 0 0 0 1px var(--st), 0 0 40px color-mix(in srgb, var(--st) 40%, transparent), var(--shadow);
}

/* Tour */

.touring .node,
.touring .e { transition: none; }

.touring .e-added { animation: none; }

.spot {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 35%, color-mix(in srgb, var(--bg) 82%, transparent) 100%);
}

.touring .spot { opacity: 1; }

.progress {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 2px;
  display: none;
}

.touring .progress { display: block; }

#progress-bar {
  height: 100%;
  width: 0;
  background: var(--accent);
}

.caption {
  position: absolute;
  left: 50%;
  bottom: 40px;
  width: min(760px, calc(100% - 48px));
  transform: translateX(-50%);
  padding: 16px 24px 18px;
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .caption { display: block; }

.cap-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.cap-count { color: var(--faint); font-variant-numeric: tabular-nums; }

.cap-main {
  margin-top: 6px;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.015em;
}

.cap-main .code { font-family: var(--mono); font-size: 20px; }

.cap-sub {
  margin-top: 6px;
  font: 12.5px/1.4 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.summary {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(720px, calc(100% - 48px));
  transform: translate(-50%, -50%);
  padding: 32px 40px;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  background: var(--panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .summary { display: block; }

.sum-kicker {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.sum-title {
  margin-top: 8px;
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -0.015em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sum-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 24px;
}

.sum-cell {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--raise);
}

.sum-num {
  font-size: 40px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.sum-label { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.sum-cell.good .sum-num { color: var(--green); }
.sum-cell.bad .sum-num { color: var(--red); }
.sum-cell.warn .sum-num { color: var(--amber); }

.sum-note {
  margin-top: 16px;
  color: var(--muted);
  font-size: 14px;
}

.sum-brand {
  margin-top: 24px;
  font-size: 12px;
  color: var(--faint);
}

/* Floating controls */

.legend {
  position: absolute;
  left: 16px;
  bottom: 16px;
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 11.5px;
  color: var(--muted);
  box-shadow: var(--shadow);
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.sw {
  width: 10px;
  height: 10px;
  margin-left: 6px;
  border-radius: 3px;
  background: var(--st);
}

.sw:first-child, .ls:first-child { margin-left: 0; }
.ls { width: 32px; height: 8px; margin-left: 8px; overflow: visible; }

.zoom {
  position: absolute;
  right: 16px;
  bottom: 16px;
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.zoom button {
  min-width: 36px;
  height: 32px;
  padding: 0 10px;
  border: 0;
  border-right: 1px solid var(--border);
  background: transparent;
  font-size: 13px;
  color: var(--muted);
}

.zoom button:last-child { border-right: 0; }
.zoom button:hover { color: var(--text); background: var(--band); }

.touring .legend,
.touring .zoom { opacity: 0; pointer-events: none; }

/* Drawer */

.drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 92vw);
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--panel-solid);
  box-shadow: var(--shadow-lg);
  transform: translateX(104%);

  cursor: auto;
  user-select: text;
}

.drawer[aria-hidden="false"] { transform: none; }

.d-head {
  position: relative;
  padding: 20px 56px 16px 24px;
  border-bottom: 1px solid var(--border);
}

.d-head .bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--st);
}

.d-tags { display: flex; align-items: center; gap: 8px; }

.d-kind {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.d-name {
  margin: 8px 0 4px;
  font: 650 18px/1.3 var(--mono);
  letter-spacing: -0.01em;
  word-break: break-all;
}

.st-deleted .d-name { text-decoration: line-through; text-decoration-color: var(--red); }

.d-path { font: 12px/1.4 var(--mono); color: var(--muted); word-break: break-all; }

.d-close {
  position: absolute;
  right: 16px;
  top: 16px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}

.d-close:hover { color: var(--text); border-color: var(--border-strong); }

.d-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
}

.fact {
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  white-space: nowrap;
}

.fact.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.fact.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

.d-body {
  flex: 1 1 auto;
  overflow: auto;
  padding: 8px 0 24px;
}

.d-section { padding: 16px 24px 0; }

.d-title {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}

.d-empty { font-size: 12.5px; color: var(--faint); }

.diff {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: auto;
  background: var(--bg);
  font: 12px/20px var(--mono);
}

.diff-rows { width: max-content; min-width: 100%; }

.hunk-head {
  padding: 2px 12px;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-top: 1px solid var(--border);
}

.diff-rows .hunk-head:first-child { border-top: 0; }

.dl {
  display: grid;
  grid-template-columns: 40px 40px 20px auto;
  white-space: pre;
}

.dl .ln {
  padding-right: 8px;
  text-align: right;
  color: var(--faint);
  user-select: none;
}

.dl .sg { text-align: center; user-select: none; }
.dl .code { padding-right: 16px; }
.dl.add { background: var(--add-bg); }
.dl.add .sg { color: var(--green); }
.dl.del { background: var(--del-bg); }
.dl.del .sg { color: var(--red); }

.links { display: grid; gap: 4px; }

.link {
  display: grid;
  grid-template-columns: 4px 1fr auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px 8px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--raise);
  text-align: left;
  overflow: hidden;
}

.link:hover { border-color: var(--border-strong); }
.link .bar { height: 100%; min-height: 32px; background: var(--st); border-radius: 0 2px 2px 0; }
.link-text { min-width: 0; }
.link-name { display: block; font: 600 12.5px/1.35 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link-path { display: block; font: 11px/1.35 var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.etag {

  border: 1px solid var(--border);

.etag.removed { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

 message observations for existing prospects without treating unknown invitation notes as confirmed DMs. The complete desired report contract is in `docs/action-report-contract.md`."},{"new":6,"old":null,"op":"+","text":""},{"new":7,"old":null,"op":"+","text":"Owner clarification: automatically generate only researched first-DM drafts, with a personalized opener grounded in persisted Clay, Exa, or other provider evidence. Reply and follow-up rows show conversation evidence and action reminders; the owner writes those messages. Sending remains manual. Preserve the invitation ranking and Supabase audit requirements."},{"new":8,"old":null,"op":"+","text":""},{"new":9,"old":null,"op":"+","text":"UTC correction checkpoint (`5cc2381`): 39 synthetic HTTP-boundary inbox scenarios, all 32 existing report E2E scenarios, and 20 pytest checks passed at that revision. Scoped Ruff passed while excluding the unchanged existing quoted-annotation rule. Full-source mypy plus the CLI and live verifier passed across 10 files. The package built successfully. Independent review accepted the whole-thread taint, subject-identity, and explicit UTC-format corrections. The observed provider string fields are covered by fixtures. The implementation has no schema, workflow, schedule, or outreach-send change; the separately approved one-time workflow verified actual inbox persistence. The later review-repair checkpoint below records the expanded suites."},{"new":10,"old":null,"op":"+","text":""},{"new":11,"old":null,"op":"+","text":"The live verification utility compares complete stored payloads and all event timestamps, preserving earlier observation times on idempotent replay. Its missing-credentials path emits only a fixed failure message. The approved live run https://github.com/komaksym/linkedin-mdp/actions/runs/36985062303 verified persistence, full private readback, and duplicate-free frozen-snapshot replay at revision `5cc23814450c14b4a8d3312c682b5f65fa87e22c`. Updated PR CI run 36985032311 passed. Actual DM queue readiness remains pending reliable message classification and coverage checks. A pytest entry point repeats the existing E2E runner in PR CI without changing workflow infrastructure."},{"new":12,"old":null,"op":"+","text":""},{"new":13,"old":null,"op":"+","text":"Applied principles: Model the Domain keeps event bodies in `InboxSyncPlan` and sanitized counts in `InboxSyncSummary`. Sequence Work into Verifiable Units makes inbox evidence the first slice before ranking, research, and action publication."},{"new":14,"old":2,"op":" ","text":""},{"new":15,"old":3,"op":" ","text":"## Google Docs morning report"},{"new":16,"old":4,"op":" ","text":""}],"new_start":1,"old_start":1},{"lines":[{"new":105,"old":93,"op":" ","text":"Throughput checkpoint: implementation and independent review run in parallel; live credentials remain in GitHub, and the test runner keeps report contents out of public logs."},{"new":106,"old":94,"op":" ","text":""},{"new":107,"old":95,"op":" ","text":"Validation before commit: the regression against the original client failed with expected exit 0 versus actual exit 1 and `morning report: blocked`. The patched client passes all 32 HTTP-boundary E2E scenarios and 19 existing tests. Scoped Ruff, mypy and package build pass. The `processedAt` comprehension received a type-only narrowing correction so the touched client passes mypy. Independent review found no actionable issues. The exact committed SHA will be used for the live report check; its private readback evidence and infographic will be recorded in the PR conversation."},{"new":108,"old":null,"op":"+","text":""},{"new":109,"old":null,"op":"+","text":"## Inbox evidence sync"},{"new":110,"old":null,"op":"+","text":""},{"new":111,"old":null,"op":"+","text":"### PR 8 review repair"},{"new":112,"old":null,"op":"+","text":""},{"new":113,"old":null,"op":"+","text":"Summary: repair the four reported review findings on the verified owning branch, then babysit the latest GitHub verdict. Preserve the complete report as the next authorized work after this prerequisite."},{"new":114,"old":null,"op":"+","text":""},{"new":115,"old":null,"op":"+","text":"- [x] Reproduced endpoint/domain pagination escape before the client correction; reject changed scope before any database access, retain valid partial pagination links within the original request scope."},{"new":116,"old":null,"op":"+","text":"- [x] Reproduced missing-content attachment loss and valid empty-plan verifier failure; keep null/nonstring content invalid and distinguish empty verification from persisted-event proof. The new review runner also fails against original revision `0893b72` and passes against the repair."},{"new":117,"old":null,"op":"+","text":"- [x] Aligned live-validation documentation with recorded evidence and remaining report work. The report contract already reflected successful live verification."},{"new":118,"old":null,"op":"+","text":"- [x] First repair checkpoint (`af41b35`): 41 inbox scenarios, 8 review scenarios, 32 report scenarios, 21 pytest checks, lint, types, and build passed. Independent review was clean; all four threads were answered. CI run 36989915353 and live persistence/readback/replay run 36990096445 passed against this revision."},{"new":119,"old":null,"op":"+","text":"- [x] CodeRabbit follow-up (`c29b06f`): replaced optimization-removable assertions with unconditional checks. The corrupt-readback E2E subprocess under `python -O` failed before the correction and now passes, alongside normal nonempty readback and valid empty verification. This checkpoint had 11 review scenarios; CI run 36991010814 and live readback/replay run 36991082417 passed."},{"new":120,"old":null,"op":"+","text":"- [x] Inviter identity review correction: the real verifier boundary rejected equivalent apex/www/regional profile URLs before the fix. It now canonicalizes every outgoing inviter with the existing strict profile normalizer before cardinality checks, while invalid and distinct identities remain rejected before writes. The expanded 15-scenario review E2E, 21 pytest checks, scoped Ruff, full-source mypy (10 files), and package build pass. No schema, workflow, or schedule changes."},{"new":121,"old":null,"op":"+","text":"- [ ] Follow fresh Greptile/CodeRabbit review and CI to merge-ready. Continue one report feature at a time with concrete live artifacts."},{"new":122,"old":null,"op":"+","text":""},{"new":123,"old":null,"op":"+","text":"- [x] Unicode identity correction: the approved private source export exposed valid non-ASCII profile slugs rejected by the strict normalizer. Three real HTTP-boundary identity/replay cases failed before the correction. Independent review then reproduced silent literal-control removal by URL parsing; four more cases failed before adding the pre-parse guard. The complete inbox suite now has 54 scenarios. Preserve exact code points and equivalent UTF-8 encoding without transliteration. Issue #9 tracks this source-identity gap. Revalidate this revision and follow fresh review before claiming ready."},{"new":124,"old":null,"op":"+","text":""},{"new":125,"old":null,"op":"+","text":"Throughput checkpoint: root owns client pagination and existing E2E; one repair worker owns inbox content, live verifier and separate E2E files. A read-only worker inventories the next report slice. No shared-file edits or parallel pushes."},{"new":126,"old":null,"op":"+","text":""},{"new":127,"old":null,"op":"+","text":"### Live timestamp correction"},{"new":128,"old":null,"op":"+","text":""},{"new":129,"old":null,"op":"+","text":"The approved credentialed validation reproduced zero planned events. Read-only diagnostics confirmed supported prospect identities and mapped rows whose dates use `YYYY-MM-DD HH:MM:SS UTC`. The ISO-only parser rejected that format. Two new HTTP-boundary persistence/replay assertions failed before changing parsing; the correction accepts only the exact explicit UTC format. Unknown abbreviations, conflicting offsets, invalid calendar dates, and naive timestamp semantics remain covered. At this historical UTC checkpoint the inbox suite had 39 scenarios; later review repairs expand it as recorded above. Lint, types, tests, build, and actual persistence/readback/replay passed for that checkpoint."},{"new":130,"old":null,"op":"+","text":""},{"new":131,"old":null,"op":"+","text":"### Contract"},{"new":132,"old":null,"op":"+","text":""},{"new":133,"old":null,"op":"+","text":"- Read complete MDP INBOX snapshots through strict element and paging validation before any store write. Preserve no-read-receipt semantics as unknown."},{"new":134,"old":null,"op":"+","text":"- Plan typed, duplicate-safe `LINKEDIN_MESSAGE_OBSERVED` events only when direction and the exact known prospect peer are established from canonical LinkedIn `/in/` URLs."},{"new":135,"old":null,"op":"+","text":"- Withhold every message in any conversation whose participant union exceeds two. Never infer direction from names or row order."},{"new":136,"old":null,"op":"+","text":"- Preserve provider message content and timestamp semantics. Aware timestamps use provider time; naive provider timestamps use the aware observation time and say that local timezone is unspecified."},{"new":137,"old":null,"op":"+","text":"- Default the CLI to dry-run. Require `--apply` for writes and emit only fixed status output."},{"new":138,"old":null,"op":"+","text":"- Keep this slice limited to inbox sync code, its CLI, docs, and synthetic HTTP-boundary E2E evidence."},{"new":139,"old":null,"op":"+","text":""},{"new":140,"old":null,"op":"+","text":"### Milestones"},{"new":141,"old":null,"op":"+","text":""},{"new":142,"old":null,"op":"+","text":"1. Record failure scenarios and run them red against the current code before production edits."},{"new":143,"old":null,"op":"+","text":"2. Implement the typed event planner, fail-closed snapshot reader, opt-in CLI, and setup/semantics documentation."},{"new":144,"old":null,"op":"+","text":"3. Run synthetic HTTP-boundary E2E, scoped lint/typecheck, existing tests, and package build. Fix any failures."},{"new":145,"old":null,"op":"+","text":"4. Save sanitized, repeatable E2E verdict evidence. Leave review, PR publishing, and live sync to the coordinating task."},{"new":146,"old":null,"op":"+","text":""},{"new":147,"old":null,"op":"+","text":"### E2E failure scenarios"},{"new":148,"old":null,"op":"+","text":""},{"new":149,"old":null,"op":"+","text":"- Preserve exact inbound and outbound 1:1 messages, match only an exact known prospect identity, and replay with no duplicate insert."},{"new":150,"old":null,"op":"+","text":"- Canonicalize supported LinkedIn profile hosts while rejecting lookalike hosts, credentials, extra path segments, and non-`/in/` profiles."},{"new":151,"old":null,"op":"+","text":"- Never use names to infer sender direction. Reject self, group, ambiguous, unknown-peer, malformed-row, and malformed-timestamp records with aggregate skip reasons."},{"new":152,"old":null,"op":"+","text":"- If participant union across rows makes a conversation a group thread, withhold the entire conversation, including rows that look 1:1 in isolation."},{"new":153,"old":null,"op":"+","text":"- Preserve aware timestamps. For accepted naive local timestamps, use observed time and mark provider-local timezone as unspecified. Keep read state unknown."},{"new":154,"old":null,"op":"+","text":"- Reject invalid/truncated snapshot envelopes, malformed page elements and links, first-page or generic 404s, and page-limit truncation before prospect lookup or writes. Accept the known late exhaustion 404 after a successful page."},{"new":155,"old":null,"op":"+","text":"- Verify duplicate-safe persisted event bodies and no writes on preflight failure or dry-run. Sanitize CLI output and keep `--apply` opt-in."},{"new":156,"old":null,"op":"+","text":""},{"new":157,"old":null,"op":"+","text":"### Throughput checkpoint"},{"new":158,"old":null,"op":"+","text":""},{"new":159,"old":null,"op":"+","text":"- Blocking first steps: record and run the HTTP-boundary scenarios red before production edits."},{"new":160,"old":null,"op":"+","text":"- Independent workstreams: n/a. The contract couples snapshot validation, planning, and apply behavior, and the clone has one owner."},{"new":161,"old":null,"op":"+","text":"- Shared mutable state: one owner writes the exclusive clone; plan, scenario runner, implementation, and evidence happen in order."},{"new":162,"old":null,"op":"+","text":"- Smallest safe decomposition: one implementation owner keeps the 1:1/group/thread safety invariant visible across the single slice."}],"new_start":105,"old_start":93}],"kind":"docs","language":null,"path":"PLANS.md","removed":0,"sensitive":null,"status":"modified","symbols":[]},{"added":61,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"{"},{"new":2,"old":null,"op":"+","text":"  \"passed\": true,"},{"new":3,"old":null,"op":"+","text":"  \"scenario_count\": 54,"},{"new":4,"old":null,"op":"+","text":"  \"scenarios\": {"},{"new":5,"old":null,"op":"+","text":"    \"all_snapshot_links_validated\": true,"},{"new":6,"old":null,"op":"+","text":"    \"ambiguous_suffixed_timestamps_rejected\": true,"},{"new":7,"old":null,"op":"+","text":"    \"attachment_only_content_is_preserved\": true,"},{"new":8,"old":null,"op":"+","text":"    \"aware_timestamp_is_actual\": true,"},{"new":9,"old":null,"op":"+","text":"    \"cleanup_attempts_both_clients\": true,"},{"new":10,"old":null,"op":"+","text":"    \"cli_apply_is_explicit\": true,"},{"new":11,"old":null,"op":"+","text":"    \"cli_defaults_to_dry_run\": true,"},{"new":12,"old":null,"op":"+","text":"    \"cli_failure_is_sanitized\": true,"},{"new":13,"old":null,"op":"+","text":"    \"combining_profile_identity_preserved\": true,"},{"new":14,"old":null,"op":"+","text":"    \"content_versions_keep_distinct_identity\": true,"},{"new":15,"old":null,"op":"+","text":"    \"database_replay_is_idempotent\": true,"},{"new":16,"old":null xt":"    finally:"},{"new":165,"old":null,"op":"+","text":"        try:"},{"new":166,"old":null,"op":"+","text":"            await linkedin.aclose()"},{"new":167,"old":null,"op":"+","text":"        finally:"},{"new":168,"old":null,"op":"+","text":"            await store.aclose()"},{"new":169,"old":null,"op":"+","text":""},{"new":170,"old":null,"op":"+","text":""},{"new":171,"old":null,"op":"+","text":"def main() -\u003e int:"},{"new":172,"old":null,"op":"+","text":"    \"\"\"Emit only fixed verdicts and keep all exceptions and provider data private.\"\"\""},{"new":173,"old":null,"op":"+","text":"    try:"},{"new":174,"old":null,"op":"+","text":"        persisted = asyncio.run(verify())"},{"new":175,"old":null,"op":"+","text":"    except Exception:  # noqa: BLE001"},{"new":176,"old":null,"op":"+","text":"        print(\"live inbox evidence: verification failed\")"},{"new":177,"old":null,"op":"+","text":"        return 1"},{"new":178,"old":null,"op":"+","text":"    if persisted:"},{"new":179,"old":null,"op":"+","text":"        print(\"live inbox evidence: persistence and duplicate-free replay verified\")"},{"new":180,"old":null,"op":"+","text":"    else:"},{"new":181,"old":null,"op":"+","text":"        print(\"live inbox evidence: empty result and duplicate-free replay verified\")"},{"new":182,"old":null,"op":"+","text":"    return 0"},{"new":183,"old":null,"op":"+","text":""},{"new":184,"old":null,"op":"+","text":""},{"new":185,"old":null,"op":"+","text":"if __name__ == \"__main__\":"},{"new":186,"old":null,"op":"+","text":"    raise SystemExit(main())"}],"new_start":1,"old_start":0}],"kind":"code","language":"python","path":"diagnostics/verify_inbox_live.py","removed":0,"sensitive":null,"status":"added","symbols":["diagnostics/verify_inbox_live.py::FrozenInbox","diagnostics/verify_inbox_live.py::FrozenInbox.__init__","diagnostics/verify_inbox_live.py::FrozenInbox.snapshot","diagnostics/verify_inbox_live.py::VerifiedStore","diagnostics/verify_inbox_live.py::Verified M list by action:"},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"- Reply when the latest verified inbound LinkedIn message is later than the latest outbound message. Include the relevant message and a reminder to respond; the owner writes the reply."},{"new":16,"old":null,"op":"+","text":"- Prepare a researched first-DM draft for a verified accepted connection when complete relevant inbox evidence establishes no prior outbound DM. Automatically write a personalized opener grounded in the saved background research."},{"new":17,"old":null,"op":"+","text":"- Follow up when a verified outbound DM is at least 72 hours old and has no later reply. Show elapsed time and read status as a reminder; the owner writes the follow-up. Missing read evidence means unknown. No reply does not prove the person ignored the message."},{"new":18,"old":null,"op":"+","text":""},{"new":19,"old":null,"op":"+","text":"Only first-DM drafts are generated automatically. Replies and follow-ups remain manual, with no generated response text. The report does not send any messages."},{"new":20,"old":null,"op":"+","text":""},{"new":21,"old":null,"op":"+","text":"Exclude opt-outs and terminal negative responses from automatic follow-up recommendations. Keep LinkedIn and email history separate. Invitation notes must not count as first DMs. Missing, stale, malformed, or truncated sources withhold affected actions instead of producing false empty queues."},{"new":22,"old":null,"op":"+","text":""},{"new":23,"old":null,"op":"+","text":"## Research and storage"},{"new":24,"old":null,"op":"+","text":""},{"new":25,"old":null,"op":"+","text":"For newly accepted connections eligible for first DMs, automatically research the exact person through Exa, Clay, or another available research provider. Save supported professional facts, cited URLs, source dates when known, retrieval time, provider, identity binding, uncertainty, and status in Supabase before publishing a personalized first-message opener. Surface research failures and allow bounded retries. Never invent a personalization fact when research fails."},{"new":26,"old":null,"op":"+","text":""},{"new":27,"old":null,"op":"+","text":"Log source observations, research attempts and results, report recommendations, drafts, actual sends, acceptances, replies, and run outcomes as distinct facts. A draft or recommendation does not establish that a message was sent. Replay must not duplicate evidence. Preserve failed research attempts separately so they cannot prevent a later successful result from being saved."},{"new":28,"old":null,"op":"+","text":""},{"new":29,"old":null,"op":"+","text":"The scheduled agent orchestrates the run. Keep ingestion, validation, queue building, persistence, and publication in repository code where practical. The agent can use connected Exa tools and pass a validated research envelope to repository code for persistence. GitHub CI cannot reuse the agent connector's authorization. Schema and scheduled infrastructure changes require separate approval."},{"new":30,"old":null,"op":"+","text":""},{"new":31,"old":null,"op":"+","text":"## Current slice and remaining work"},{"new":32,"old":null,"op":"+","text":""},{"new":33,"old":null,"op":"+","text":"This PR adds only private INBOX evidence planning and optional persistence for existing prospects. It preserves exact participant identity, message content and subject, attachment evidence, provider time, and uncertainty. It does not produce the two lists yet."},{"new":34,"old":null,"op":"+","text":""},{"new":35,"old":null,"op":"+","text":"Live inbox persistence and replay are verified. Next, classify invitation notes versus DMs, establish relevant source coverage, integrate invitation eligibility, build the queues, connect research persistence and first-message drafting, and publish the actual person-level report. Enable the scheduled path after live report verification, then observe a scheduled run before claiming completion."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"docs/action-report-contract.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":27,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Inbox evidence sync"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"`python scripts/sync_inbox.py` reads and validates the full MDP INBOX snapshot, matches exact LinkedIn member profile URLs to existing prospects, and prints `DRY_RUN_COMPLETE`. It does not write events. Add `--apply` to opt into duplicate-safe writes. Set `LINKEDIN_ACCOUNT_PROFILE_URL` or pass `--account-profile-url` to identify the account profile. Credentials come from the existing LinkedIn and Supabase environment variables."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"The sync keeps only messages with one sender and one recipient, where the account is exactly one participant and the other participant is an existing prospect. It uses profile URLs for direction and never uses display names. Group conversations, self-messages, unknown peers, malformed rows, and unsupported timestamps do not produce events. If any row shows that a conversation has more than two participants or has malformed participant data, the sync withholds every row for that conversation."},{"new":6,"old":null,"op":"+","text":""},{"new":7,"old":null,"op":"+","text":"Events preserve the provider row in `payload.raw`, along with content, subject, attachment fields, canonical participants, direction, provider timestamp, and timestamp semantics. The export supplies recipient profile URLs and attachments as strings, and the sync retains those raw values. Empty content is accepted only when an attachment field has a value. Aware timestamps are normalized to UTC and marked `actual`. Naive provider timestamps use the observed time for `occurred_at` and are marked `observed_at` plus `provider_local_time_timezone_unspecified`; the sync does not assume a local timezone. Read state and `message_kind` are always `unknown`."},{"new":8,"old":null,"op":"+","text":""},{"new":9,"old":null,"op":"+","text":"`skipped_rows`, `withheld_thread_rows`, and `skip_reasons` explain how many input rows could not be planned. They describe this snapshot's evidence only. They do not count prospects ready for outreach or prove that a conversation has no earlier messages."},{"new":10,"old":null,"op":"+","text":""},{"new":11,"old":null,"op":"+","text":"INBOX rows may include invitation notes. This slice does not collect CHANGELOG activity data to distinguish invitation notes from direct messages. Message classification, message coverage checks, and confirmation that an event belongs in first-message or follow-up readiness remain prerequisites before those workflows use this evidence. The sync does not update outreach state or claim that a message was read."},{"new":12,"old":null,"op":"+","text":""},{"new":13,"old":null,"op":"+","text":"The E2E runner uses synthetic LinkedIn and Supabase HTTP transports. Run `uv run python tests/e2e_inbox_sync.py` to repeat the scenarios and refresh `artifacts/inbox-e2e-evidence.json`. The evidence contains only a source revision label and fixed scenario verdicts. The pytest entry point runs this same E2E script in the existing PR checks without a workflow change."},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"`diagnostics/verify_inbox_live.py` is the live validation utility. It uses complete outgoing invitation evidence to establish the account identity, captures one real INBOX snapshot, applies it through the production writer, reads back every expected event body, and replays that same captured snapshot. It verifies no duplicate inserts and unchanged persisted facts, including earlier observation timestamps for existing naive-time records. Its output contains fixed verdicts only and it needs the trusted runtime credentials. The synthetic E2E artifact covers simulated HTTP boundaries; the approved credentialed run linked below supplies the separate live proof."},{"new":16,"old":null,"op":"+","text":""},{"new":17,"old":null,"op":"+","text":"The complete report requirements and remaining milestones are recorded in [Actionable LinkedIn report](action-report-contract.md)."},{"new":18,"old":null,"op":"+","text":""},{"new":19,"old":null,"op":"+","text":"The live provider also supplies `YYYY-MM-DD HH:MM:SS UTC` timestamps. This exact format has explicit UTC semantics and is stored as actual provider time. Other timezone abbreviations and conflicting offset-plus-abbreviation forms remain unsupported; they are never assigned an assumed timezone."},{"new":20,"old":null,"op":"+","text":""},{"new":21,"old":null,"op":"+","text":"The approved [live validation run](https://github.com/komaksym/linkedin-mdp/actions/runs/36985062303) verified nonempty persistence, complete payload and timestamp readback, and duplicate-free replay at revision `5cc23814450c14b4a8d3312c682b5f65fa87e22c`. The verdict contains no member data. This establishes the inbox evidence path; it does not establish DM classification or action readiness."},{"new":22,"old":null,"op":"+","text":""},{"new":23,"old":null,"op":"+","text":"Strict pagination binds every next link to the original endpoint and request scope. Omitted scope parameters are restored; changed or duplicate domain/query selectors fail before database access, even if the next page would be empty. Attachment-only messages may omit `CONTENT`; an omitted field is retained as empty text, while explicit null or nonstring content remains invalid."},{"new":24,"old":null,"op":"+","text":""},{"new":25,"old":null,"op":"+","text":"A complete snapshot with no matching events is a valid empty result. The live verifier emits `live inbox evidence: empty result and duplicate-free replay verified`, performs no event writes, and does not claim nonempty persistence. The synthetic review E2E runner repeats this path and the attachment cases; run `uv run python tests/e2e_inbox_review.py` to refresh `artifacts/inbox-review-e2e-evidence.json`."},{"new":26,"old":null,"op":"+","text":""},{"new":27,"old":null,"op":"+","text":"Profile matching preserves exact Unicode letters, marks, numbers and symbols. Equivalent UTF-8 percent encoding resolves to the same identity. It does not transliterate names or merge composed and decomposed spellings. Malformed encoding, encoded separators, whitespace, and literal or encoded controls are rejected before they can establish a participant identity."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"docs/inbox-evidence.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":5,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Analysis"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"Technical system content for the owner reviewing the first implementation slice. Show one existing storage boundary, snapshot validation, message evidence, and pending downstream queues. No people, message content, identifiers, counts, credentials, or live completion claims."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"Use technical defaults. Structural breakdown, technical schematic, landscape 16:9, English. Saved backend preference is auto; native imagegen is available."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/inbox-evidence-slice/analysis.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":0,"hunks":[],"kind":"opaque","language":null,"path":"infographic/inbox-evidence-slice/infographic.png","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":7,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"Use case: infographic-diagram"},{"new":2,"old":null,"op":"+","text":"Asset type: small technical system infographic for a GitHub PR."},{"new":3,"old":null,"op":"+","text":"Create a polished 16:9 landscape English raster infographic with a structural-breakdown layout and technical-schematic style. Title exactly \"Inbox evidence before DM actions\". Opaque neutral warm-gray canvas, clear thin outer boundary, dark high-contrast typography, restrained blue and teal accents, generous whitespace. Keep all labels inside the canvas. No transparent background."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"Show a high-level left-to-right system of three main parts, with neatly illustrated stacked provider pages labeled \"LinkedIn INBOX\", a central validation component labeled \"Validate full snapshot\" with a smaller label \"Exact profile identities\", and an existing database cylinder labeled \"Supabase events\". The link entering storage is labeled \"Duplicate-safe message evidence\". Include a small clear callout \"Dry-run by default\" and another \"Read status stays unknown\". Use a separate muted lower box connected with a dashed pending line, labeled exactly \"Next slice: reply, first DM, follow-up\". Make the pending state obvious."},{"new":6,"old":null,"op":"+","text":""},{"new":7,"old":null,"op":"+","text":"Use clean engineering geometry and simple icons. Avoid a dense flowchart or DAG. All text is large and legible. Do not invent text, names, profile URLs, message content, credentials, private identifiers, actual counts, percentages, or claims of live completion. This diagram explains a first evidence-ingestion slice whose downstream action report is still pending."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/inbox-evidence-slice/prompts/01-infographic-inbox-evidence.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":5,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Inbox evidence before DM recommendations"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"The first implementation slice reads LinkedIn INBOX snapshots, validates provider pages and exact account/profile identities, and plans duplicate-safe inbound and outbound evidence for existing Supabase prospects. Dry-run is the default. Applying the plan is explicit. Missing read receipts remain unknown. Incomplete snapshots and ambiguous conversations cannot become actionable evidence."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"Reply, first-DM, and follow-up queues remain the next slice. Personalized first-DM research and the final scheduled two-list report are pending."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/inbox-evidence-slice/source-inbox-evidence.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":15,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Structured content"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"Title: Inbox evidence before DM actions"},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"Labels:"},{"new":6,"old":null,"op":"+","text":"- LinkedIn INBOX"},{"new":7,"old":null,"op":"+","text":"- Validate full snapshot"},{"new":8,"old":null,"op":"+","text":"- Exact profile identities"},{"new":9,"old":null,"op":"+","text":"- Duplicate-safe message evidence"},{"new":10,"old":null,"op":"+","text":"- Supabase events"},{"new":11,"old":null,"op":"+","text":"- Dry-run by default"},{"new":12,"old":null,"op":"+","text":"- Read status stays unknown"},{"new":13,"old":null,"op":"+","text":"- Next slice: reply, first DM, follow-up"},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"Show provider pages to the left, validator in the center, and existing Supabase events storage to the right. Place an explicit muted pending downstream box below. The viewer must distinguish the implemented evidence path from pending action queues."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/inbox-evidence-slice/structured-content.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":5,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Analysis"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"Technical system infographic for a small backend PR repair. Learning objective: show how source scope, evidence preservation, and truthful verification interact before downstream report actions."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"Resolved defaults: structural-breakdown, technical-schematic, landscape 16:9, English, native imagegen. Saved backend preference is auto. No private records, dates, account identities, counts, or credentials appear."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/inbox-review-repair/analysis.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":0,"hunks":[],"kind":"opaque","language":null,"path":"infographic/inbox-review-repair/infographic.png","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":16,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"Use case: infographic-diagram"},{"new":2,"old":null,"op":"+","text":"Asset type: GitHub PR system infographic, raster PNG"},{"new":3,"old":null,"op":"+","text":"Layout: structural-breakdown"},{"new":4,"old":null,"op":"+","text":"Style: technical-schematic"},{"new":5,"old":null,"op":"+","text":"Aspect ratio: 16:9 landscape"},{"new":6,"old":null,"op":"+","text":"Language: English"},{"new":7,"old":null,"op":"+","text":""},{"new":8,"old":null,"op":"+","text":"Create a clean, compact, high-level system infographic titled exactly \"Inbox evidence: review repairs\". Use an opaque warm light-gray canvas, dark charcoal labels, a visible restrained border, blue and teal accents with amber on rejection paths. Large readable sans-serif text. Plenty of whitespace. Crisp schematic-style modules with small page, attachment, storage, and verification icons; no screenshots or real data."},{"new":9,"old":null,"op":"+","text":""},{"new":10,"old":null,"op":"+","text":"Show three connected modules left to right: \"Source guard\", \"Message evidence\", \"Verification\"."},{"new":11,"old":null,"op":"+","text":"Under Source guard: \"Same endpoint + same domain\", \"Reject scope changes\". Show an attempted wrong-scope page stopped at a gate, including an empty page icon."},{"new":12,"old":null,"op":"+","text":"Under Message evidence: \"Attachment + omitted text → retained\". Show a paperclip preserved inside the evidence envelope."},{"new":13,"old":null,"op":"+","text":"Under Verification: split into two clearly labeled outcomes: \"Empty plan → empty verified\" and \"Saved events → readback + replay verified\". Never imply an empty plan proves persistence."},{"new":14,"old":null,"op":"+","text":"At bottom include two short notes: \"Synthetic tests and live proof stay distinct\" and \"DM actions: next feature\"."},{"new":15,"old":null,"op":"+","text":""},{"new":16,"old":null,"op":"+","text":"Only the quoted labels above should appear. No numerical metrics, identities, dates, API URLs, secrets, logos, watermarks, or decorative clutter. All text and lines must fit inside the opaque canvas and be readable in light and dark surrounding GitHub pages."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/inbox-review-repair/prompts/01-infographic-inbox-review-repair.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":9,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Inbox evidence review repairs"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"Keep pagination on the requested endpoint and snapshot domain, including when later pages are empty. Restore omitted query scope; reject explicit changes before storage access."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"Preserve attachment-only messages when CONTENT is omitted. Missing text becomes empty text; explicit invalid text remains invalid."},{"new":6,"old":null,"op":"+","text":""},{"new":7,"old":null,"op":"+","text":"Verify complete empty plans separately from persisted evidence. Empty verification proves zero planned writes and duplicate-free replay, not nonempty persistence."},{"new":8,"old":null,"op":"+","text":""},{"new":9,"old":null,"op":"+","text":"Keep synthetic boundary evidence separate from approved live persistence, payload readback, and replay proof. DM actions remain a later feature."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/inbox-review-repair/source-inbox-review-repair.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":23,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Inbox evidence: review repairs"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"## Source guard"},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"Same endpoint + same domain"},{"new":6,"old":null,"op":"+","text":""},{"new":7,"old":null,"op":"+","text":"Reject scope changes"},{"new":8,"old":null,"op":"+","text":""},{"new":9,"old":null,"op":"+","text":"## Message evidence"},{"new":10,"old":null,"op":"+","text":""},{"new":11,"old":null,"op":"+","text":"Attachment + omitted text → retained"},{"new":12,"old":null,"op":"+","text":""},{"new":13,"old":null,"op":"+","text":"## Verification"},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"Empty plan → empty verified"},{"new":16,"old":null,"op":"+","text":""},{"new":17,"old":null,"op":"+","text":"Saved events → readback + replay verified"},{"new":18,"old":null,"op":"+","text":""},{"new":19,"old":null,"op":"+","text":"## Evidence boundary"},{"new":20,"old":null,"op":"+","text":""},{"new":21,"old":null,"op":"+","text":"Synthetic tests and live proof stay distinct"},{"new":22,"old":null,"op":"+","text":""},{"new":23,"old":null,"op":"+","text":"DM actions: next ,"old":null,"op":"+","text":"Input label: \"Unicode URLs + UTF-8 aliases\""},{"new":5,"old":null,"op":"+","text":"Four separated central layers, in this order:"},{"new":6,"old":null,"op":"+","text":"\"Reject controls before parsing\""},{"new":7,"old":null,"op":"+","text":"\"Trusted LinkedIn host + member path\""},{"new":8,"old":null,"op":"+","text":"\"Decode UTF-8 once\""},{"new":9,"old":null,"op":"+","text":"\"Preserve exact Unicode codepoints\""},{"new":10,"old":null,"op":"+","text":"Two output labels: \"Inbox evidence\" and \"Invitation history exclusions\""},{"new":11,"old":null,"op":"+","text":"Amber reject callout: \"Malformed encoding, separators, controls\""},{"new":12,"old":null,"op":"+","text":"Footer: \"No transliteration. No spelling merges.\""},{"new":13,"old":null,"op":"+","text":""},{"new":14,"old":null,"op":"+","text":"The visual should make clear that the same exact canonical identity serves both output uses, while unsafe URL inputs are rejected. Do not add any labels or claims beyond the specified text. Use clean geometric precision, consistent strokes, light subtle grid, engineering callout lines, clean sans serif typography. Render a polished raster infographic suitable for a GitHub pull request. This is a structural cutaway of one small module, not a Mermaid flowchart or generic DAG."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/unicode-profile-identity/prompts/01-infographic-unicode-profile-identity.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":8,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Preserve Unicode profile identity"},{"new":2,"old":null,"op":"+","text":"Provider URLs may contain Unicode names or UTF-8 percent-encoded aliases."},{"new":3,"old":null,"op":"+","text":"Reject control characters before parsing the URL."},{"new":4,"old":null,"op":"+","text":"Require a trusted LinkedIn host and one member profile path."},{"new":5,"old":null,"op":"+","text":"Decode val
