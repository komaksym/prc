}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --dot: rgba(15, 23, 42, 0.09);
    --panel: rgba(255, 255, 255, 0.9);
    --panel-solid: #ffffff;
    --raise: #ffffff;
    --card: #ffffff;
    --card-ctx: #f9fafb;
    --border: #e1e4ea;
    --border-strong: #cfd4dc;
    --band: rgba(15, 23, 42, 0.022);
    --text: #0f1420;
    --muted: #5b6372;
    --faint: #8b93a1;
    --green: #129b5a;
    --amber: #c27c0e;
    --red: #d6363f;
    --grey: #9aa1ad;
    --accent: #4f5bd5;
    --edge: #a3a9b5;
    --add-bg: rgba(18, 155, 90, 0.1);
    --del-bg: rgba(214, 54, 63, 0.09);
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 6px 20px rgba(15, 23, 42, 0.07);
    --shadow-lg: 0 24px 64px rgba(15, 23, 42, 0.18);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
}

.st-added { --st: var(--green); }
.st-modified { --st: var(--amber); }
.st-deleted { --st: var(--red); }
.st-context { --st: var(--grey); }

/* Header */

.top {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-solid);
  position: relative;
  z-index: 5;
}

.headline { min-width: 0; flex: 1 1 0; }

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}

.logo {
  display: inline-grid;
  grid-template-columns: repeat(3, 4px);
  gap: 2px;
  align-items: center;
}

.logo i {
  display: block;
  width: 4px;
  height: 12px;
  border-radius: 2px;
  background: var(--green);
}

.logo i:nth-child(2) { height: 8px; background: var(--amber); }
.logo i:nth-child(3) { height: 5px; background: var(--red); }

.brand-name {
  color: var(--text);
  font-weight: 600;
  letter-spacing: 0.01em;
}

.meta { overflow: hidden; text-overflow: ellipsis; }
.meta .sep { color: var(--faint); margin: 0 6px; }
.meta .mono { font-family: var(--mono); font-size: 11.5px; }

.meta a {
  color: var(--accent);
  text-decoration: none;
}

.meta a:hover { text-decoration: underline; }

h1 {
  margin: 4px 0 0;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.012em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stats {
  display: flex;
  gap: 8px;
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
}

.stat {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 72px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--raise);
  white-space: nowrap;
}

.stat-value {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 17px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
}

.stat.good .stat-value { color: var(--green); }
.stat.bad .stat-value { color: var(--red); }
.stat.warn .stat-value { color: var(--amber); }
.stat.none .stat-value { color: var(--muted); }

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
}

.play {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 16px 0 14px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--text);
  color: var(--bg);
  font-weight: 600;
  white-space: nowrap;
  box-shadow: var(--shadow);
}

.play:hover { opacity: 0.9; }

.play-icon {
  width: 0;
  height: 0;
  border-left: 9px solid currentColor;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.playing .play-icon {
  width: 10px;
  height: 12px;
  border: 0;
  border-left: 3px solid currentColor;
  border-right: 3px solid currentColor;
}

/* Canvas */

.viewport {
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.2px);
  background-size: 24px 24px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.viewport.dragging { cursor: grabbing; }

.world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
}

.band {
  position: absolute;
  border: 1px dashed var(--border);
  border-radius: 16px;
  background: var(--band);
}

.band-label {
  position: absolute;
  left: 16px;
  top: 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  white-space: nowrap;
}

.edges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.e {
  fill: none;
  stroke: var(--edge);
  stroke-width: 1.5;
  transition: opacity 160ms ease;
}

.e-added {
  stroke: var(--green);
  stroke-width: 2;
  stroke-dasharray: 8 6;
  animation: flow 1s linear infinite;
}

.e-removed {
  stroke: var(--red);
  stroke-width: 1.75;
  stroke-dasharray: 5 5;
  opacity: 0.85;
}

.e-name {
  stroke-dasharray: 1 6;
  stroke-linecap: round;
  stroke-width: 2.25;
}

.e-added.e-name { stroke-width: 2.5; }

.arrow-added { fill: var(--green); }
.arrow-removed { fill: var(--red); }
.arrow-kept { fill: var(--edge); }

@keyframes flow {
  to { stroke-dashoffset: -28; }
}

/* Nodes */

.node {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 8px 12px 8px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
  transition: opacity 160ms ease, border-color 120ms ease, box-shadow 160ms ease;
}

.node:hover { border-color: var(--border-strong); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.node .bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--st);
}

.node.st-context {
  background: var(--card-ctx);
  border-style: dashed;
  box-shadow: none;
}

.node.st-context .bar { opacity: 0.6; }

.n-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.glyph {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1px solid var(--border-strong);
  color: var(--muted);
  font: 600 10.5px/1 var(--mono);
}

.name {
  min-width: 0;
  flex: 1 1 auto;
  font: 600 13px/1.3 var(--mono);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.st-context .name { color: var(--muted); font-weight: 500; }

.st-deleted .name {
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 1.5px;
  color: var(--muted);
}

.pill {
  flex: none;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--st);
  background: color-mix(in srgb, var(--st) 14%, transparent);
}

.path {
  font: 11px/1.35 var(--mono);
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}

.path > span { direction: ltr; unicode-bidi: isolate; }

.n-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
}

.n-row > .path { flex: 1 1 auto; min-width: 0; }

.n-row > .sites {
  flex: none;
  font-size: 11px;
  color: var(--faint);
}

.delta { font: 600 11.5px/1 var(--mono); }
.plus { color: var(--green); }
.minus { color: var(--red); }

.badge {
  margin-left: auto;
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
  background: color-mix(in srgb, var(--amber) 10%, transparent);
}

.chip {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 12px 0 16px;
  border-radius: 999px;
}

.chip .bar { width: 3px; }

.chip .name { flex: 0 1 auto; font-weight: 500; font-size: 12.5px; }
.chip.st-deleted .name { color: var(--muted); }

/* Grouped overview */

.fedges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.ge {
  fill: none;
  stroke: var(--edge);
  stroke-width: 2;
}

.ge-added { stroke: var(--green); }
.ge-removed { stroke: var(--red); }

.fcard {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 10px 14px 10px 16px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  overflow: hidden;
}

.fcard:hover { border-color: var(--border-strong); }
.fcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.f-name {
  font: 600 13px/1.3 var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.f-counts {
  font: 11px/1.4 var(--mono);
  color: var(--muted);
}

.flist {
  display: none;
  margin-top: 6px;
  border-top: 1px solid var(--border);
  padding-top: 6px;
  gap: 2px;
  overflow: auto;
}

.fcard.open {
  justify-content: flex-start;
  height: auto !important;
  max-height: 360px;
  z-index: 5;
}

.fcard.open .flist { display: grid; }

.fmem {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 4px 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  text-align: left;
}

.fmem:hover { background: var(--band); }

.fmem-name {
  flex: 1 1 auto;
  min-width: 0;
  font: 12px/1.35 var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fmem-tag {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.world.grouped .node.concealed { opacity: 0; }

.dense .sym {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 8px 0 12px;
  border-radius: 8px;
  box-shadow: none;
}

.dense .sym .bar { width: 3px; }
.dense .sym .name { font-size: 12px; }
.dense .sym .glyph { width: 16px; height: 16px; font-size: 9.5px; }
.dense .sym .pill { padding: 0 5px; font-size: 9px; }

.flag {
  flex: none;
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  font: 700 10px/1 var(--sans);
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
}

.group {
  position: absolute;
  padding: 6px 4px 0;
  font: 11px/1.3 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
  pointer-events: none;
}

.group > span { direction: ltr; unicode-bidi: isolate; }

body:not(.touring) .dense .e:not(.lit) { opacity: 0; }

.empty {
  position: absolute;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%);
  padding: 12px 20px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
  pointer-events: none;
}

.risk {
  flex: none;
  margin-left: auto;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--red);
  background: color-mix(in srgb, var(--red) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
  white-space: nowrap;
}

.world.far .path,
.world.far .sites { display: none; }
.world.far .name { font-size: 16px; }
.world.far .pill { font-size: 12px; }

.hovering .node:not(.lit),
.hovering .e:not(.lit) { opacity: 0.14; }

.hovering .e.lit { stroke-width: 2.5; }

.node.lit { border-color: var(--border-strong); }

.node.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent), var(--shadow);
}

.node.focus {
  border-color: var(--st);
  box-shadow: 0 0 0 1px var(--st), 0 0 40px color-mix(in srgb, var(--st) 40%, transparent), var(--shadow);
}

/* Tour */

.touring .node,
.touring .e { transition: none; }

.touring .e-added { animation: none; }

.spot {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 35%, color-mix(in srgb, var(--bg) 82%, transparent) 100%);
}

.touring .spot { opacity: 1; }

.progress {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 2px;
  display: none;
}

.touring .progress { display: block; }

#progress-bar {
  height: 100%;
  width: 0;
  background: var(--accent);
}

.caption {
  position: absolute;
  left: 50%;
  bottom: 40px;
  width: min(760px, calc(100% - 48px));
  transform: translateX(-50%);
  padding: 16px 24px 18px;
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .caption { display: block; }

.cap-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.cap-count { color: var(--faint); font-variant-numeric: tabular-nums; }

.cap-main {
  margin-top: 6px;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.015em;
}

.cap-main .code { font-family: var(--mono); font-size: 20px; }

.cap-sub {
  margin-top: 6px;
  font: 12.5px/1.4 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.summary {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(720px, calc(100% - 48px));
  transform: translate(-50%, -50%);
  padding: 32px 40px;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  background: var(--panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .summary { display: block; }

.sum-kicker {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.sum-title {
  margin-top: 8px;
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -0.015em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sum-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 24px;
}

.sum-cell {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--raise);
}

.sum-num {
  font-size: 40px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.sum-label { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.sum-cell.good .sum-num { color: var(--green); }
.sum-cell.bad .sum-num { color: var(--red); }
.sum-cell.warn .sum-num { color: var(--amber); }

.sum-note {
  margin-top: 16px;
  color: var(--muted);
  font-size: 14px;
}

.sum-brand {
  margin-top: 24px;
  font-size: 12px;
  color: var(--faint);
}

/* Floating controls */

.legend {
  position: absolute;
  left: 16px;
  bottom: 16px;
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 11.5px;
  color: var(--muted);
  box-shadow: var(--shadow);
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.sw {
  width: 10px;
  height: 10px;
  margin-left: 6px;
  border-radius: 3px;
  background: var(--st);
}

.sw:first-child, .ls:first-child { margin-left: 0; }
.ls { width: 32px; height: 8px; margin-left: 8px; overflow: visible; }

.zoom {
  position: absolute;
  right: 16px;
  bottom: 16px;
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.zoom button {
  min-width: 36px;
  height: 32px;
  padding: 0 10px;
  border: 0;
  border-right: 1px solid var(--border);
  background: transparent;
  font-size: 13px;
  color: var(--muted);
}

.zoom button:last-child { border-right: 0; }
.zoom button:hover { color: var(--text); background: var(--band); }

.touring .legend,
.touring .zoom { opacity: 0; pointer-events: none; }

/* Drawer */

.drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 92vw);
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--panel-solid);

new":34,"old":null,"op":"+","text":"          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"},{"new":35,"old":null,"op":"+","text":"        run: PYTHONPATH=src .venv/bin/python scripts/sync_invitations.py"}],"new_start":1,"old_start":0}],"kind":"config","language":null,"path":".github/workflows/sync-invitations.yml","removed":0,"sensitive":"CI workflow","status":"added","symbols":[]},{"added":43,"hunks":[{"lines":[{"new":39,"old":39,"op":" ","text":"3. Make the live MCP E2E derive expected rows with an independent structural-equality oracle and self-check that the old single-snapshot behavior is rejected."},{"new":40,"old":40,"op":" ","text":"4. Add a Codex project-local `verify` skill that launches, doctors, drives, captures evidence, and cleans up the real MCP service."},{"new":41,"old":41,"op":" ","text":"5. Prove the skill once end to end, then run narrow tests, full tests, build, live E2E, and PR review."},{"new":42,"old":null,"op":"+","text":""},{"new":43,"old":null,"op":"+","text":"## Issue #6. Invitation history reconciliation"},{"new":44,"old":null,"op":"+","text":""},{"new":45,"old":null,"op":"+","text":"Summary. Ingest complete outbound INVITATIONS history as durable events for existing prospects. Use event evidence to exclude prior invites, connections, and LinkedIn DMs from fresh invite selection. Keep lifecycle unknown and provider timezone uncertainty explicit."},{"new":46,"old":null,"op":"+","text":""},{"new":47,"old":null,"op":"+","text":"### Milestones"},{"new":48,"old":null,"op":"+","text":""},{"new":49,"old":null,"op":"+","text":"- [x] Ground the current CONNECTIONS, Supabase, and state flow."},{"new":50,"old":null,"op":"+","text":"- [x] Compare a parallel invitation module with a generic domain reconciler. Choose the parallel module to keep working CONNECTIONS code unchanged."},{"new":51,"old":null,"op":"+","text":"- [x] Write failure cases and end-to-end HTTP-boundary tests before implementation."},{"new":52,"old":null,"op":"+","text":"- [x] Implement invitation planning, reconciliation, manual command, and aggregate-only workflow."},{"new":53,"old":null,"op":"+","text":"- [ ] With user approval, update the event-derived SQL state and eligibility rule."},{"new":54,"old":null,"op":"+","text":"- [x] Run lint, typecheck, tests, build, and repeatable verification artifacts."},{"new":55,"old":null,"op":"+","text":"- [x] Review and generate the system infographic."},{"new":56,"old":null,"op":"+","text":"- [ ] Publish the PR."},{"new":57,"old":null,"op":"+","text":"- [ ] Finish approved eligibility SQL and production replay verification."},{"new":58,"old":null,"op":"+","text":""},{"new":59,"old":null,"op":"+","text":"### Invitation reconciliation failure cases (written before implementation)"},{"new":60,"old":null,"op":"+","text":""},{"new":61,"old":null,"op":"+","text":"1. A truncated snapshot, swallowed first-page 404, or absent provider page must never touch Supabase."},{"new":62,"old":null,"op":"+","text":"2. A later-page provider error must never touch Supabase, even if earlier pages contain valid outbound rows."},{"new":63,"old":null,"op":"+","text":"3. Malformed `raw_elements` (non-object element, wrong domain, missing or non-list `snapshotData`) must fail before Supabase; the generic client silently skips some of these."},{"new":64,"old":null,"op":"+","text":"4. Inbound rows must not establish invitation evidence; malformed rows, invalid URLs, and missing or invalid timestamps must be counted and skipped."},{"new":65,"old":null,"op":"+","text":"5. Canonical URL variants and equivalent provider timestamps must collapse to one event; distinct provider timestamps must remain distinct."},{"new":66,"old":null,"op":"+","text":"6. Only existing prospects can receive events. A second run over the same provider history must insert zero rows."},{"new":67,"old":null,"op":"+","text":"7. Naive provider timestamps cannot become absolute event times. Their event time is the labeled observation time, while the provider text and normalized local timestamp remain in payload and key."},{"new":68,"old":null,"op":"+","text":"8. The command must emit aggregate JSON or a fixed safe error and never print provider rows or a raw traceback."},{"new":69,"old":null,"op":"+","text":"9. Every page must contain a valid `elements` list and usable pagination metadata; an empty list is a valid page, while a broken continuation is not."},{"new":70,"old":null,"op":"+","text":""},{"new":71,"old":null,"op":"+","text":"### Throughput checkpoint"},{"new":72,"old":null,"op":"+","text":""},{"new":73,"old":null,"op":"+","text":"- Blocking first steps. Confirm issue and current main, inspect provider field shape, and get migration approval before schema changes."},{"new":74,"old":null,"op":"+","text":"- Independent workstreams. One implementation owner; independent read-only design review and production inspection; infographic preparation after code review."},{"new":75,"old":null,"op":"+","text":"- Shared mutable state. Give the implementation owner exclusive access to its worktree until it stops. Reviewers are read-only."},{"new":76,"old":null,"op":"+","text":"- Smallest safe decomposition. The parser, orchestration, HTTP-boundary tests, and manual command share one event contract and belong to one owner."},{"new":77,"old":null,"op":"+","text":""},{"new":78,"old":null,"op":"+","text":"### Contract and decisions"},{"new":79,"old":null,"op":"+","text":""},{"new":80,"old":null,"op":"+","text":"Use an invitation-specific plan and summary dataclass. Reuse canonical URL normalization and the existing host-pinned Supabase event writer. Key events by canonical invitee URL plus the stable normalized provider timestamp. Only OUTGOING records establish previously invited evidence. Skip unusable or unmatched rows with aggregate counts. Never use observation time in the durable key. Store the original provider timestamp, timestamp semantics, observed_via INVITATIONS, and lifecycle_state unknown. Fetch all pages before writes; reject truncation, later-page errors, malformed page envelopes, and unavailable snapshots. A timestamp with no timezone is not an absolute sent time; use observed_at for occurred_at with explicit semantics."},{"new":81,"old":null,"op":"+","text":""},{"new":82,"old":null,"op":"+","text":"The production outreach_state function ignores invitation history today. A database-function migration needs approval under AGENTS.md. No migration is introduced until permission arrives."},{"new":83,"old":null,"op":"+","text":""},{"new":84,"old":null,"op":"+","text":"Validation. The independent review required rejection of pagination links with missing or non-string relations. Two HTTP cases reproduced the failure before the guard was added. The generated technical system infographic shows the target flow; eligibility is explicitly pending approval. Per-file changes and the production read-only baseline are recorded in artifacts/."}],"new_start":39,"old_start":39}],"kind":"docs","language":null,"path":"PLANS.md","removed":0,"sensitive":null,"status":"modified","symbols":[]},{"added":11,"hunks":[{"lines":[{"new":59,"old":59,"op":" ","text":"`INVITE_SENT_NOT_CONNECTED` means only that an outgoing invitation exists and there is no current connection evidence. It does not mean LinkedIn reports the invitation as pending."},{"new":60,"old":60,"op":" ","text":""},{"new":61,"old":61,"op":" ","text":"The operational tables have RLS enabled and are not exposed to `anon` or `authenticated`; the RPC is intended for trusted server-side access via `service_role`."},{"new":62,"old":null,"op":"+","text":""},{"new":63,"old":null,"op":"+","text":"## Manual invitation history reconciliation"},{"new":64,"old":null,"op":"+","text":""},{"new":65,"old":null,"op":"+","text":"Run `PYTHONPATH=src uv run python scripts/sync_invitations.py` with `LINKEDIN_ACCESS_TOKEN`, `SUPABASE_URL`, and `SUPABASE_SERVICE_ROLE_KEY` set. The main-only `Sync LinkedIn Invitations` GitHub workflow runs the same command on demand. Both surfaces print aggregate counts only; command failures print a fixed error without provider rows or tracebacks."},{"new":66,"old":null,"op":"+","text":""},{"new":67,"old":null,"op":"+","text":"The command fetches all available INVITATIONS pages before reading Supabase, rejects incomplete or malformed pages, and writes duplicate-safe `LINKEDIN_INVITATION_HISTORY_FOUND` events only for existing prospects. It accepts only `OUTGOING` rows with a usable invitee profile URL and provider `Sent At` value. Each event retains the raw row, original timestamp, canonical URL, `observed_via=INVITATIONS`, and `lifecycle_state=unknown`. A timestamp without timezone uses observation time for `occurred_at` and sets `timestamp_semantics=observed_at`; the provider's local time is kept separately and is never assigned a guessed timezone."},{"new":68,"old":null,"op":"+","text":""},{"new":69,"old":null,"op":"+","text":"The current `outreach_state` SQL does not yet read this new history event type. Invitation-based candidate exclusion requires a separately approved migration; this command only records evidence. The workflow stays disabled unless the repository variable `INVITATIONS_RECONCILIATION_ENABLED` equals `true`. Set it only after the approved eligibility change and live replay verification are complete."},{"new":70,"old":null,"op":"+","text":""},{"new":71,"old":null,"op":"+","text":"Run `uv run --extra dev python scripts/verify_invitation_sync.py` to regenerate `artifacts/invitation_sync_verification.json` from synthetic HTTP-boundary tests without exporting member data."},{"new":72,"old":62,"op":" ","text":""},{"new":73,"old":63,"op":" ","text":"## Run locally"},{"new":74,"old":64,"op":" ","text":""}],"new_start":59,"old_start":59},{"lines":[{"new":132,"old":122,"op":" ","text":""},{"new":133,"old":123,"op":" ","text":"## Deliberately not included in v0.1"},{"new":134,"old":124,"op":" ","text":""},{"new":null,"old":125,"op":"-","text":"- automatic LinkedIn-to-Supabase synchronization"},{"new":135,"old":null,"op":"+","text":"- scheduled LinkedIn-to-Supabase synchronization"},{"new":136,"old":126,"op":" ","text":"- Clay enrichment ingestion"},{"new":137,"old":127,"op":" ","text":"- LGM campaign/API/webhook ingestion"},{"new":138,"old":128,"op":" ","text":"- OAuth refresh/token storage"}],"new_start":132,"old_start":122}],"kind":"docs","language":null,"path":"README.md","removed":1,"sensitive":null,"status":"modified","symbols":[]},{"added":18,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Invitation history change"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"- src/linkedin_mdp_mcp/invitation_sync.py adds complete-snapshot matching and durable historical invitation events."},{"new":4,"old":null,"op":"+","text":"- src/linkedin_mdp_mcp/client.py adds opt-in strict provider page validation and a type-narrowed changelog timestamp list."},{"new":5,"old":null,"op":"+","text":"- tests/test_invitation_sync_e2e.py exercises the real HTTP clients across synthetic pagination, malformed rows, failures and replay."},{"new":6,"old":null,"op":"+","text":"- scripts/sync_invitations.py exposes an aggregate-only manual reconciliation command."},{"new":7,"old":null,"op":"+","text":"- .github/workflows/sync-invitations.yml adds a main-only manual invocation using the existing secrets and pinned actions."},{"new":8,"old":null,"op":"+","text":"- scripts/verify_invitation_sync.py regenerates the privacy-safe verification result."},{"new":9,"old":null,"op":"+","text":"- artifacts/invitation_sync_verification.json records the repeatable HTTP-boundary check result."},{"new":10,"old":null,"op":"+","text":"- artifacts/invitation_production_baseline.json records read-only production evidence of the eligibility bug."},{"new":11,"old":null,"op":"+","text":"- artifacts/invitation_eligibility_acceptance.md records the pending database behavior checks before any SQL change."},{"new":12,"old":null,"op":"+","text":"- README.md documents operation and the pending eligibility gate."},{"new":13,"old":null,"op":"+","text":"- PLANS.md records the design, milestones, failure cases and validation."},{"new":14,"old":null,"op":"+","text":"- infographic/invitation-history-reconciliation contains the raster system visual and reproducible source, analysis, structured content and prompt."},{"new":15,"old":null,"op":"+","text":""},{"new":16,"old":null,"op":"+","text":"The infographic shows the target flow. Its final eligibility component is pending database migration approval. Ingestion alone does not fix recommendations. No production write or SQL migration has been performed."},{"new":17,"old":null,"op":"+","text":""},{"new":18,"old":null,"op":"+","text":"Design review compared a separate invitation module with a generic reconciler. Both reviewers and the cross-judge preferred the separate module to keep CONNECTIONS behavior unchanged. Strict page validation was retained as a necessary shared transport capability. The final review found malformed link relations and a missing docstring; both were corrected. Comment review recommended zero deletions."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"artifacts/invitation_change_summary.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":14,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Invitation eligibility acceptance"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"Write these behavioral checks before the SQL change."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"1. Existing prospect with only CLAY_ENRICHED evidence remains READY for a channel eligibility check."},{"new":6,"old":null,"op":"+","text":"2. Historical outbound invitation without authoritative timezone becomes INVITE_SENT_NOT_CONNECTED; invite_sent_at remains null; next_action is WAIT."},{"new":7,"old":null,"op":"+","text":"3. History with an authoritative provider timestamp derives invite_sent_at from provider time."},{"new":8,"old":null,"op":"+","text":"4. Any prior LINKEDIN_INVITE_SENT, LINKEDIN_INVITATION_HISTORY_FOUND, LINKEDIN_CONNECTION_FOUND, LINKEDIN_MESSAGE_OUTBOUND or LINKEDIN_MESSAGE_INBOUND blocks a fresh invite independently of campaign or enrichment state."},{"new":9,"old":null,"op":"+","text":"5. Campaign state and unrelated email events preserve existing behavior."},{"new":10,"old":null,"op":"+","text":"6. Missing prospect, unavailable or failed source never authorizes a send."},{"new":11,"old":null,"op":"+","text":"7. No historical invite becomes PENDING, accepted, rejected, withdrawn or expired."},{"new":12,"old":null,"op":"+","text":"8. Production read-only baseline currently has 2 invitation-history prospects, 0 recognized as invited, and 2 actionable. After approved migration those historical-only prospects must no longer remain actionable."},{"new":13,"old":null,"op":"+","text":""},{"new":14,"old":null,"op":"+","text":"No schema changes were made. A schema migration remains pending explicit human approval under AGENTS.md."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"artifacts/invitation_eligibility_acceptance.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":13,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"{"},{"new":2,"old":null,"op":"+","text":"  \"checked_at_local_date\": \"2026-10-01\","},{"new":3,"old":null,"op":"+","text":"  \"project_ref\": \"mvgzdcqhdruhjoexbdqp\","},{"new":4,"old":null,"op":"+","text":"  \"query_mode\": \"read_only\","},{"new":5,"old":null,"op":"+","text":"  \"prospects\": 1117,"},{"new":6,"old":null,"op":"+","text":"  \"history_prospects\": 2,"},{"new":7,"old":null,"op":"+","text":"  \"history_recognized_as_invited\": 0,"},{"new":8,"old":null,"op":"+","text":"  \"history_currently_actionable\": 2,"},{"new":9,"old":null,"op":"+","text":"  \"events_unique_constraint\": [\"source\", \"external_key\"],"},{"n  must be visually obvious: observed historical invitation becomes durable evidence and prevents a repeated invite, while current lifecycle remains unknown. Keep the four layers separate, technical but approachable, neutral self-contained background readable in light or dark surroundings. Render only the specified text, no added facts."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/invitation-history-reconciliation/prompts/01-technical-system.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":2,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"LinkedIn invitation history reconciliation"},{"new":2,"old":null,"op":"+","text":"Complete INVITATIONS snapshot. Outbound rows only. Match existing prospects by canonical LinkedIn profile URL. Store LINKEDIN_INVITATION_HISTORY_FOUND events. Durable key uses profile URL and provider sent timestamp. Replays insert zero duplicate events. Historical invitations prove previously invited; lifecycle is unknown. Event evidence blocks fresh invitations. Incomplete snapshots stop before any write. Provider timezone uncertainty is preserved. Logs show aggregate counts only."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/invitation-history-reconciliation/source.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":8,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# LinkedIn invitation history reconciliation"},{"new":2,"old":null,"op":"+","text":"Learning objective. Explain how historical outbound invitation evidence prevents another fresh invitation without inferring pending status."},{"new":3,"old":null,"op":"+","text":""},{"new":4,"old":null,"op":"+","text":"- Complete snapshot. LinkedIn INVITATIONS, outbound only. Incomplete snapshot stops before writes."},{"new":5,"old":null,"op":"+","text":"- Identity match. Canonical profile URL, existing prospects only."},{"new":6,"old":null,"op":"+","text":"- Durable evidence. LINKEDIN_INVITATION_HISTORY_FOUND. Key uses URL and provider timestamp. Replay inserts no duplicates."},{"new":7,"old":null,"op":"+","text":"- Eligibility. Prior invite evidence blocks a fresh invite. Lifecycle stays unknown."},{"new":8,"old":null,"op":"+","text":"- Operational guardrails. Unknown provider timezone preserved. Aggregate-only logs."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/invitation-history-reconciliation/structured-content.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":38,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"\"\"\"Manual, aggregate-only INVITATIONS history reconciliation command.\"\"\""},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"from __future__ import annotations"},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"import asyncio"},{"new":6,"old":null,"op":"+","text":"import json"},{"new":7,"old":null,"op":"+","text":"import sys"},{"new":8,"old":null,"op":"+","text":"from dataclasses import asdict"},{"new":9,"old":null,"op":"+","text":""},{"new":10,"old":null,"op":"+","text":"from linkedin_mdp_mcp.client import LinkedInMDPClient"},{"new":11,"old":null,"op":"+","text":"from linkedin_mdp_mcp.invitation_sync import reconcile_invitations"},{"new":12,"old":null,"op":"+","text":"from linkedin_mdp_mcp.supabase_client import SupabaseClient"},{"new":13,"old":null,"op":"+","text":""},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"async def main() -\u003e None:"},{"new":16,"old":null,"op":"+","text":"    \"\"\"Reconcile one complete snapshot and print only aggregate counts.\"\"\""},{"new":17,"old":null,"op":"+","text":"    linkedin: LinkedInMDPClient | None = None"},{"new":18,"old":null,"op":"+","text":"    supabase: SupabaseClient | None = None"},{"new":19,"old":null,"op":"+","text":"    try:"},{"new":20,"old":null,"op":"+","text":"        linkedin = LinkedInMDPClient.from_env()"     for (const member of folder.members) memberFolder.set(member, folder.index);
  }

  function countsLine(info) {
    return `${info.added} added${DOT}${info.modified} modified${DOT}` +
      `${info.deleted} deleted${DOT}${info.tests} tests`;
  }

  function folderBounds() {
    return bounds(folderNodes);
  }

  function applyConceal() {
    for (const [member, fi] of memberFolder) {
      member.el.classList.toggle("concealed", !expanded.has(fi));
    }
    for (const folder of folderNodes) {
      const open = expanded.has(folder.index);
      folder.el.classList.toggle("open", open);
      folder.el.setAttribute("aria-expanded", open ? "true" : "false");
    }
  }

  function toggleFolder(folder) {
    if (touring) exitTour();
    if (expanded.has(folder.index)) expanded.delete(folder.index);
    else expanded.add(folder.index);
    applyConceal();
    flyTo(fitTo(
      expanded.has(folder.index) ? bounds([...folder.members, ...folderNodes]) : folderBounds(),
      viewArea(),
      1.25,
    ));
  }

  function collapseAll() {
    expanded.clear();
    applyConceal();
    userMoved = false;
    flyTo(fitTo(folderBounds(), viewArea(), 1.1));
  }

  for (const folder of folderNodes) {
    const card = el("button", "fcard");
    card.setAttribute("data-folder", folder.key);
    card.setAttribute("type", "button");
    card.setAttribute("aria-expanded", "false");
    card.setAttribute("title", folder.info.label);
    card.style.left = `${folder.x}px`;
    card.style.top = `${folder.y}px`;
    card.style.width = `${folder.w}px`;
    card.style.height = `${folder.h}px`;
    add(card, el("div", "f-name", folder.info.label), el("div", "f-counts", countsLine(folder.info)));
    const list = el("div", "flist");
    for (const member of folder.members) {
      const row = el("button", `fmem st-${member.status}`);
      row.setAttribute("type", "button");
      add(row, el("span", "fmem-name", member.name), el("span", "fmem-tag", member.status));
      row.addEventListener("click", (event) => {
        event.stopPropagation();
        select(member, true);
      });
      list.appendChild(row);
    }
    card.appendChild(list);
    card.addEventListener("click", (event) => {
      event.stopPropagation();
      if (!dragged) toggleFolder(folder);
    });
    card.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.stopPropagation();
      toggleFolder(folder);
    });
    folder.el = card;
    world.appendChild(card);
  }

  for (const node of nodes) {
    const card = el("div", `node ${node.kind === "file" ? "chip" : "sym"} st-${node.status}`);
    card.setAttribute("data-node", node.key);
    card.setAttribute("tabindex", "0");
    card.setAttribute("role", "button");
    card.style.left = `${node.x}px`;
    card.style.top = `${node.y}px`;
    card.style.width = `${node.w}px`;
    card.style.height = `${node.h}px`;
    node.el = card;
    if (node.kind === "symbol") symbolCard(node);
    else fileCard(node);
    world.appendChild(card);
  }

  if (grouped) applyConceal();

  /* Camera */

  const cam = { x: 0, y: 0, k: 1 };
  const all = { x: 0, y: 0, w: LAYOUT.w, h: LAYOUT.h };
  let userMoved = false;

  function applyCamera() {
    world.style.transform = `translate(${round(cam.x)}px, ${round(cam.y)}px) scale(${cam.k.toFixed(4)})`;
    viewport.style.backgroundPosition = `${round(cam.x)}px ${round(cam.y)}px`;
    viewport.style.backgroundSize = `${round(24 * cam.k)}px ${round(24 * cam.k)}px`;
    world.classList.toggle("far", cam.k < 0.55);
  }

  function bounds(list) {
    if (!list.length) return all;
    const x = Math.min(...list.map((n) => n.x));
    const y = Math.min(...list.map((n) => n.y));
    return { x, y, w: Math.max(...list.map((n) => n.x + n.w)) - x, h: Math.max(...list.map((n) => n.y + n.h)) - y };
  }

  function fitTo(box, area, maxK) {
    const pad = 32;
    const k = clamp(Math.min(area.w / (box.w + 2 * pad), area.h / (box.h + 2 * pad)), 0.12, maxK);
    return {
      k,
      x: area.x + area.w / 2 - (box.x + box.w / 2) * k,
      y: area.y + area.h / 2 - (box.y + box.h / 2) * k,
    };
  }

  function viewArea() {
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    const drawer = drawerOpen() ? Math.min(520, w * 0.92) : 0;
    return { x: 16, y: 16, w: Math.max(200, w - 32 - drawer), h: Math.max(200, h - 88) };
  }

  function fit() {
    Object.assign(cam, fitTo(all, viewArea(), 1.1));
    applyCamera();
  }

  function open() {
    if (grouped) {
      Object.assign(cam, fitTo(folderBounds(), viewArea(), 1.1));
      applyCamera();
      return;
    }
    const area = viewArea();
    const whole = fitTo(all, area, 1.1);
    const band = LAYOUT.bands.find((b) => b[0] === "changed");
    if (whole.k >= LEGIBLE || !band) {
      Object.assign(cam, whole);
    } else {
      const box = { x: band[1], y: band[2], w: band[3], h: band[4] };
      const lane = fitTo(box, area, 1.1);
      if (lane.k >= LEGIBLE) Object.assign(cam, lane);
      else Object.assign(cam, {
        k: LEGIBLE,
        x: box.w * LEGIBLE <= area.w ? area.x + area.w / 2 - (box.x + box.w / 2) * LEGIBLE : area.x - box.x * LEGIBLE,
        y: area.y - box.y * LEGIBLE,
      });
    }
    applyCamera();
  }

  let flight = 0;

  function flyTo(target) {
    const from = { ...cam };
    const start = performance.now();
    const id = ++flight;
    const step = (now) => {
      if (id !== flight) return;
      const p = ease(clamp((now - start) / 420, 0, 1));
      const k = from.k * Math.pow(target.k / from.k, p);
      const cx = lerp(centreX(from), centreX(target), p);
      const cy = lerp(centreY(from), centreY(target), p);
      Object.assign(cam, { k, x: viewport.clientWidth / 2 - cx * k, y: viewport.clientHeight / 2 - cy * k });
      applyCamera();
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  const lerp = (a, b, p) => a + (b - a) * p;
  const centreX = (c) => (viewport.clientWidth / 2 - c.x) / c.k;
  const centreY = (c) => (viewport.clientHeight / 2 - c.y) / c.k;

  function zoomAt(factor, sx, sy) {
    const k = clamp(cam.k * factor, 0.12, 2.5);
    cam.x = sx - ((sx - cam.x) * k) / cam.k;
    cam.y = sy - ((sy - cam.y) * k) / cam.k;
    cam.k = k;
    userMoved = true;
    applyCamera();
  }

  let drag = null;
  let dragged = false;

  viewport.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || $("drawer").contains(event.target) || event.target.closest(".zoom")) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY, cx: cam.x, cy: cam.y, captured: false };
    dragged = false;
  });

  viewport.addEventListener("pointermove", (event) => {
    if (!drag || drag.id !== event.pointerId) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (!drag.captured && Math.hypot(dx, dy) < 4) return;
    if (!drag.captured) {
      drag.captured = true;
      dragged = true;
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add("dragging");
      pause();
    }
    flight++;
    cam.x = drag.cx + dx;
    cam.y = drag.cy + dy;
    userMoved = true;
    applyCamera();
  });

  const endDrag = () => {
    drag = null;
    viewport.classList.remove("dragging");
  };
  viewport.addEventListener("pointerup", endDrag);
  viewport.addEventListener("pointercancel", endDrag);

  viewport.addEventListener("wheel", (event) => {
    if ($("drawer").contains(event.target)) return;
    event.preventDefault();
    flight++;
    pause();
    const rect = viewport.getBoundingClientRect();
    if (event.ctrlKey || event.metaKey) {
      zoomAt(Math.exp(-event.deltaY * 0.01), event.clientX - rect.left, event.clientY - rect.top);
    } else {
      cam.x -= event.deltaX;
      cam.y -= event.deltaY;
      userMoved = true;
      applyCamera();
    }
  }, { passive: false });

  viewport.addEventListener("click", (event) => {
    if (dragged || touring) return;
    if (event.target === viewport || event.target === world || event.target.classList.contains("band")) {
      select(null);
    }
  });

  $("zoom-in").addEventListener("click", () => zoomAt(1.25, viewport.clientWidth / 2, viewport.clientHeight / 2));
  $("zoom-out").addEventListener("click", () => zoomAt(0.8, viewport.clientWidth / 2, viewport.clientHeight / 2));
  $("zoom-fit").addEventListener("click", () => {
    userMoved = false;
    fit();
  });

  /* Hover and selection */

  let selected = null;

  function light(node) {
    world.classList.toggle("hovering", Boolean(node));
    for (const n of nodes) n.el.classList.toggle("lit", Boolean(node) && (n === node || node.near.has(n)));
    for (const e of edges) e.el.classList.toggle("lit", Boolean(node) && (e.src === node || e.dst === node));
  }

  for (const node of nodes) {
    node.el.addEventListener("pointerenter", () => {
      if (!touring && !drag) light(node);
    });
    node.el.addEventListener("pointerleave", () => {
      if (!touring) light(selected);
    });
    node.el.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.stopPropagation();
      select(node);
    });
    node.el.addEventListener("click", (event) => {
      event.stopPropagation();
      if (dragged) return;
      select(node);
    });
  }

  const drawer = $("drawer");
  const drawerOpen = () => drawer.getAttribute("aria-hidden") === "false";

  function select(node, centre) {
    if (touring) exitTour();
    if (selected) selected.el.classList.remove("selected");
    selected = node;
    light(node);
    if (!node) {
      drawer.setAttribute("aria-hidden", "true");
      return;
    }
    node.el.classList.add("selected");
    fillDrawer(node);
    drawer.setAttribute("aria-hidden", "false");
    if (centre) {
      const area = viewArea();
      const k = Math.max(cam.k, 0.8);
      flyTo({ k, x: area.x + area.w / 2 - (node.x + node.w / 2) * k, y: area.y + area.h / 2 - (node.y + node.h / 2) * k });
    }
  }

  function section(title, body) {
    return add(el("section", "d-section"), el("h3", "d-title", title), body);
  }

  function diffView(hunks) {
    if (!hunks.length) return el("div", "d-empty", "No line changes recorded for this item.");
    const box = el("div", "diff");
    const rows = el("div", "diff-rows");
    for (const hunk of hunks) {
      rows.appendChild(el("div", "hunk-head", `@@ ${MINUS}${hunk.old_start} +${hunk.new_start} @@`));
      for (const line of hunk.lines) {
        const kind = line.op === "+" ? "add" : line.op === "-" ? "del" : "ctx";
        add(rows, add(el("div", `dl ${kind}`),
          el("span", "ln", line.old === null ? "" : line.old),
          el("span", "ln", line.new === null ? "" : line.new),
          el("span", "sg", kind === "add" ? "+" : kind === "del" ? MINUS : ""),
          el("span", "code", line.text)));
      }
    }
    return add(box, rows);
  }

  const EDGE_TAG = { added: "new call", removed: "removed call", kept: "call" };

  function linkList(items, empty) {
    if (!items.length) return el("div", "d-empty", empty);
    const list = el("div", "links");
    for (const { node, tag, tagClass } of items) {
      const row = el("button", `link st-${node.status}`);
      row.setAttribute("type", "button");
      const text = el("span", "link-text");
      add(text, el("span", "link-name", node.name), el("span", "link-path", node.path));
      add(row, el("span", "bar"), text, tag ? el("span", `etag ${tagClass || ""}`, tag) : null);
      row.addEventListener("click", () => select(node, true));
      list.appendChild(row);
    }
    return list;
  }

  const edgeItem = (edge, other) => ({
    node: other,
    tag: `${EDGE_TAG[edge.status]}${edge.byName ? " \u00b7 by name" : ""}`,
    tagClass: edge.status,
  });

  function fillDrawer(node) {
    drawer.replaceChildren();
    drawer.className = `drawer st-${node.status}`;
    const head = el("div", "d-head");
    const tags = el("div", "d-tags");
    if (PILL[node.status]) tags.appendChild(el("span", "pill", PILL[node.status]));
    tags.appendChild(el("span", "d-kind", node.kind === "file" ? `${node.file.kind} file` : node.sym.kind));
    const close = el("button", "d-close", "\u00d7");
    close.setAttribute("type", "button");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", () => select(null));
    add(head, el("div", "bar"), tags, el("div", "d-name", node.kind === "file" ? node.path : node.name),
      node.kind === "file" ? null : el("div", "d-path", node.path), close);

    const facts = el("div", "d-facts");
    const body = el("div", "d-body");

    if (node.kind === "file") {
      const file = node.file;
      add(facts, el("span", "fact", `+${file.added} ${MINUS}${file.removed}`));
      if (file.sensitive) facts.appendChild(el("span", "fact bad", file.sensitive));
      const brief = briefFile.get(file.path);
      if (file.sensitive && brief && !brief.named) facts.appendChild(el("span", "fact warn", "not mentioned in the description"));
      if (file.language === null && file.kind === "code") facts.appendChild(el("span", "fact", "not parsed"));
      add(body, section("Diff", diffView(file.hunks)));
      const inside = file.symbols.map((id) => symbolNode.get(id)).filter(Boolean);
      if (inside.length) body.appendChild(section("Symbols", linkList(inside.map((n) => ({ node: n })), "")));
    } else {
      const sym = node.sym;
      if (node.status !== "context") add(facts, el("span", "fact", `+${sym.added} ${MINUS}${sym.removed}`));
      facts.appendChild(el("span", "fact", plural(sym.call_sites, "call site", "call sites")));
      if (sym.span) facts.appendChild(el("span", "fact", `lines ${sym.span[0]}\u2013${sym.span[1]}`));
      else if (sym.base_span) facts.appendChild(el("span", "fact", `was lines ${sym.base_span[0]}\u2013${sym.base_span[1]}`));
      if (node.untested) facts.appendChild(el("span", "fact warn", `${NO_TEST}: no test in this map calls it`));
      const callers = node.in.filter((e) => !isTest(e.src));
      const tests = node.in.filter((e) => isTest(e.src));
      add(body,
        section("Diff", node.status === "context" ? el("div", "d-empty", "Unchanged. Shown because it calls or is called by changed code.") : diffView(sym.hunks)),
        section("Callers", linkList(callers.map((e) => edgeItem(e, e.src)), "No caller in the map.")),
        section("Callees", linkList(node.out.map((e) => edgeItem(e, e.dst)), "Calls nothing in the map.")),
        isTest(node) ? null : section("Tests", linkList(tests.map((e) => edgeItem(e, e.src)), "No test calls this directly.")));
    }

    head.appendChild(facts);
    add(drawer, head, body);
  }

  /* Tour */

  const names = (list) => {
    const shown = list.slice(0, 2).map((n) => n.name);
    return list.length > 2 ? `${shown.join(", ")} +${list.length - 2} more` : shown.join(" and ");
  };

  function focusNodes(ids) {
    const found = [];
    for (const id of ids) {
      const node = symbolNode.get(id) || fileNode.get(id);
      if (node) found.push(node);
      else if (fileByPath.has(id)) {
        for (const sid of fileByPath.get(id).symbols) if (symbolNode.has(sid)) found.push(symbolNode.get(sid));
      }
    }
    return found;
  }

  function symbolFacts(node) {
    const sym = node.sym;
    const parts = [node.path, `+${sym.added} ${MINUS}${sym.removed}`];
    if (node.status !== "deleted" && !isTest(node)) parts.push(plural(sym.call_sites, "call site", "call sites"));
    if (node.untested) parts.push(NO_TEST);
    return parts.join(DOT);
  }

  function describe(step, index, total) {
    const count = `${index + 1} / ${total}`;
    const focus = focusNodes(step.focus);
    const node = focus[0];
    const via = step.via ? symbolNode.get(step.via) : null;

    if (step.kind === "overview") {
      return {
        kicker: "Overview", count, main: MAP.title,
        sub: [plural(MAP.files.length, "file", "files"), plural(changed.length, "symbol changed", "symbols changed"),
          plural(added, "call added", "calls added"), `${removed} removed`].join(DOT),
      };
    }

    if (step.kind === "risky_file") {
      const path = step.focus[0] || "";
      const file = fileByPath.get(path);
      const brief = briefFile.get(path);
      const reason = (file && file.sensitive) || (brief && brief.sensitive) || "Sensitive file";
      const unnamed = brief && !brief.named ? `${DOT}not mentioned in the description` : "";
      return { kicker: "Risky surface", count, main: `${reason} changed${unnamed}`, sub: path };
    }

    if (step.kind === "summary") return { kicker: "Summary", count, main: "", sub: "" };

    if (step.kind === "folder") {
      const folder = folderByIndex.get(step.folder);
      const info = folder ? folder.info : { added: 0, modified: 0, deleted: 0, tests: 0 };
      return {
        kicker: "Group", count, main: folder ? folder.info.label : "",
        sub: [plural(focus.length, "symbol", "symbols"),
          `${info.added} added`, `${info.modified} modified`,
          `${info.deleted} deleted`, `${info.tests} tests`].join(DOT),
      };
    }

    if (!node || node.kind !== "symbol") return { kicker: step.kind, count, main: step.focus.join(", "), sub: "" };

    const word = node.sym.kind;
    const name = node.name;

    if (step.kind === "test") {
      const targets = node.out.filter(live).map((e) => e.dst);
      const covers = targets.length ? `${DOT}covers ${names(targets)}` : "";
      const main = node.status === "added" ? `New test ${name}${covers}`
        : node.status === "deleted" ? `Deleted test ${name}` : `Test ${name} changed${covers}`;
      return { kicker: "Test", count, main, sub: symbolFacts(node) };
    }

    if (step.kind === "callee" && via) {
      const link = node.in.find((e) => e.src === via);
      let main;
      if (node.status === "deleted") main = `Deleted ${name}${DOT}${via.name} no longer calls it`;
      else if (node.status === "added") main = `New ${word} ${name}${DOT}called by ${via.name}`;
      else if (link && link.status === "added") main = `${via.name} now calls ${name}`;
      else if (link && link.status === "removed") main = `${via.name} no longer calls ${name}`;
      else main = `${name} changed${DOT}called by ${via.name}`;
      return { kicker: `Called from ${via.name}`, count, main, sub: symbolFacts(node) };
    }

    const callers = node.in.filter((e) => live(e) && !isTest(e.src)).map((e) => e.src);
    let main;
    if (node.status === "deleted") {
      const former = node.in.filter((e) => !isTest(e.src)).map((e) => e.src);
      main = `Deleted ${name}${former.length ? `${DOT}${names(former)} no longer ${former.length === 1 ? "calls" : "call"} it` : ""}`;
    } else if (node.status === "added") {
      main = `New ${word} ${name}${callers.length ? `${DOT}called by ${names(callers)}` : `${DOT}nothing calls it yet`}`;
    } else {
      main = `${name} changed${callers.length ? `${DOT}called by ${names(callers)}` : ""}`;
    }
    return { kicker: step.kind === "entry" ? "Entry point" : "Changed", count, main, sub: symbolFacts(node) };
  }

  const timeline = (() => {
    const plan = grouped && MAP.tour.length >= 2 ? [
      MAP.tour[0],
      ...folderNodes.map((folder) => ({
        kind: "folder",
        folder: folder.index,
        focus: folder.members.map((member) => member.sym.id),
        via: null,
      })),
      ...MAP.tour.slice(1),
    ] : MAP.tour;
    const base = plan.map((s) => STEP_SECONDS[s.kind] || 3);
    const fixed = plan.reduce((sum, s, i) => sum + (s.kind === "overview" || s.kind === "summary" ? base[i] : 0), 0);
    const middle = base.reduce((sum, v) => sum + v, 0) - fixed;
    const scale = middle > 0 && fixed + middle > MAX_TOUR ? Math.max((MAX_TOUR - fixed) / middle, 0) : 1;
    let start = 0;
    return plan.map((step, i) => {
      const plain = step.kind === "overview" || step.kind === "summary";
      const duration = Math.round((plain ? base[i] : Math.max(base[i] * scale, MIN_STEP)) * 1000) / 1000;
      const focus = focusNodes(step.focus);
      const via = step.via ? symbolNode.get(step.via) : null;
      const lit = new Set(focus);
      if (via) lit.add(via);
      if (step.kind !== "risky_file" && step.kind !== "folder") for (const n of focus) for (const m of n.near) lit.add(m);
      const item = {
        kind: step.kind, focus: step.focus, via: step.via, folder: step.folder ?? null,
        start: Math.round(start * 1000) / 1000, duration,
        caption: describe(step, i, plan.length), nodes: focus, viaNode: via, lit, plain: plain || !focus.length,
      };
      start += duration;
      return item;
    });
  })();

  const duration = Math.round(timeline.reduce((sum, s) => sum + s.duration, 0) * 1000) / 1000;

  function tourCamera(step) {
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    const area = { x: 48, y: 32, w: Math.max(200, w - 96), h: Math.max(160, h - 32 - 176) };
    if (step.folder !== undefined && step.folder !== null) {
      const folder = folderByIndex.get(step.folder);
      const box = folder
        ? { x: folder.x - 16, y: folder.y - 16, w: folder.w + 32, h: folder.h + 32 }
        : all;
      return fitTo(box, area, 1.25);
    }
    if (step.plain) return fitTo(all, step.kind === "summary" ? { x: 16, y: 16, w: w - 32, h: h - 32 } : area, 1.1);
    const core = step.viaNode ? [...step.nodes, step.viaNode] : step.nodes;
    const wide = fitTo(bounds([...step.lit]), area, 1.25);
    return wide.k >= 0.62 ? wide : fitTo(bounds(core), area, 1.25);
  }

  let cameras = null;

  function camerasFor() {
    const size = `${viewport.clientWidth}x${viewport.clientHeight}`;
    if (!cameras || cameras.size !== size) cameras = { size, list: timeline.map(tourCamera) };
    return cameras.list;
  }

  const plainLevel = (step) => (step.kind === "summary" ? BEHIND_SUMMARY : 1);
  const nodeLevel = (step, node) => (step.plain ? plainLevel(step) : step.lit.has(node) ? 1 : DIM_NODE);
  const hidden = LAYOUT.dense ? 0 : DIM_EDGE;
  const edgeLevel = (step, edge) => {
    if (step.plain) return LAYOUT.dense ? 0 : plainLevel(step);
    return step.nodes.includes(edge.src) || step.nodes.includes(edge.dst) ? 1 : hidden;
  };

  const caption = $("caption");
  const summary = $("summary");
  let captionFor = -1;

  function fillCaption(index) {
    if (captionFor === index) return;
    captionFor = index;
    const text = timeline[index].caption;
    const kicker = add(el("div", "cap-kicker"), el("span", "", text.kicker), el("span", "cap-count", text.count));
    caption.replaceChildren(kicker, el("div", "cap-main", text.main), el("div", "cap-sub", text.sub));
  }

  function fillSummary() {
    summary.replaceChildren();
    const cell = (num, label, cls) => add(el("div", `sum-cell ${cls || ""}`), el("div", "sum-num", num), el("div", "sum-label", label));
    const grid = add(el("div", "sum-grid"),
      cell(changed.length, changed.length === 1 ? "symbol changed" : "symbols changed"),
      cell(added ? `+${added}` : "0", added === 1 ? "call added" : "calls added", added ? "good" : ""),
      cell(removed ? `${MINUS}${removed}` : "0", removed === 1 ? "call removed" : "calls removed", removed ? "bad" : ""),
      cell(callSites, "call sites affected"),
      cell(untested.length, `changed ${untested.length === 1 ? "symbol" : "symbols"} with ${NO_TEST}`, untested.length ? "warn" : "good"),
      cell(ci.word, ci.failed ? `CI failed: ${ci.failed.map((c) => c.name).join(", ")}` : "CI on the head commit", ci.cls));
    const toured = new Set(MAP.tour.flatMap((step) => step.focus));
    const skipped = changedCode.filter((n) => !toured.has(n.sym.id)).length;
    const note = skipped ? el("div", "sum-note", `${plural(skipped, "more changed symbol", "more changed symbols")} on the map, not in this tour`) : null;
    add(summary, el("div", "sum-kicker", "What this PR rewired"), el("div", "sum-title", MAP.title), grid, note,
      el("div", "sum-brand", "PR map \u00b7 computed from the code, no AI drew this"));
  }

  fillSummary();

  let touring = false;

  function enterTour() {
    if (touring) return;
    select(null);
    light(null);
    touring = true;
    document.body.classList.add("touring");
  }

  function exitTour() {
    pause();
    if (!touring) return;
    touring = false;
    document.body.classList.remove("touring");
    for (const n of nodes) {
      n.el.style.opacity = "";
      n.el.classList.remove("focus");
    }
    for (const e of edges) {
      e.el.style.opacity = "";
      e.el.style.strokeDashoffset = "";
    }
    captionFor = -1;
  }

  function stepAt(t) {
    let index = 0;
    while (index + 1 < timeline.length && timeline[index + 1].start <= t) index++;
    return index;
  }

  function seek(time) {
    if (!timeline.length) return;
    const t = clamp(Number(time) || 0, 0, duration);
    enterTour();
    const index = stepAt(t);
    const step = timeline[index];
    const prev = timeline[Math.max(index - 1, 0)];
    const u = t - step.start;
    const p = index === 0 ? 1 : ease(clamp(u / MOVE, 0, 1));
    const cams = camerasFor();
    const from = cams[Math.max(index - 1, 0)];
    const to = cams[index];
    const k = from.k * Math.pow(to.k / from.k, p);
    const vw = viewport.clientWidth / 2;
    const vh = viewport.clientHeight / 2;
    const cx = lerp((vw - from.x) / from.k, (vw - to.x) / to.k, p);
    const cy = lerp((vh - from.y) / from.k, (vh - to.y) / to.k, p);
    Object.assign(cam, { k, x: vw - cx * k, y: vh - cy * k });
    applyCamera();

    for (const n of nodes) {
      n.el.style.opacity = String(round(lerp(nodeLevel(prev, n), nodeLevel(step, n), p) * 100) / 100);
      n.el.classList.toggle("focus", !step.plain && step.nodes.includes(n));
    }
    const offset = String(-round((t * 28) % 28));
    for (const e of edges) {
      e.el.style.opacity = String(round(lerp(edgeLevel(prev, e), edgeLevel(step, e), p) * 100) / 100);
      if (e.status === "added") e.el.style.strokeDashoffset = offset;
    }

    const last = index === timeline.length - 1;
    const fadeIn = clamp((u - 0.25) / 0.45, 0, 1);
    const fadeOut = last ? 1 : clamp((step.duration - u) / 0.35, 0, 1);
    fillCaption(index);
    caption.style.opacity = step.kind === "summary" ? "0" : String(round(Math.min(fadeIn, fadeOut) * 100) / 100);
    summary.style.opacity = step.kind === "summary" ? String(round(clamp((u - 0.3) / 0.6, 0, 1) * 100) / 100) : "0";
    $("progress-bar").style.width = `${round((t / duration) * 1000) / 10}%`;
  }

  /* Playback */

  const player = { t: 0, playing: false, until: null, last: 0 };

  function setPlaying(on) {
    player.playing = on;
    document.body.classList.toggle("playing", on);
    $("play-label").textContent = on ? "Pause" : player.t >= duration && touring ? "Replay" : "Play tour";
  }

  function frame(now) {
    if (!player.playing) return;
    player.t = Math.min(duration, player.t + (now - player.last) / 1000);
    player.last = now;
    if (player.until !== null && player.t >= player.until) player.t = player.until;
    seek(player.t);
    if (player.t >= duration || (player.until !== null && player.t >= player.until)) setPlaying(false);
    else requestAnimationFrame(frame);
  }

  function run(from, until) {
    flight++;
    player.t = from;
    player.until = until;
    player.last = performance.now();
    seek(from);
    setPlaying(true);
    requestAnimationFrame(frame);
  }

  function pause() {
    if (player.playing) setPlaying(false);
  }

  function goto(index) {
    const i = clamp(index, 0, timeline.length - 1);
    const step = timeline[i];
    run(step.start, step.start + Math.min(step.duration - 0.4, MOVE + 0.6));
  }

  function next() {
    if (!touring) return goto(0);
    goto(stepAt(player.t) + 1);
  }

  function prev() {
    if (!touring) return goto(0);
    goto(stepAt(player.t) - 1);
  }

  $("play").addEventListener("click", () => {
    if (player.playing) return pause();
    const from = touring && player.t < duration ? player.t : 0;
    run(from, null);
  });

  document.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const key = event.key;
    if (key === "Escape") {
      if (drawerOpen()) select(null);
      else if (grouped && expanded.size) collapseAll();
      else if (touring) exitTour();
    } else if (key === "ArrowRight" || key === " " || key === "PageDown") {
      next();
    } else if (key === "ArrowLeft" || key === "PageUp") {
      prev();
    } else if (key === "f" || key === "F") {
      if (touring) exitTour();
      userMoved = false;
      fit();
    } else if (key === "+" || key === "=") {
      zoomAt(1.25, viewport.clientWidth / 2, viewport.clientHeight / 2);
    } else if (key === "-" || key === "_") {
      zoomAt(0.8, viewport.clientWidth / 2, viewport.clientHeight / 2);
    } else {
      return;
    }
    event.preventDefault();
  });

  window.addEventListener("resize", () => {
    if (touring) seek(player.t);
    else if (!userMoved) open();
  });

  open();

  window.prcTour = Object.freeze({
    duration,
    steps: timeline.map((s) => Object.freeze({
      kind: s.kind, focus: [...s.focus], via: s.via, start: s.start, duration: s.duration,
      caption: Object.freeze({ ...s.caption }),
    })),
    seek: (t) => {
      pause();
      player.t = clamp(Number(t) || 0, 0, duration);
      seek(player.t);
    },
  });
})();
</script></body></html>
