    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 6px 20px rgba(15, 23, 42, 0.07);
    --shadow-lg: 0 24px 64px rgba(15, 23, 42, 0.18);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
}

.st-added { --st: var(--green); }
.st-modified { --st: var(--amber); }
.st-deleted { --st: var(--red); }
.st-context { --st: var(--grey); }

/* Header */

.top {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-solid);
  position: relative;
  z-index: 5;
}

.headline { min-width: 0; flex: 1 1 0; }

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}

.logo {
  display: inline-grid;
  grid-template-columns: repeat(3, 4px);
  gap: 2px;
  align-items: center;
}

.logo i {
  display: block;
  width: 4px;
  height: 12px;
  border-radius: 2px;
  background: var(--green);
}

.logo i:nth-child(2) { height: 8px; background: var(--amber); }
.logo i:nth-child(3) { height: 5px; background: var(--red); }

.brand-name {
  color: var(--text);
  font-weight: 600;
  letter-spacing: 0.01em;
}

.meta { overflow: hidden; text-overflow: ellipsis; }
.meta .sep { color: var(--faint); margin: 0 6px; }
.meta .mono { font-family: var(--mono); font-size: 11.5px; }

.meta a {
  color: var(--accent);
  text-decoration: none;
}

.meta a:hover { text-decoration: underline; }

h1 {
  margin: 4px 0 0;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.012em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stats {
  display: flex;
  gap: 8px;
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
}

.stat {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 72px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--raise);
  white-space: nowrap;
}

.stat-value {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 17px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
}

.stat.good .stat-value { color: var(--green); }
.stat.bad .stat-value { color: var(--red); }
.stat.warn .stat-value { color: var(--amber); }
.stat.none .stat-value { color: var(--muted); }

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
}

.play {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 16px 0 14px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--text);
  color: var(--bg);
  font-weight: 600;
  white-space: nowrap;
  box-shadow: var(--shadow);
}

.play:hover { opacity: 0.9; }

.play-icon {
  width: 0;
  height: 0;
  border-left: 9px solid currentColor;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.playing .play-icon {
  width: 10px;
  height: 12px;
  border: 0;
  border-left: 3px solid currentColor;
  border-right: 3px solid currentColor;
}

/* Canvas */

.viewport {
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.2px);
  background-size: 24px 24px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.viewport.dragging { cursor: grabbing; }

.world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
}

.band {
  position: absolute;
  border: 1px dashed var(--border);
  border-radius: 16px;
  background: var(--band);
}

.band-label {
  position: absolute;
  left: 16px;
  top: 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  white-space: nowrap;
}

.edges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.e {
  fill: none;
  stroke: var(--edge);
  stroke-width: 1.5;
  transition: opacity 160ms ease;
}

.e-added {
  stroke: var(--green);
  stroke-width: 2;
  stroke-dasharray: 8 6;
  animation: flow 1s linear infinite;
}

.e-removed {
  stroke: var(--red);
  stroke-width: 1.75;
  stroke-dasharray: 5 5;
  opacity: 0.85;
}

.e-name {
  stroke-dasharray: 1 6;
  stroke-linecap: round;
  stroke-width: 2.25;
}

.e-added.e-name { stroke-width: 2.5; }

.arrow-added { fill: var(--green); }
.arrow-removed { fill: var(--red); }
.arrow-kept { fill: var(--edge); }

@keyframes flow {
  to { stroke-dashoffset: -28; }
}

/* Nodes */

.node {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 8px 12px 8px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
  transition: opacity 160ms ease, border-color 120ms ease, box-shadow 160ms ease;
}

.node:hover { border-color: var(--border-strong); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.node .bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--st);
}

.node.st-context {
  background: var(--card-ctx);
  border-style: dashed;
  box-shadow: none;
}

.node.st-context .bar { opacity: 0.6; }

.n-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.glyph {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1px solid var(--border-strong);
  color: var(--muted);
  font: 600 10.5px/1 var(--mono);
}

.name {
  min-width: 0;
  flex: 1 1 auto;
  font: 600 13px/1.3 var(--mono);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.st-context .name { color: var(--muted); font-weight: 500; }

.st-deleted .name {
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 1.5px;
  color: var(--muted);
}

.pill {
  flex: none;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--st);
  background: color-mix(in srgb, var(--st) 14%, transparent);
}

.path {
  font: 11px/1.35 var(--mono);
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}

.path > span { direction: ltr; unicode-bidi: isolate; }

.n-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
}

.n-row > .path { flex: 1 1 auto; min-width: 0; }

.n-row > .sites {
  flex: none;
  font-size: 11px;
  color: var(--faint);
}

.delta { font: 600 11.5px/1 var(--mono); }
.plus { color: var(--green); }
.minus { color: var(--red); }

.badge {
  margin-left: auto;
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
  background: color-mix(in srgb, var(--amber) 10%, transparent);
}

.chip {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 12px 0 16px;
  border-radius: 999px;
}

.chip .bar { width: 3px; }

.chip .name { flex: 0 1 auto; font-weight: 500; font-size: 12.5px; }
.chip.st-deleted .name { color: var(--muted); }

/* Grouped overview */

.fedges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.ge {
  fill: none;
  stroke: var(--edge);
  stroke-width: 2;
}

.ge-added { stroke: var(--green); }
.ge-removed { stroke: var(--red); }

.fcard {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 10px 14px 10px 16px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  overflow: hidden;
}

.fcard:hover { border-color: var(--border-strong); }
.fcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.f-name {
  font: 600 13px/1.3 var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.f-counts {
  font: 11px/1.4 var(--mono);
  color: var(--muted);
}

.flist {
  display: none;
  margin-top: 6px;
  border-top: 1px solid var(--border);
  padding-top: 6px;
  gap: 2px;
  overflow: auto;
}

.fcard.open {
  justify-content: flex-start;
  height: auto !important;
  max-height: 360px;
  z-index: 5;
}

.fcard.open .flist { display: grid; }

.fmem {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 4px 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  text-align: left;
}

.fmem:hover { background: var(--band); }

.fmem-name {
  flex: 1 1 auto;
  min-width: 0;
  font: 12px/1.35 var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fmem-tag {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.world.grouped .node.concealed { opacity: 0; }

.dense .sym {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 8px 0 12px;
  border-radius: 8px;
  box-shadow: none;
}

.dense .sym .bar { width: 3px; }
.dense .sym .name { font-size: 12px; }
.dense .sym .glyph { width: 16px; height: 16px; font-size: 9.5px; }
.dense .sym .pill { padding: 0 5px; font-size: 9px; }

.flag {
  flex: none;
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  font: 700 10px/1 var(--sans);
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
}

.group {
  position: absolute;
  padding: 6px 4px 0;
  font: 11px/1.3 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
  pointer-events: none;
}

.group > span { direction: ltr; unicode-bidi: isolate; }

body:not(.touring) .dense .e:not(.lit) { opacity: 0; }

.empty {
  position: absolute;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%);
  padding: 12px 20px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
  pointer-events: none;
}

.risk {
  flex: none;
  margin-left: auto;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--red);
  background: color-mix(in srgb, var(--red) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
  white-space: nowrap;
}

.world.far .path,
.world.far .sites { display: none; }
.world.far .name { font-size: 16px; }
.world.far .pill { font-size: 12px; }

.hovering .node:not(.lit),
.hovering .e:not(.lit) { opacity: 0.14; }

.hovering .e.lit { stroke-width: 2.5; }

.node.lit { border-color: var(--border-strong); }

.node.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent), var(--shadow);
}

.node.focus {
  border-color: var(--st);
  box-shadow: 0 0 0 1px var(--st), 0 0 40px color-mix(in srgb, var(--st) 40%, transparent), var(--shadow);
}

/* Tour */

.touring .node,
.touring .e { transition: none; }

.touring .e-added { animation: none; }

.spot {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 35%, color-mix(in srgb, var(--bg) 82%, transparent) 100%);
}

.touring .spot { opacity: 1; }

.progress {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 2px;
  display: none;
}

.touring .progress { display: block; }

#progress-bar {
  height: 100%;
  width: 0;
  background: var(--accent);
}

.caption {
  position: absolute;
  left: 50%;
  bottom: 40px;
  width: min(760px, calc(100% - 48px));
  transform: translateX(-50%);
  padding: 16px 24px 18px;
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .caption { display: block; }

.cap-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.cap-count { color: var(--faint); font-variant-numeric: tabular-nums; }

.cap-main {
  margin-top: 6px;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.015em;
}

.cap-main .code { font-family: var(--mono); font-size: 20px; }

.cap-sub {
  margin-top: 6px;
  font: 12.5px/1.4 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.summary {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(720px, calc(100% - 48px));
  transform: translate(-50%, -50%);
  padding: 32px 40px;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  background: var(--panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .summary { display: block; }

.sum-kicker {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.sum-title {
  margin-top: 8px;
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -0.015em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sum-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 24px;
}

.sum-cell {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--raise);
}

.sum-num {
  font-size: 40px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.sum-label { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.sum-cell.good .sum-num { color: var(--green); }
.sum-cell.bad .sum-num { color: var(--red); }
.sum-cell.warn .sum-num { color: var(--amber); }

.sum-note {
  margin-top: 16px;
  color: var(--muted);
  font-size: 14px;
}

.sum-brand {
  margin-top: 24px;
  font-size: 12px;
  color: var(--faint);
}

/* Floating controls */

.legend {
  position: absolute;
  left: 16px;
  bottom: 16px;
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 11.5px;
  color: var(--muted);
  box-shadow: var(--shadow);
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.sw {
  width: 10px;
  height: 10px;
  margin-left: 6px;
  border-radius: 3px;
  background: var(--st);
}

.sw:first-child, .ls:first-child { margin-left: 0; }
.ls { width: 32px; height: 8px; margin-left: 8px; overflow: visible; }

.zoom {
  position: absolute;
  right: 16px;
  bottom: 16px;
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.zoom button {
  min-width: 36px;
  height: 32px;
  padding: 0 10px;
  border: 0;
  border-right: 1px solid var(--border);
  background: transparent;
  font-size: 13px;
  color: var(--muted);
}

.zoom button:last-child { border-right: 0; }
.zoom button:hover { color: var(--text); background: var(--band); }

.touring .legend,
.touring .zoom { opacity: 0; pointer-events: none; }

/* Drawer */

.drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 92vw);
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--panel-solid);

":12,"old":null,"op":"+","text":"The classifier returns tuples of verified DMs, uncertain observations, tainted threads, source pointers, and coverage state. The planner consumes that entire result. A verified DM needs a successful CREATE activity with consistent resource, owner, author, thread, content, timestamp, and one unique exact INBOX match. Typed invitation content overrides generic message fields. Read status defaults to unknown. First-DM policy uses an explicit exact-profile acceptance and US PVF qualification envelope plus saved exact-profile research; a 28-day consent changelog cannot prove lifetime absence. No schema, infrastructure, provider call, recommendation persistence, or send operation belongs to this slice."},{"new":13,"old":null,"op":"+","text":""},{"new":14,"old":null,"op":"+","text":"Throughput checkpoint: one owner edits the isolated branch in order; parent owns PR publication and visual. The test runner records only synthetic verdicts. The shared classifier is the future sync boundary; the report has no ability to apply events."},{"new":15,"old":null,"op":"+","text":""},{"new":16,"old":null,"op":"+","text":"Verification: 55 synthetic E2E verdicts and 23 repository tests pass. Scoped Ruff, full-source mypy across 10 modules, strict mypy on the new classifier, `git diff --check`, and both package builds pass in the declared isolated runtime. Red-first regressions cover malformed citation URLs, provider payloads, calendar-day connection proof, alias conflicts, and the client's valid empty-changelog watermark. The real retained changelog lacks acquisition metadata and the older source cache lacks current date-added projection; this slice makes no live action or draft eligibility claim from those files. The parent owns base update, infographic, and PR publication."},{"new":17,"old":2,"op":" ","text":""},{"new":18,"old":3,"op":" ","text":"## Invitation shortlist"},{"new":19,"old":4,"op":" ","text":""}],"new_start":1,"old_start":1},{"lines":[{"new":230,"old":215,"op":" ","text":"PR10 Unicode repair verification before publication: 84 scenarios plus wrapper, 22 full-suite checks, strict scoped Ruff, 12-file mypy and builds passed before the usage pause. Pending diff inspected on resume; no source behavior changed since that validation. Separate synthetic CLI proof and independent review requested. Fixed fresh CodeRabbit wording finding by spacing adjacent counts in the matrix record."},{"new":231,"old":216,"op":" ","text":""},{"new":232,"old":217,"op":" ","text":"PR12 review correction: two UTC conversion overflow boundaries and the Markdown prospect-ID provenance assertion failed before the fix (3 failed, 90 passed). The correction catches overflow as invalid_timestamp and prints the prospect ID beside the source pointer. All 93 E2E scenarios, the full 22-test suite, scoped Ruff, 9-file default source mypy and source/wheel builds pass. Independent read-only review found no actionable issue."},{"new":233,"old":null,"op":"+","text":""},{"new":234,"old":null,"op":"+","text":"DM parent integration: rebased the unpublished branch onto PR12 correction56324af without shared-history rewriting. Added the inspected system infographic. The 55-scenario CLI artifact is synthetic; cached real changelog has no acquisition metadata, so no live action eligibility or final report publication is claimed."},{"new":235,"old":null,"op":"+","text":""},{"new":236,"old":null,"op":"+","text":"PR13 CodeRabbit corrections: reproduced unrelated group-thread reminder suppression and false opt-out reason before production edits. Attribute group uncertainty only to complete identifiable thread participants; malformed participant evidence remains global. Unknown policy opt-out state remains withheld under an explicit unverified-policy reason. Expanded61synthetic E2E,23fulltests,scopedRuff,10sourcefilemypy,sdist/wheel passed."},{"new":237,"old":null,"op":"+","text":""},{"new":238,"old":null,"op":"+","text":"PR13 attachment-only regression: typed MEDIA with exactly matching nonempty attachments and empty/omitted inbox CONTENT failed before production change. Preserve those positively correlated DMs; blank TEXT still unverified.64syntheticE2E,23fulltests,lint/types/builds pass."},{"new":239,"old":null,"op":"+","text":""},{"new":240,"old":null,"op":"+","text":"## DM connection coverage correction"},{"new":241,"old":null,"op":"+","text":""},{"new":242,"old":null,"op":"+","text":"Summary: keep CONNECTIONS completeness and freshness gates limited to first-DM eligibility. Replies and follow-ups depend on verified message evidence, prospect coverage and opt-out state."},{"new":243,"old":null,"op":"+","text":""},{"new":244,"old":null,"op":"+","text":"1. Reproduce stale/incomplete CONNECTIONS suppression in the real report planner."},{"new":245,"old":null,"op":"+","text":"2. Separate connection coverage from shared message/prospect gates."},{"new":246,"old":null,"op":"+","text":"3. Run E2E, lint, typecheck, full tests and builds before publishing the correction to PR13."},{"new":247,"old":null,"op":"+","text":""},{"new":248,"old":null,"op":"+","text":"The stale and incomplete coverage regressions failed before the planner change. The corrected planner passes 72 synthetic DM scenarios plus 6 dedicated anonymous-timing scenarios and 23 full tests. Scoped Ruff and strict changed-file mypy pass; source/wheel builds pass. Full-source mypy still reports the unchanged inherited invitation_shortlist.py:276 Optional-key error; this correction does not alter that unrelated module. Historical identity bridging is excluded because it lacks a production source contract and rejects conflicting historical shapes incorrectly. No report eligibility or live publication is claimed."},{"new":249,"old":null,"op":"+","text":""},{"new":250,"old":null,"op":"+","text":"CodeRabbit also identified pytest rewriting the tracked uncertainty artifact. The narrow pytest run reproduced an mtime change before the wrapper correction; a temporary output path now preserves the tracked artifact. The direct E2E entry point still writes the repeatable committed artifact. Scoped lint and strict wrapper types pass. Proof is retained privately alongside this worktree."},{"new":251,"old":null,"op":"+","text":""},{"new":252,"old":null,"op":"+","text":"## Real provider connection-date correction"},{"new":253,"old":null,"op":"+","text":""},{"new":254,"old":null,"op":"+","text":"Summary: the collected CONNECTIONS rows use English calendar dates such as 16 Sep 2026. The ISO-only first-DM parser rejects those valid provider dates. All15retained researched profiles have a unique connection row within30calendar days when the observed format is parsed. Add the observed English format without inventing timezone or acceptance instants, reject malformed dates, and validate before publication."},{"new":255,"old":null,"op":"+","text":""},{"new":256,"old":null,"op":"+","text":"## Calendar-day first-DM eligibility correction"},{"new":257,"old":null,"op":"+","text":""},{"new":258,"old":null,"op":"+","text":"Summary: a uniquely matched provider CONNECTIONS calendar date establishes recent connection status without an invented acceptance instant. First reproduce the timestamp-only policy failure through the report entry point. Then keep any supplied acceptance timestamp as an optional consistency check, preserve all identity, message-history, qualification and opt-out gates, document the input contract, and validate the E2E artifact plus required checks."},{"new":259,"old":null,"op":"+","text":""},{"new":260,"old":null,"op":"+","text":"Red proof: provider_day_without_invented_acceptance_time fails before production changes."},{"new":261,"old":null,"op":"+","text":""},{"new":262,"old":null,"op":"+","text":"Validation:88synthetic DM scenarios including the real CLI without an acceptance instant,23full tests,scoped Ruff,strict three-file mypy,and source/wheel builds pass. Invalid supplied timestamps and mismatches remain withheld; missing timestamps use only the verified provider calendar day. Independent review agent hit its account limit before returning; no independent review is claimed. Root scoped review found no new comments/suppressions or unrelated code changes. Restore inherited inbox artifact after pytest before publication."}],"new_start":230,"old_start":215}],"kind":"docs","language":null,"path":"PLANS.md","removed":0,"sensitive":null,"status":"modified","symbols":[]},{"added":12,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"{"},{"new":2,"old":null,"op":"+","text":"  \"run_status\": \"passed\","},{"new":3,"old":null,"op":"+","text":"  \"scenario_count\": 6,"},{"new":4,"old":null,"op":"+","text":"  \"verdicts\": {"},{"new":5,"old":null,"op":"+","text":"    \"anonymous_observation_still_blocks_first_dm\": \"passed\","},{"new":6,"old":null,"op":"+","text":"    \"anonymous_observation_without_time_blocks_due_followup\": \"passed\","},{"new":7,"old":null,"op":"+","text":"    \"newer_anonymous_observation_blocks_due_followup\": \"passed\","},{"new":8,"old":null,"op":"+","text":"    \"newer_anonymous_observation_blocks_verified_reply\": \"passed\","},{"new":9,"old":null,"op":"+","text":"    \"older_anonymous_observation_allows_due_followup\": \"passed\","},{"new":10,"old":null,"op":"+","text":"    \"older_anonymous_observation_allows_verified_reply\": \"passed\""},{"new":11,"old":null,"op":"+","text":"  }"},{"new":12,"old":null,"op":"+","text":"}"}],"new_start":1,"old_start":0}],"kind":"config","language":null,"path":"artifacts/dm-uncertainty-scope-e2e-evidence.json","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":94,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"{"},{"new":2,"old":null,"op":"+","text":"  \"run_status\": \"passed\","},{"new":3,"old":null,"op":"+","text":"  \"scenario_count\": 88,"},{"new":4,"old":null,"op":"+","text":"  \"verdicts\": {"},{"new":5,"old":null,"op":"+","text":"    \"ambiguous_correlation\": \"passed\","},{"new":6,"old":nul },{"lines":[{"new":24,"old":24,"op":" ","text":""},{"new":25,"old":25,"op":" ","text":"The report reads source exports and writes private JSON and Markdown report files. It does not write to Supabase, store recommendations or drafts, or send messages. LinkedIn MDP sync owns persistence of observed real invitations, sent messages, acceptances, and replies. The owner sends every invitation and DM."},{"new":26,"old":26,"op":" ","text":""},{"new":null,"old":27,"op":"-","text":"Later reviewed slices may classify MDP inbox records into sent and received DMs, derive status from complete observations, include researched first-DM drafts, and show reply or follow-up reminders. A suggested action does not prove that the action happened. Missing or delayed MDP snapshots mean unknown, not not-sent. No reply or follow-up text is generated."},{"new":27,"old":null,"op":"+","text":"The private DM report classifies positive sent and received DM evidence, includes researched first-DM drafts, and shows reply or follow-up reminders. A suggested action does not prove that the action happened. Missing or delayed MDP snapshots mean unknown, not not-sent. No reply or follow-up text is generated. See `docs/private-dm-actions.md` for the offline input contract and coverage limits."},{"new":28,"old":28,"op":" ","text":""},{"new":29,"old":29,"op":" ","text":"## Current slice and remaining work"},{"new":30,"old":30,"op":" ","text":""},{"new":31,"old":31,"op":" ","text":"PR10 builds a private invitation shortlist with all-history capacity accounting under the latest-known-present employer assumption. It retains exact person identity, current-employer citations, source evidence IDs and pointers, observed invitation date metadata, ranking facts, and explicit unknowns. It does not write report output to Supabase."},{"new":32,"old":32,"op":" ","text":""},{"new":null,"old":33,"op":"-","text":"The next reviewed slices cover independent MDP action ingestion and status projection, researched first-DM drafts in the private report, incoming reply and due follow-up reminders, and prospect `date_added` visibility from the existing database insertion timestamp. Do not add schema or infrastructure changes without a separately reviewed diff."},{"new":33,"old":null,"op":"+","text":"The date-added and private DM report slices read existing sources. Independent MDP action ingestion and status projection remain separate work. Do not add schema or infrastructure changes without a separately reviewed diff."}],"new_start":24,"old_start":24}],"kind":"docs","language":null,"path":"docs/action-report-contract.md","removed":3,"sensitive":null,"status":"modified","symbols":[]},{"added":21,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"# Private DM action report"},{"new":2,"old":null,"op":"+","text":""},{"new":3,"old":null,"op":"+","text":"`scripts/build_private_dm_actions.py` reads local JSON exports and creates a private JSON report and Markdown report. It makes no LinkedIn or database request, writes no Supabase record, and sends no message. The owner writes replies and follow-ups and reviews any first-DM draft before sending."},{"new":4,"old":null,"op":"+","text":""},{"new":5,"old":null,"op":"+","text":"The CLI requires three mode-`0600` JSON files:"},{"new":6,"old":null,"op":"+","text":""},{"new":7,"old":null,"op":"+","text":"- `--source`: one encrypted collector bundle with `schema_version: 1`, an aware `collected_at`, `account_member_urn`, complete `snapshots.INBOX` and `snapshots.CONNECTIONS`, a complete `prospects` read, and a nested `changelog`. Each snapshot needs `source_result: \"success\"`, `truncated: false`, a positive `page_count`, and consistent `rows` and `raw_elements`. Prospects need unique IDs, stable count metadata, and `completed_at`. The nested changelog needs `events`, `truncated: false`, a positive `page_count`, `next_start_time`, and an aware `collected_at`. Its watermark may be `null` only for an empty complete event list. Successful message CREATE activities need matching owner, actor, author, resource, thread, content, attachments, and time. A profile URL cannot prove the account-member binding. The changelog is consumed only from this bundle."},{"new":8,"old":null,"op":"+","text":"- `--policy`: `profiles` keyed by exact canonical LinkedIn profile URL. First-DM eligibility uses one matching CONNECTIONS `Connected On` calendar date, supplied as ISO `YYYY-MM-DD` or the provider English `D Mon YYYY` format, within the last 30 UTC calendar days. No acceptance instant is required or inferred. If `accepted_at` is supplied, it must be an aware timestamp no later than the report clock whose UTC date matches the provider day. Qualification also needs `country: \"US\"`, `pvf_employer: true`, at least one valid HTTPS `qualification_citations` URL, and `opt_out: false`. Missing, invalid, or conflicting provider dates withhold first DMs; the policy timestamp alone cannot establish connection recency. Replies and follow-ups use observed message history and the opt-out gate; they do not require first-DM qualification."},{"new":9,"old":null,"op":"+","text":"- `--research`: `rows` with an exact `profile_url`, `identity_match.canonical_profile_url_exact: true`, a nonempty `proposed_personalized_opener`, and nonempty `supporting_facts` with `fact` and valid HTTPS `source_url`. This is saved, cited input; the report does not fetch or independently verify research pages."},{"new":10,"old":null,"op":"+","text":""},{"new":11,"old":null,"op":"+","text":"Run the CLI with `--source`, `--policy`, `--research`, `--output-dir`, and `--account-profile-url`. `--now` accepts an aware ISO time for repeatable offline runs. The output directory must not exist. The CLI creates it with mode `0700` and creates `private-dm-actions.json` and `private-dm-actions.md` with mode `0600`. Standard output is a fixed success or failure line. A standalone `--changelog` argument is unsupported."},{"new":12,"old":null,"op":"+","text":""},{"new":13,"old":null,"op":"+","text":"The classifier only verifies a DM when a successful CREATE activity uniquely matches a one-to-one INBOX row by thread, people, direction, UTC second, text, and attachments. Typed invitation notes remain separate. Unknown rows, malformed activities, conflicting replays, group threads, incomplete sources, and stale acquisitions withhold affected actions. Read state stays `unknown`. A first-DM row shows `connected_on` with calendar-day precision and `connection_source`; it does not invent a UTC acceptance instant. The `first_dm` reason means no prior DM was observed in the supplied snapshot; the consent changelog covers a bounded 28-day period and cannot prove lifetime absence or deleted history. `date_added` comes only from a unique matched prospect's valid `created_at` and never changes eligibility."},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"`tests/e2e_private_dm_actions.py` runs synthetic classifier, planner, and CLI scenarios and writes an aggregate verdict artifact at `artifacts/private-dm-actions-e2e-evidence.json`. `tests/e2e_dm_uncertainty_scope.py` separately verifies the timing boundary for anonymous evidence and writes `artifacts/dm-uncertainty-scope-e2e-evidence.json`. These checks use constructed source shapes. They do not verify a real provider changelog, live account identity, or current database contents."},{"new":16,"old":null,"op":"+","text":""},{"new":17,"old":null,"op":"+","text":"Group-thread uncertainty is attributed to every identified participant and leaves unrelated conversations eligible. Participant-less evidence remains unresolved. It always blocks a first-DM claim. For a verified reply or follow-up, it blocks only when its time is unknown or is new enough to change that action decision; older anonymous evidence cannot invalidate a newer verified message state. Only an explicit true policy opt-out is labelled `opt_out`; incomplete or conflicting policy records use `policy_opt_out_state_unverified`."},{"new":18,"old":null,"op":"+","text":""},{"new":19,"old":null,"op":"+","text":"A typed MEDIA activity with exact matching nonempty attachments may have empty text. Missing INBOX CONTENT is treated as empty only during exact correlation; blank TEXT without attachments remains unverified."},{"new":20,"old":null,"op":"+","text":""},{"new":21,"old":null,"op":"+","text":"CONNECTIONS completeness and freshness gate first-DM eligibility only. Replies and follow-ups use verified inbox/changelog history and prospect coverage. Connection coverage problems remain visible in the report coverage section."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"docs/private-dm-actions.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":1,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"Technical system infographic for the read-only DM evidence and action-report slice. Show shared positive classification feeding three private queues, preserving uncertainty and manual sends. Technical default structural-breakdown, technical-schematic,16:9,English,native imagegen. No person data or outcome counts."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/private-dm-actions/analysis.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":0,"hunks":[],"kind":"opaque","language":null,"path":"infographic/private-dm-actions/infographic.png","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":12,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"Generate a professional technical system infographic on an opaque neutral light-gray canvas with a dark outer border, high contrast labels and restrained teal/blue accents. Landscape16:9,English,structural-breakdown layout plus technical-schematic style. Clear system-level cards,ample white space,polished consistent simple evidence/file/person icons. Do not use a Mermaid/DAG look. Show evidence passing through a shared classification layer then three large private report cards. A smaller saved research card feeds only first-DM draft. An orange caution card shows unsafe evidence withheld, not promoted into an action. Render only these exact labels, neatly spelled and large readable text:"},{"new":2,"old":null,"op":"+","text":"Title: Private LinkedIn DM action report"},{"new":3,"old":null,"op":"+","text":"Input: Complete inbox + activity evidence"},{"new":4,"old":null,"op":"+","text":"Classification: Verified DM | Invitation note | Unknown"},{"new":5,"old":null,"op":"+","text":"Research: Saved cited research"},{"new":6,"old":null,"op":"+","text":"Card1: First DM / Researched draft"},{"new":7,"old":null,"op":"+","text":"Card2: Reply / Manual reminder"},{"new":8,"old":null,"op":"+","text":"Card3: Follow-up / Manual reminder after 72h"},{"new":9,"old":null,"op":"+","text":"Caution: Unsafe or incomplete / Withhold with reason"},{"new":10,"old":null,"op":"+","text":"Small callout: Read state stays unknown without proof"},{"new":11,"old":null,"op":"+","text":"Footer: Private files only | No Supabase writes | You send messages"},{"new":12,"old":null,"op":"+","text":"No names,URLs,secret data,test counts,claim of live deployment,or extra text. Keep all text and lines within the canvas."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/private-dm-actions/prompts/01-infographic-private-dm-actions.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":10,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"Private LinkedIn DM action report"},{"new":2,"old":null,"op":"+","text":"Complete inbox + activity evidence"},{"new":3,"old":null,"op":"+","text":"Verified DM | Invitation note | Unknown"},{"new":4,"old":null,"op":"+","text":"Saved cited research"},{"new":5,"old":null,"op":"+","text":"First DM: Researched draft"},{"new":6,"old":null,"op":"+","text":"Reply: Manual reminder"},{"new":7,"old":null,"op":"+","text":"Follow-up: Manual reminder after 72h"},{"new":8,"old":null,"op":"+","text":"Unsafe or incomplete: Withhold with reason"},{"new":9,"old":null,"op":"+","text":"Read state stays unknown without proof"},{"new":10,"old":null,"op":"+","text":"Private files only | No Supabase writes | You send messages"}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/private-dm-actions/source.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":10,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"Private LinkedIn DM action report"},{"new":2,"old":null,"op":"+","text":"Complete inbox + activity evidence"},{"new":3,"old":null,"op":"+","text":"Verified DM | Invitation note | Unknown"},{"new":4,"old":null,"op":"+","text":"Saved cited research"},{"new":5,"old":null,"op":"+","text":"First DM: Researched draft"},{"new":6,"old":null,"op":"+","text":"Reply: Manual reminder"},{"new":7,"old":null,"op":"+","text":"Follow-up: Manual reminder after 72h"},{"new":8,"old":null,"op":"+","text":"Unsafe or incomplete: Withhold with reason"},{"new":9,"old":null,"op":"+","text":"Read state stays unknown without proof"},{"new":10,"old":null,"op":"+","text":"Private files only | No Supabase writes | You send messages"}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/private-dm-actions/structured-content.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":125,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"#!/usr/bin/env python3"},{"new":2,"old":null,"op":"+","text":"\"\"\"Write a private, offline, read-only LinkedIn DM action report.\"\"\""},{"new":3,"old":null,"op":"+","text":""},{"new":4,"old":null,"op":"+","text":"from __future__ import annotations"},{"new":5,"old":null,"op":"+","text":""},{"new":6,"old":null,"op":"+","text":"import argparse"},{"new":7,"old":null,"op":"+","text":"import json"},{"new":8,"old":null,"op":"+","text":"import os"},{"new":9,"old":null,"op":"+","text":"import re"},{"new":10,"old":null,"op":"+","text":"import stat"},{"new":11,"old":null,"op":"+","text":"from datetime import datetime, timedelta"},{"new":12,"old":null,"op":"+","text":"from pathlib import Path"},{"new":13,"old":null,"op":"+","text":"from typing import Any, NoReturn"},{"new":14,"old":null,"op":"+","text":""},{"new":15,"old":null,"op":"+","text":"from linkedin_mdp_mcp.dm_actions import ("},{"new":16,"old":null,"op":"+","text":"    _aware_time,"},{"new":17,"old":null,"op":"+","text":"    classify_dm_evidence,"},{"new":18,"old":null,"op":"+","text":"    plan_dm_actions,"},{"new":19,"old":null,"op":"+","text":")"},{"new":20,"old":null,"op":"+","text":""},{"new":21,"old":null,"op":"+","text":""},{"new":22,"old":null,"op":"+","text":"class _Parser(argparse.ArgumentParser):"},{"new":23,"old":null,"op":"+","text":"    \"\"\"Keep invalid arguments on a fixed private diagnostic path.\"\"\""},{"new":24,"old":null,"op":"+","text":""},{"new":25,"old":null,"op":"+","text":"    def error(self, message: str) -\u003e NoReturn:"},{"new":26,"old":null,"op":"+","text":"        \"\"\"Raise without printing any argument or path.\"\"\""},{"new":27,"old":null,"op":"+","text":"        raise ValueError(\"arguments_invalid\")"},{"new":28,"old":null,"op":"+","text":""},{"new":29,"old":null,"op":"+","text":""},{"new":30,"old":null,"op":"+","text":"def _read(path: Path) -\u003e Any:"},{"new":31,"old":null,"op":"+","text":"    \"\"\"Read one regular mode-0600 JSON input.\"\"\""},{"new":32,"old":null,"op":"+","text":"    mode = path.lstat().st_mode"},{"new":33,"old":null,"op":"+","text":"    if not stat.S_ISREG(mode) or stat.S_IMODE(mode) \u0026 0o077:"},{"new":34,"old":null,"op":"+","text":"        raise ValueError(\"input_permissions_invalid\")"},{"new":35,"old":null,"op":"+","text":"    return json.loads(path.read_text(encoding=\"utf-8\"))"},{"new":36,"old":null,"op":"+","text":""},{"new":37,"old":null,"op":"+","text":""},{"new":38,"old":null,"op":"+","text":"def _write(path: Path, content: str) -\u003e None:"},{"new":39,"old":null,"op":"+","text":"    \"\"\"Create one new private artifact without replacing an existing file.\"\"\""},{"new":40,"old":null,"op":"+","text":"    descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)"},{"new":41,"old":null,"op":"+","text":"    try:"},{"new":42,"old":null,"op":"+","text":"        with os.fdopen(descriptor, \"w\", encoding=\"utf-8\", closefd=False) as output:"},{"new":43,"old":null,"op":"+","text":"            output.write(content)"},{"new":44,"old":null,"op":"+","text":"    finally:"},{"new":45,"old":null,"op":"+","text":"        os.close(descriptor)"},{"new":46,"old":null,"op":"+","text":""},{"new":47,"old":null,"op":"+","text":""},{"new":48,"old":null,"op":"+","text":"def _markdown(result: dict[str, Any]) -\u003e str:"},{"new":49,"old":null,"op":"+","text":"    \"\"\"Render action groups and uncertainty inside the private report.\"\"\""},{"new":50,"old":null,"op":"+","text":"    lines = [\"# Private LinkedIn DM actions\", \"\", \"Owner reviews every action and sends manually.\", \"\"]"},{"new":51,"old":null,"op":"+","text":"    for title, key in ((\"Replies\", \"reply\"), (\"Follow-ups\", \"follow_up\"), (\"First DMs\", \"first_dm\"), (\"Withheld\", \"withheld\")):"},{"new":52,"old":null,"op":"+","text":"        lines.extend((f\"## {title}\", \"\"))"},{"new":53,"old":null,"op":"+","text":"        for row in result[key]:"},{"new":54,"old":null,"op":"+","text":"            lines.extend((f\"### {row['profile_url']}\", \"\", f\"- Reason: {row['reason']}\", f\"- Prospect ID: {row.get('prospect_id', 'unknown')}\", f\"- Date added: {row.get('date_added') or 'unknown'}\", f\"- Date source: {row.get('date_added_source') or 'unknown'}\"))"},{"new":55,"old":null,"op":"+","text":"            if \"message\" in row:"},{"new":56,"old":null,"op":"+","text":"                lines.append(f\"- Verified message: {row['message']}\")"},{"new":57,"old":null,"op":"+","text":"            if \"draft\" in row:"},{"new":58,"old":null,"op":"+","text":"                lines.append(f\"- Connected on: {row['connected_on']} (calendar day)\")"},{"new":59,"old":null,"op":"+","text":"                lines.append(f\"- Connection source: {row['connection_source']}\")"},{"new":60,"old":null,"op":"+","text":"                lines.append(f\"- Saved researched draft: {row['draft']}\")"},{"new":61,"old":null,"op":"+","text":"                for citation in row[\"citations\"]:"},{"new":62,"old":null,"op":"+","text":"                    lines.append(f\"- Research source: {citation['source_url']} ({citation['fact']})\")"},{"new":63,"old":null,"op":"+","text":"            if \"source_refs\" in row:"},{"new":64,"old":null,"op":"+","text":"                lines.append(f\"- Message sources: {', '.join(row['source_refs'])}\")"},{"new":65,"old":null,"op":"+","text":"            if \"read_state\" in row:"},{"new":66,"old":null,"op":"+","text":"                lines.append(f\"- Read state: {row['read_state']}\")"},{"new":67,"old":null,"op":"+","text":"            lines.append(\"\")"},{"new":68,"old":null,"op":"+","text":"    lines.extend((\"## Coverage\", \"\", f\"- Changelog scope: {result['coverage']['changelog_scope']}\", f\"- Upstream freshness: {result['coverage']['upstream_freshness']}\", f\"- Withholding reasons: {', '.join(result['coverage']['reasons']) or 'none'}\", \"\"))"},{"new":69,"old":null,"op":"+","text":"    return \"\\n\".join(lines)"},{"new":70,"old":null,"op":"+","text":""},{"new":71,"old":null,"op":"+","text":""},{"new":72,"old":null,"op":"+","text":"def main(argv: list[str] | None = None) -\u003e int:"},{"new":73,"old":null,"op":"+","text":"    \"\"\"Validate private inputs and write fresh mode-0700/0600 local outputs.\"\"\""},{"new":74,"old":null,"op":"+","text":"    try:"},{"new":75,"old":null,"op":"+","text":"        parser = _Parser(description=\"Build a private LinkedIn DM action report.\")"},{"new":76,"old":null,"op":"+","text":"        for name in (\"source\", \"policy\", \"research\"):"},{"new":77,"old":null,"op":"+","text":"            parser.add_argument(f\"--{name}\", required=True, type=Path)"},{"new":78,"old":null,"op":"+","text":"        parser.add_argument(\"--output-dir\", required=True, type=Path)"},{"new":79,"old":null,"op":"+","text":"        parser.add_argument(\"--account-profile-url\", required=True)"},{"new":80,"old":null,"op":"+","text":"        parser.add_argument(\"--now\", help=\"Timezone-aware ISO clock for repeatable offline runs\")"},{"new":81,"old":null,"op":"+","text":"        args = parser.parse_args(argv)"},{"new":82,"old":null,"op":"+","text":"        source = _read(args.source)"},{"new":83,"old":null,"op":"+","text":"        policy = _read(args.policy)"},{"new":84,"old":null,"op":"+","text":"        research = _read(args.research)"},{"new":85,"old":null,"op":"+","text":"        if not all(isinstance(item, dict) for item in (source, policy, research)):"},{"new":86,"old":null,"op":"+","text":"            raise ValueError(\"input_shape_invalid\")"},{"new":87,"old":null,"op":"+","text":"        account_member_urn = source.get(\"account_member_urn\")"},{"new":88,"old":null,"op":"+","text":"        if not isinstance(account_member_urn, str) or re.fullmatch(r\"urn:li:person:[A-Za-z0-9_-]+\", account_member_urn) is None:"},{"new":89,"old":null,"op":"+","text":"            raise ValueError(\"source_account_member_urn_invalid\")"},{"new":90,"old":null,"op":"+","text":"        now = datetime.fromisoformat(args.now) if args.now else datetime.now().astimezone()"},{"new":91,"old":null,"op":"+","text":"        source_acquired = _aware_time(source.get(\"collected_at\"))"},{"new":92,"old":null,"op":"+","text":"        if source.get(\"schema_version\") != 1 or source_acquired is None or source_acquired \u003e now or now - source_acquired \u003e timedelta(days=1):"},{"new":93,"old":null,"op":"+","text":"            raise ValueError(\"source_manifest_invalid\")"},{"new":94,"old":null,"op":"+","text":"        changelog = source.get(\"changelog\")"},{"new":95,"old"
