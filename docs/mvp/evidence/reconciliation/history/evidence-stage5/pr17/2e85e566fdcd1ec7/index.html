  :root {

    --card-ctx: #f9fafb;
    --border: #e1e4ea;
    --border-strong: #cfd4dc;
    --band: rgba(15, 23, 42, 0.022);
    --text: #0f1420;
    --muted: #5b6372;
    --faint: #8b93a1;
    --green: #129b5a;
    --amber: #c27c0e;
    --red: #d6363f;
    --grey: #9aa1ad;
    --accent: #4f5bd5;
    --edge: #a3a9b5;
    --add-bg: rgba(18, 155, 90, 0.1);
    --del-bg: rgba(214, 54, 63, 0.09);
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 6px 20px rgba(15, 23, 42, 0.07);
    --shadow-lg: 0 24px 64px rgba(15, 23, 42, 0.18);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100vh;
}

.st-added { --st: var(--green); }
.st-modified { --st: var(--amber); }
.st-deleted { --st: var(--red); }
.st-context { --st: var(--grey); }

/* Header */

.top {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-solid);
  position: relative;
  z-index: 5;
}

.headline { min-width: 0; flex: 1 1 0; }

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}

.logo {
  display: inline-grid;
  grid-template-columns: repeat(3, 4px);
  gap: 2px;
  align-items: center;
}

.logo i {
  display: block;
  width: 4px;
  height: 12px;
  border-radius: 2px;
  background: var(--green);
}

.logo i:nth-child(2) { height: 8px; background: var(--amber); }
.logo i:nth-child(3) { height: 5px; background: var(--red); }

.brand-name {
  color: var(--text);
  font-weight: 600;
  letter-spacing: 0.01em;
}

.meta { overflow: hidden; text-overflow: ellipsis; }
.meta .sep { color: var(--faint); margin: 0 6px; }
.meta .mono { font-family: var(--mono); font-size: 11.5px; }

.meta a {
  color: var(--accent);
  text-decoration: none;
}

.meta a:hover { text-decoration: underline; }

h1 {
  margin: 4px 0 0;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.012em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stats {
  display: flex;
  gap: 8px;
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
}

.stat {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 72px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--raise);
  white-space: nowrap;
}

.stat-value {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 17px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
}

.stat.good .stat-value { color: var(--green); }
.stat.bad .stat-value { color: var(--red); }
.stat.warn .stat-value { color: var(--amber); }
.stat.none .stat-value { color: var(--muted); }

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
}

.play {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 16px 0 14px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--text);
  color: var(--bg);
  font-weight: 600;
  white-space: nowrap;
  box-shadow: var(--shadow);
}

.play:hover { opacity: 0.9; }

.play-icon {
  width: 0;
  height: 0;
  border-left: 9px solid currentColor;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.playing .play-icon {
  width: 10px;
  height: 12px;
  border: 0;
  border-left: 3px solid currentColor;
  border-right: 3px solid currentColor;
}

/* Canvas */

.viewport {
  position: relative;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.2px);
  background-size: 24px 24px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.viewport.dragging { cursor: grabbing; }

.world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
}

.band {
  position: absolute;
  border: 1px dashed var(--border);
  border-radius: 16px;
  background: var(--band);
}

.band-label {
  position: absolute;
  left: 16px;
  top: 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
  white-space: nowrap;
}

.edges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.e {
  fill: none;
  stroke: var(--edge);
  stroke-width: 1.5;
  transition: opacity 160ms ease;
}

.e-added {
  stroke: var(--green);
  stroke-width: 2;
  stroke-dasharray: 8 6;
  animation: flow 1s linear infinite;
}

.e-removed {
  stroke: var(--red);
  stroke-width: 1.75;
  stroke-dasharray: 5 5;
  opacity: 0.85;
}

.e-name {
  stroke-dasharray: 1 6;
  stroke-linecap: round;
  stroke-width: 2.25;
}

.e-added.e-name { stroke-width: 2.5; }

.arrow-added { fill: var(--green); }
.arrow-removed { fill: var(--red); }
.arrow-kept { fill: var(--edge); }

@keyframes flow {
  to { stroke-dashoffset: -28; }
}

/* Nodes */

.node {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 8px 12px 8px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
  transition: opacity 160ms ease, border-color 120ms ease, box-shadow 160ms ease;
}

.node:hover { border-color: var(--border-strong); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.node .bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--st);
}

.node.st-context {
  background: var(--card-ctx);
  border-style: dashed;
  box-shadow: none;
}

.node.st-context .bar { opacity: 0.6; }

.n-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.glyph {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1px solid var(--border-strong);
  color: var(--muted);
  font: 600 10.5px/1 var(--mono);
}

.name {
  min-width: 0;
  flex: 1 1 auto;
  font: 600 13px/1.3 var(--mono);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.st-context .name { color: var(--muted); font-weight: 500; }

.st-deleted .name {
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 1.5px;
  color: var(--muted);
}

.pill {
  flex: none;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--st);
  background: color-mix(in srgb, var(--st) 14%, transparent);
}

.path {
  font: 11px/1.35 var(--mono);
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
}

.path > span { direction: ltr; unicode-bidi: isolate; }

.n-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
}

.n-row > .path { flex: 1 1 auto; min-width: 0; }

.n-row > .sites {
  flex: none;
  font-size: 11px;
  color: var(--faint);
}

.delta { font: 600 11.5px/1 var(--mono); }
.plus { color: var(--green); }
.minus { color: var(--red); }

.badge {
  margin-left: auto;
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
  background: color-mix(in srgb, var(--amber) 10%, transparent);
}

.chip {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 12px 0 16px;
  border-radius: 999px;
}

.chip .bar { width: 3px; }

.chip .name { flex: 0 1 auto; font-weight: 500; font-size: 12.5px; }
.chip.st-deleted .name { color: var(--muted); }

.dense .sym {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 0 8px 0 12px;
  border-radius: 8px;
  box-shadow: none;
}

.dense .sym .bar { width: 3px; }
.dense .sym .name { font-size: 12px; }
.dense .sym .glyph { width: 16px; height: 16px; font-size: 9.5px; }
.dense .sym .pill { padding: 0 5px; font-size: 9px; }

.flag {
  flex: none;
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  font: 700 10px/1 var(--sans);
  color: var(--amber);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
}

.group {
  position: absolute;
  padding: 6px 4px 0;
  font: 11px/1.3 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  text-align: left;
  pointer-events: none;
}

.group > span { direction: ltr; unicode-bidi: isolate; }

body:not(.touring) .dense .e:not(.lit) { opacity: 0; }

.empty {
  position: absolute;
  left: 50%;
  bottom: 96px;
  transform: translateX(-50%);
  padding: 12px 20px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--muted);
  font-size: 14px;
  white-space: nowrap;
  pointer-events: none;
}

.risk {
  flex: none;
  margin-left: auto;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--red);
  background: color-mix(in srgb, var(--red) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
  white-space: nowrap;
}

.world.far .path,
.world.far .sites { display: none; }
.world.far .name { font-size: 16px; }
.world.far .pill { font-size: 12px; }

.hovering .node:not(.lit),
.hovering .e:not(.lit) { opacity: 0.14; }

.hovering .e.lit { stroke-width: 2.5; }

.node.lit { border-color: var(--border-strong); }

.node.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent), var(--shadow);
}

.node.focus {
  border-color: var(--st);
  box-shadow: 0 0 0 1px var(--st), 0 0 40px color-mix(in srgb, var(--st) 40%, transparent), var(--shadow);
}

/* Tour */

.touring .node,
.touring .e { transition: none; }

.touring .e-added { animation: none; }

.spot {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 40%, transparent 35%, color-mix(in srgb, var(--bg) 82%, transparent) 100%);
}

.touring .spot { opacity: 1; }

.progress {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 2px;
  display: none;
}

.touring .progress { display: block; }

#progress-bar {
  height: 100%;
  width: 0;
  background: var(--accent);
}

.caption {
  position: absolute;
  left: 50%;
  bottom: 40px;
  width: min(760px, calc(100% - 48px));
  transform: translateX(-50%);
  padding: 16px 24px 18px;
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .caption { display: block; }

.cap-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.cap-count { color: var(--faint); font-variant-numeric: tabular-nums; }

.cap-main {
  margin-top: 6px;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.015em;
}

.cap-main .code { font-family: var(--mono); font-size: 20px; }

.cap-sub {
  margin-top: 6px;
  font: 12.5px/1.4 var(--mono);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.summary {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(720px, calc(100% - 48px));
  transform: translate(-50%, -50%);
  padding: 32px 40px;
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  background: var(--panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-lg);
  display: none;
  pointer-events: none;
}

.touring .summary { display: block; }

.sum-kicker {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.sum-title {
  margin-top: 8px;
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -0.015em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sum-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 24px;
}

.sum-cell {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--raise);
}

.sum-num {
  font-size: 40px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.sum-label { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.sum-cell.good .sum-num { color: var(--green); }
.sum-cell.bad .sum-num { color: var(--red); }
.sum-cell.warn .sum-num { color: var(--amber); }

.sum-note {
  margin-top: 16px;
  color: var(--muted);
  font-size: 14px;
}

.sum-brand {
  margin-top: 24px;
  font-size: 12px;
  color: var(--faint);
}

/* Floating controls */

.legend {
  position: absolute;
  left: 16px;
  bottom: 16px;
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 11.5px;
  color: var(--muted);
  box-shadow: var(--shadow);
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.sw {
  width: 10px;
  height: 10px;
  margin-left: 6px;
  border-radius: 3px;
  background: var(--st);
}

.sw:first-child, .ls:first-child { margin-left: 0; }
.ls { width: 32px; height: 8px; margin-left: 8px; overflow: visible; }

.zoom {
  position: absolute;
  right: 16px;
  bottom: 16px;
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.zoom button {
  min-width: 36px;
  height: 32px;
  padding: 0 10px;
  border: 0;
  border-right: 1px solid var(--border);
  background: transparent;
  font-size: 13px;
  color: var(--muted);
}

.zoom button:last-child { border-right: 0; }
.zoom button:hover { color: var(--text); background: var(--band); }

.touring .legend,
.touring .zoom { opacity: 0; pointer-events: none; }

/* Drawer */

.drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 92vw);
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--panel-solid);
  box-shadow: var(--shadow-lg);
  transform: translateX(104%);
  transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
  z-index: 4;
  cursor: auto;
  user-select: text;
}

.drawer[aria-hidden="false"] { transform: none; }

.d-head {
  position: relative;
  padding: 20px 56px 16px 24px;
  border-bottom: 1px solid var(--border);
}

.d-head .bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--st);
}

.d-tags { display: flex; align-items: center; gap: 8px; }

.d-kind {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.d-name {
  margin: 8px 0 4px;
  font: 650 18px/1.3 var(--mono);
  letter-spacing: -0.01em;
  word-break: break-all;
}

.st-deleted .d-name { text-decoration: line-through; text-decoration-color: var(--red); }

.d-path { font: 12px/1.4 var(--mono); color: var(--muted); word-break: break-all; }

.d-close {
  position: absolute;
  right: 16px;
  top: 16px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}

.d-close:hover { color: var(--text); border-color: var(--border-strong); }

.d-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
}

.fact {
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  white-space: nowrap;
}

.fact.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.fact.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

.d-body {
  flex: 1 1 auto;
  overflow: auto;
  padding: 8px 0 24px;
}

.d-section { padding: 16px 24px 0; }

.d-title {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}

.d-empty { font-size: 12.5px; color: var(--faint); }

.diff {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: auto;
  background: var(--bg);
  font: 12px/20px var(--mono);
}

.diff-rows { width: max-content; min-width: 100%; }

.hunk-head {
  padding: 2px 12px;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-top: 1px solid var(--border);
}

.diff-rows .hunk-head:first-child { border-top: 0; }

.dl {
  display: grid;
  grid-template-columns: 40px 40px 20px auto;
  white-space: pre;
}

.dl .ln {
  padding-right: 8px;
  text-align: right;
  color: var(--faint);
  user-select: none;
}

.dl .sg { text-align: center; user-select: none; }
.dl .code { padding-right: 16px; }
.dl.add { background: var(--add-bg); }
.dl.add .sg { color: var(--green); }
.dl.del { background: var(--del-bg); }
.dl.del .sg { color: var(--red); }

.links { display: grid; gap: 4px; }

.link {
  display: grid;
  grid-template-columns: 4px 1fr auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px 8px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--raise);
  text-align: left;
  overflow: hidden;
}

.link:hover { border-color: var(--border-strong); }
.link .bar { height: 100%; min-height: 32px; background: var(--st); border-radius: 0 2px 2px 0; }
.link-text { min-width: 0; }
.link-name { display: block; font: 600 12.5px/1.35 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link-path { display: block; font: 11px/1.35 var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.etag {
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 6px;
  color: var(--muted);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.etag.added { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
.etag.removed { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }

/* Footer */

.foot {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 24px;
  border-top: 1px solid var(--border);
  background: var(--panel-solid);
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
}

.brand-line { font-weight: 550; color: var(--text); opacity: 0.8; }
.hints { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 1440px) {
  .top { gap: 16px; }
  .stat { min-width: 0; padding: 6px 10px; }
  .stat-value { font-size: 16px; }
  .stat-label { font-size: 10.5px; }

@media (max-width: 1100px) {

  .hints { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .e-added { animation: none; }

employer require an HTTP citation with timezone-aware `retrieved_at` no older than 90 days plus a `profile_url` attestation that normalizes to the candidate's exact profile. The caller attests that the cited fact was researched. The builder validates citation shape, retrieval freshness, and this exact-profile binding, but does not fetch webpage contents."},{"new":14,"old":14,"op":" ","text":""},{"new":null,"old":15,"op":"-","text":"The `current_employers` object maps raw profile URL keys to a registered company ID and citations. URLs normalize with the same Unicode-preserving identity normalizer used for inbox participants. Multiple keys that normalize to one profile may repeat the same company assignment. Conflicting assignments, unregistered companies, invalid citations, or unsupported identities enter the private queue and withhold all capacity claims. The owner's explicit assumption is that each person's latest known employer is present. Citation retrieval time must be recent; source publication or indexing date does not determine historical employer eligibility."},{"new":15,"old":null,"op":"+","text":"The `current_employers` object maps raw profile URL keys to cited registered present employers (legacy single company or explicit set). URLs normalize with the same Unicode-preserving identity normalizer used for inbox participants. Multiple keys that normalize to one profile may repeat the same company assignment. Conflicting assignments, unregistered companies, invalid citations, or unsupported identities enter the private queue and withhold all capacity claims. The owner's explicit assumption is that each explicitly cited current job is present. Citation retrieval time must be recent; source publication or indexing date does not determine historical employer eligibility."},{"new":16,"old":16,"op":" ","text":""},{"new":17,"old":17,"op":" ","text":"Each unresolved employer key retains a stable opaque evidence ID and input key index pointer. An invalid assignment for any canonical alias removes that person from resolved employer and capacity audit entries."},{"new":18,"old":18,"op":" ","text":""}],"new_start":12,"old_start":12},{"lines":[{"new":49,"old":49,"op":" ","text":""},{"new":50,"old":50,"op":" ","text":"## All-history capacity"},{"new":51,"old":51,"op":" ","text":""},{"new":null,"old":52,"op":"-","text":"The CLI and pure function require `--cap-scope all_history`. Every outgoing invitation source is grouped by normalized exact profile identity. The report counts each person once against their mapped latest-known employer across provider invitations, explicit CRM sent facts, and actual Supabase invitation events. Historical invitation dates and previous employer claims remain audit data. They do not gate capacity or change the mapped employer."},{"new":52,"old":null,"op":"+","text":"The CLI and pure function require `--cap-scope all_history`. Every outgoing invitation source is grouped by normalized exact profile identity. Each historical person consumes one invitation slot at each company in their complete present-employer set, regardless of whether the evidence comes from provider invitations, explicit CRM sent facts, or actual Supabase invitation events. Historical invitation dates and previous employer claims remain audit data. They do not gate capacity or change the present-employer set."},{"new":53,"old":53,"op":" ","text":""},{"new":54,"old":54,"op":" ","text":"The JSON audit retains each source evidence ID, source row pointer, observed event date when available, profile URL, and the current-employer citations. Unknown or unsupported invitation identities and profiles without a valid current-employer mapping enter `research_queue`. Any unresolved queue row withholds the entire shortlist and all remaining-slot claims. The `Company` field in CRM is never employer proof. Accepted dates and connections do not consume invitation slots. They still exclude people from recommendations under the existing eligibility rules."},{"new":55,"old":55,"op":" ","text":""}],"new_start":49,"old_start":49},{"lines":[{"new":76,"old":76,"op":" ","text":"Input files must be regular files with no group or world permissions. The CLI creates the new output directory with mode `0700` and both reports with mode `0600`. It refuses existing output directories. Standard output contains only a fixed completion status. Validation errors never include row content, names, URLs, or message text. `tests/e2e_invitation_shortlist.py` covers synthetic source boundaries. `tests/test_invitation_shortlist_e2e.py` runs the matrix and writes a sanitized artifact with fixed verdicts and a digest."},{"new":77,"old":77,"op":" ","text":""},{"new":78,"old":78,"op":" ","text":"A successfully fetched empty provider page may have zero snapshot elements when its status and exported rows prove completeness. CRM opt-out fields treat explicit negative values (`false`, `no`, `0`, empty, or absent) as negative. Affirmative or uninterpretable nonempty values suppress a prospect."},{"new":79,"old":null,"op":"+","text":""},{"new":80,"old":null,"op":"+","text":"### Concurrent present employers"},{"new":81,"old":null,"op":"+","text":""},{"new":82,"old":null,"op":"+","text":"Legacy `{ \"company_id\": \"co-a\", \"citations\": [...] }` assignments remain valid singleton claims. For explicit concurrent jobs, use `{ \"assignments\": [{ \"company_id\": \"co-a\", \"citations\": [...] }, { \"company_id\": \"co-b\", \"citations\": [...] }], \"coverage\": \"complete\", \"unknown_reasons\": [] }`. Each company needs its own dated citations. Duplicate same-company roles and citations collapse without consuming extra capacity. No primary employer or corporate alias is inferred. Do not mix singleton fields with `assignments`."},{"new":83,"old":null,"op":"+","text":""},{"new":84,"old":null,"op":"+","text":"Under the owner's all-jobs-present assumption, every historical outgoing profile counts once per assigned company across all history. A candidate's qualified company must belong to its present set. Selection requires room in every present company and consumes one slot in each. A person still appears once in the invitation list. Distinct canonical URL keys may repeat an identical complete company set; different sets remain conflicting instead of being silently unioned. Empty, unregistered, partial or unnamed assignments retain explicit research reasons and withhold global capacity claims. Incomplete sets are omitted from resolved assignment and capacity audits; their cited positives remain in the original qualification input, not asserted as complete report assignments."},{"new":85,"old":null,"op":"+","text":""},{"new":86,"old":null,"op":"+","text":"`current_employer_assignments` keeps its existing flat profile/company/citations rows, with multiple rows for concurrent employers. The additive `current_employer_sets` audit lists each resolved profile's company IDs and complete coverage. `company_usage.remaining_slots` retains its historical-capacity meaning; `remaining_slots_after_selection` additionally shows remaining capacity after all proposed invitations. Neither a proposal nor an assignment records an actual send. Existing combined report rendering accepts the flat rows without a schema change."}],"new_start":76,"old_start":76}],"kind":"docs","language":null,"path":"docs/invitation-shortlist.md","removed":2,"sensitive":null,"status":"modified","symbols":[]},{"added":1,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"Technical system PR infographic; explain profile-to-many-companies accounting and invitation capacity. Defaults structural-breakdown / technical-schematic / 16:9 / English / native imagegen. Saved backend auto. No private names, dates, test counts or deployed-state claims."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/present-employer-sets/analysis.md","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":0,"hunks":[],"kind":"opaque","language":null,"path":"infographic/present-employer-sets/infographic.png","removed":0,"sensitive":null,"status":"added","symbols":[]},{"added":10,"hunks":[{"lines":[{"new":1,"old":null,"op":"+","text":"Use case: infographic-diagram"},{"new":2,"old":null,"op":"+","text":"Asset type: GitHub PR raster infographic."},{"new":3,"old":null,"op":"+","text":"Create an English landscape16:9 structural-breakdown technical-schematic infographic. Opaque neutral light-gray background, clearly visible dark-gray outer border, high-contrast dark sans-serif text, restrained blue/teal accents, generous whitespace. Three coherent horizontal sections, large readable text. No private person/company names, numeric test counts, timestamps, logos or deployments."},{"new":4,"old":null,"op":"+","text":"Title exact: \"One person, every present employer\""},{"new":5,"old":null,"op":"+","text":"Left card exact text: \"EXACT PROFILE\", \"Explicit present employer set\", \"Legacy singleton supported\""},{"new":6,"old":null,"op":"+","text":"Left profile branches into two clearly separate simple company cards labeled \"Company A\" and \"Company B\". Both feed the middle capacity card."},{"new":7,"old":null,"op":"+","text":"Middle exact text: \"LIFETIME HISTORY\", \"Count once per person per company\", \"Duplicate rows add zero\", \"Three per company across all history\""},{"new":8,"old":null,"op":"+","text":"Right exact text: \"NEW RECOMMENDATION\", \"All employers need capacity\", \"Use one slot at each employer\", \"One recommendation per person\""},{"new":9,"old":null,"op":"+","text":"Bottom boundary exact text: \"Unknown employers withhold\", \"Report remains read-only\", \"Owner sends invitations\""},{"new":10,"old":null,"op":"+","text":"All arrows and labels inside canvas, no clutter. Render text verbatim. This is a system-level explanation, not an active send or deployed workflow."}],"new_start":1,"old_start":0}],"kind":"docs","language":null,"path":"infographic/present-employer-sets/prompts/0         k: LEGIBLE,
        x: box.w * LEGIBLE <= area.w ? area.x + area.w / 2 - (box.x + box.w / 2) * LEGIBLE : area.x - box.x * LEGIBLE,
        y: area.y - box.y * LEGIBLE,
      });
    }
    applyCamera();
  }

  let flight = 0;

  function flyTo(target) {
    const from = { ...cam };
    const start = performance.now();
    const id = ++flight;
    const step = (now) => {
      if (id !== flight) return;
      const p = ease(clamp((now - start) / 420, 0, 1));
      const k = from.k * Math.pow(target.k / from.k, p);
      const cx = lerp(centreX(from), centreX(target), p);
      const cy = lerp(centreY(from), centreY(target), p);
      Object.assign(cam, { k, x: viewport.clientWidth / 2 - cx * k, y: viewport.clientHeight / 2 - cy * k });
      applyCamera();
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  const lerp = (a, b, p) => a + (b - a) * p;
  const centreX = (c) => (viewport.clientWidth / 2 - c.x) / c.k;
  const centreY = (c) => (viewport.clientHeight / 2 - c.y) / c.k;

  function zoomAt(factor, sx, sy) {
    const k = clamp(cam.k * factor, 0.12, 2.5);
    cam.x = sx - ((sx - cam.x) * k) / cam.k;
    cam.y = sy - ((sy - cam.y) * k) / cam.k;
    cam.k = k;
    userMoved = true;
    applyCamera();
  }

  let drag = null;
  let dragged = false;

  viewport.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || $("drawer").contains(event.target) || event.target.closest(".zoom")) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY, cx: cam.x, cy: cam.y, captured: false };
    dragged = false;
  });

  viewport.addEventListener("pointermove", (event) => {
    if (!drag || drag.id !== event.pointerId) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (!drag.captured && Math.hypot(dx, dy) < 4) return;
    if (!drag.captured) {
      drag.captured = true;
      dragged = true;
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add("dragging");
      pause();
    }
    flight++;
    cam.x = drag.cx + dx;
    cam.y = drag.cy + dy;
    userMoved = true;
    applyCamera();
  });

  const endDrag = () => {
    drag = null;
    viewport.classList.remove("dragging");
  };
  viewport.addEventListener("pointerup", endDrag);
  viewport.addEventListener("pointercancel", endDrag);

  viewport.addEventListener("wheel", (event) => {
    if ($("drawer").contains(event.target)) return;
    event.preventDefault();
    flight++;
    pause();
    const rect = viewport.getBoundingClientRect();
    if (event.ctrlKey || event.metaKey) {
      zoomAt(Math.exp(-event.deltaY * 0.01), event.clientX - rect.left, event.clientY - rect.top);
    } else {
      cam.x -= event.deltaX;
      cam.y -= event.deltaY;
      userMoved = true;
      applyCamera();
    }
  }, { passive: false });

  viewport.addEventListener("click", (event) => {
    if (dragged || touring) return;
    if (event.target === viewport || event.target === world || event.target.classList.contains("band")) {
      select(null);
    }
  });

  $("zoom-in").addEventListener("click", () => zoomAt(1.25, viewport.clientWidth / 2, viewport.clientHeight / 2));
  $("zoom-out").addEventListener("click", () => zoomAt(0.8, viewport.clientWidth / 2, viewport.clientHeight / 2));
  $("zoom-fit").addEventListener("click", () => {
    userMoved = false;
    fit();
  });

  /* Hover and selection */

  let selected = null;

  function light(node) {
    world.classList.toggle("hovering", Boolean(node));
    for (const n of nodes) n.el.classList.toggle("lit", Boolean(node) && (n === node || node.near.has(n)));
    for (const e of edges) e.el.classList.toggle("lit", Boolean(node) && (e.src === node || e.dst === node));
  }

  for (const node of nodes) {
    node.el.addEventListener("pointerenter", () => {
      if (!touring && !drag) light(node);
    });
    node.el.addEventListener("pointerleave", () => {
      if (!touring) light(selected);
    });
    node.el.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.stopPropagation();
      select(node);
    });
    node.el.addEventListener("click", (event) => {
      event.stopPropagation();
      if (dragged) return;
      select(node);
    });
  }

  const drawer = $("drawer");
  const drawerOpen = () => drawer.getAttribute("aria-hidden") === "false";

  function select(node, centre) {
    if (touring) exitTour();
    if (selected) selected.el.classList.remove("selected");
    selected = node;
    light(node);
    if (!node) {
      drawer.setAttribute("aria-hidden", "true");
      return;
    }
    node.el.classList.add("selected");
    fillDrawer(node);
    drawer.setAttribute("aria-hidden", "false");
    if (centre) {
      const area = viewArea();
      const k = Math.max(cam.k, 0.8);
      flyTo({ k, x: area.x + area.w / 2 - (node.x + node.w / 2) * k, y: area.y + area.h / 2 - (node.y + node.h / 2) * k });
    }
  }

  function section(title, body) {
    return add(el("section", "d-section"), el("h3", "d-title", title), body);
  }

  function diffView(hunks) {
    if (!hunks.length) return el("div", "d-empty", "No line changes recorded for this item.");
    const box = el("div", "diff");
    const rows = el("div", "diff-rows");
    for (const hunk of hunks) {
      rows.appendChild(el("div", "hunk-head", `@@ ${MINUS}${hunk.old_start} +${hunk.new_start} @@`));
      for (const line of hunk.lines) {
        const kind = line.op === "+" ? "add" : line.op === "-" ? "del" : "ctx";
        add(rows, add(el("div", `dl ${kind}`),
          el("span", "ln", line.old === null ? "" : line.old),
          el("span", "ln", line.new === null ? "" : line.new),
          el("span", "sg", kind === "add" ? "+" : kind === "del" ? MINUS : ""),
          el("span", "code", line.text)));
      }
    }
    return add(box, rows);
  }

  const EDGE_TAG = { added: "new call", removed: "removed call", kept: "call" };

  function linkList(items, empty) {
    if (!items.length) return el("div", "d-empty", empty);
    const list = el("div", "links");
    for (const { node, tag, tagClass } of items) {
      const row = el("button", `link st-${node.status}`);
      row.setAttribute("type", "button");
      const text = el("span", "link-text");
      add(text, el("span", "link-name", node.name), el("span", "link-path", node.path));
      add(row, el("span", "bar"), text, tag ? el("span", `etag ${tagClass || ""}`, tag) : null);
      row.addEventListener("click", () => select(node, true));
      list.appendChild(row);
    }
    return list;
  }

  const edgeItem = (edge, other) => ({
    node: other,
    tag: `${EDGE_TAG[edge.status]}${edge.byName ? " \u00b7 by name" : ""}`,
    tagClass: edge.status,
  });

  function fillDrawer(node) {
    drawer.replaceChildren();
    drawer.className = `drawer st-${node.status}`;
    const head = el("div", "d-head");
    const tags = el("div", "d-tags");
    if (PILL[node.status]) tags.appendChild(el("span", "pill", PILL[node.status]));
    tags.appendChild(el("span", "d-kind", node.kind === "file" ? `${node.file.kind} file` : node.sym.kind));
    const close = el("button", "d-close", "\u00d7");
    close.setAttribute("type", "button");
    close.setAttribute("aria-label", "Close");
    close.addEventListener("click", () => select(null));
    add(head, el("div", "bar"), tags, el("div", "d-name", node.kind === "file" ? node.path : node.name),
      node.kind === "file" ? null : el("div", "d-path", node.path), close);

    const facts = el("div", "d-facts");
    const body = el("div", "d-body");

    if (node.kind === "file") {
      const file = node.file;
      add(facts, el("span", "fact", `+${file.added} ${MINUS}${file.removed}`));
      if (file.sensitive) facts.appendChild(el("span", "fact bad", file.sensitive));
      const brief = briefFile.get(file.path);
      if (file.sensitive && brief && !brief.named) facts.appendChild(el("span", "fact warn", "not mentioned in the description"));
      if (file.language === null && file.kind === "code") facts.appendChild(el("span", "fact", "not parsed"));
      add(body, section("Diff", diffView(file.hunks)));
      const inside = file.symbols.map((id) => symbolNode.get(id)).filter(Boolean);
      if (inside.length) body.appendChild(section("Symbols", linkList(inside.map((n) => ({ node: n })), "")));
    } else {
      const sym = node.sym;
      if (node.status !== "context") add(facts, el("span", "fact", `+${sym.added} ${MINUS}${sym.removed}`));
      facts.appendChild(el("span", "fact", plural(sym.call_sites, "call site", "call sites")));
      if (sym.span) facts.appendChild(el("span", "fact", `lines ${sym.span[0]}\u2013${sym.span[1]}`));
      else if (sym.base_span) facts.appendChild(el("span", "fact", `was lines ${sym.base_span[0]}\u2013${sym.base_span[1]}`));
      if (node.untested) facts.appendChild(el("span", "fact warn", `${NO_TEST}: no test in this map calls it`));
      const callers = node.in.filter((e) => !isTest(e.src));
      const tests = node.in.filter((e) => isTest(e.src));
      add(body,
        section("Diff", node.status === "context" ? el("div", "d-empty", "Unchanged. Shown because it calls or is called by changed code.") : diffView(sym.hunks)),
        section("Callers", linkList(callers.map((e) => edgeItem(e, e.src)), "No caller in the map.")),
        section("Callees", linkList(node.out.map((e) => edgeItem(e, e.dst)), "Calls nothing in the map.")),
        isTest(node) ? null : section("Tests", linkList(tests.map((e) => edgeItem(e, e.src)), "No test calls this directly.")));
    }

    head.appendChild(facts);
    add(drawer, head, body);
  }

  /* Tour */

  const names = (list) => {
    const shown = list.slice(0, 2).map((n) => n.name);
    return list.length > 2 ? `${shown.join(", ")} +${list.length - 2} more` : shown.join(" and ");
  };

  function focusNodes(ids) {
    const found = [];
    for (const id of ids) {
      const node = symbolNode.get(id) || fileNode.get(id);
      if (node) found.push(node);
      else if (fileByPath.has(id)) {
        for (const sid of fileByPath.get(id).symbols) if (symbolNode.has(sid)) found.push(symbolNode.get(sid));
      }
    }
    return found;
  }

  function symbolFacts(node) {
    const sym = node.sym;
    const parts = [node.path, `+${sym.added} ${MINUS}${sym.removed}`];
    if (node.status !== "deleted" && !isTest(node)) parts.push(plural(sym.call_sites, "call site", "call sites"));
    if (node.untested) parts.push(NO_TEST);
    return parts.join(DOT);
  }

  function describe(step, index, total) {
    const count = `${index + 1} / ${total}`;
    const focus = focusNodes(step.focus);
    const node = focus[0];
    const via = step.via ? symbolNode.get(step.via) : null;

    if (step.kind === "overview") {
      return {
        kicker: "Overview", count, main: MAP.title,
        sub: [plural(MAP.files.length, "file", "files"), plural(changed.length, "symbol changed", "symbols changed"),
          plural(added, "call added", "calls added"), `${removed} removed`].join(DOT),
      };
    }

    if (step.kind === "risky_file") {
      const path = step.focus[0] || "";
      const file = fileByPath.get(path);
      const brief = briefFile.get(path);
      const reason = (file && file.sensitive) || (brief && brief.sensitive) || "Sensitive file";
      const unnamed = brief && !brief.named ? `${DOT}not mentioned in the description` : "";
      return { kicker: "Risky surface", count, main: `${reason} changed${unnamed}`, sub: path };
    }

    if (step.kind === "summary") return { kicker: "Summary", count, main: "", sub: "" };

    if (!node || node.kind !== "symbol") return { kicker: step.kind, count, main: step.focus.join(", "), sub: "" };

    const word = node.sym.kind;
    const name = node.name;

    if (step.kind === "test") {
      const targets = node.out.filter(live).map((e) => e.dst);
      const covers = targets.length ? `${DOT}covers ${names(targets)}` : "";
      const main = node.status === "added" ? `New test ${name}${covers}`
        : node.status === "deleted" ? `Deleted test ${name}` : `Test ${name} changed${covers}`;
      return { kicker: "Test", count, main, sub: symbolFacts(node) };
    }

    if (step.kind === "callee" && via) {
      const link = node.in.find((e) => e.src === via);
      let main;
      if (node.status === "deleted") main = `Deleted ${name}${DOT}${via.name} no longer calls it`;
      else if (node.status === "added") main = `New ${word} ${name}${DOT}called by ${via.name}`;
      else if (link && link.status === "added") main = `${via.name} now calls ${name}`;
      else if (link && link.status === "removed") main = `${via.name} no longer calls ${name}`;
      else main = `${name} changed${DOT}called by ${via.name}`;
      return { kicker: `Called from ${via.name}`, count, main, sub: symbolFacts(node) };
    }

    const callers = node.in.filter((e) => live(e) && !isTest(e.src)).map((e) => e.src);
    let main;
    if (node.status === "deleted") {
      const former = node.in.filter((e) => !isTest(e.src)).map((e) => e.src);
      main = `Deleted ${name}${former.length ? `${DOT}${names(former)} no longer ${former.length === 1 ? "calls" : "call"} it` : ""}`;
    } else if (node.status === "added") {
      main = `New ${word} ${name}${callers.length ? `${DOT}called by ${names(callers)}` : `${DOT}nothing calls it yet`}`;
    } else {
      main = `${name} changed${callers.length ? `${DOT}called by ${names(callers)}` : ""}`;
    }
    return { kicker: step.kind === "entry" ? "Entry point" : "Changed", count, main, sub: symbolFacts(node) };
  }

  const timeline = (() => {
    const base = MAP.tour.map((s) => STEP_SECONDS[s.kind] || 3);
    const fixed = MAP.tour.reduce((sum, s, i) => sum + (s.kind === "overview" || s.kind === "summary" ? base[i] : 0), 0);
    const middle = base.reduce((sum, v) => sum + v, 0) - fixed;
    const scale = middle > 0 && fixed + middle > MAX_TOUR ? Math.max((MAX_TOUR - fixed) / middle, 0) : 1;
    let start = 0;
    return MAP.tour.map((step, i) => {
      const plain = step.kind === "overview" || step.kind === "summary";
      const duration = Math.round((plain ? base[i] : Math.max(base[i] * scale, MIN_STEP)) * 1000) / 1000;
      const focus = focusNodes(step.focus);
      const via = step.via ? symbolNode.get(step.via) : null;
      const lit = new Set(focus);
      if (via) lit.add(via);
      if (step.kind !== "risky_file") for (const n of focus) for (const m of n.near) lit.add(m);
      const item = {
        kind: step.kind, focus: step.focus, via: step.via, start: Math.round(start * 1000) / 1000, duration,
        caption: describe(step, i, MAP.tour.length), nodes: focus, viaNode: via, lit, plain: plain || !focus.length,
      };
      start += duration;
      return item;
    });
  })();

  const duration = Math.round(timeline.reduce((sum, s) => sum + s.duration, 0) * 1000) / 1000;

  function tourCamera(step) {
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    const area = { x: 48, y: 32, w: Math.max(200, w - 96), h: Math.max(160, h - 32 - 176) };
    if (step.plain) return fitTo(all, step.kind === "summary" ? { x: 16, y: 16, w: w - 32, h: h - 32 } : area, 1.1);
    const core = step.viaNode ? [...step.nodes, step.viaNode] : step.nodes;
    const wide = fitTo(bounds([...step.lit]), area, 1.25);
    return wide.k >= 0.62 ? wide : fitTo(bounds(core), area, 1.25);
  }

  let cameras = null;

  function camerasFor() {
    const size = `${viewport.clientWidth}x${viewport.clientHeight}`;
    if (!cameras || cameras.size !== size) cameras = { size, list: timeline.map(tourCamera) };
    return cameras.list;
  }

  const plainLevel = (step) => (step.kind === "summary" ? BEHIND_SUMMARY : 1);
  const nodeLevel = (step, node) => (step.plain ? plainLevel(step) : step.lit.has(node) ? 1 : DIM_NODE);
  const hidden = LAYOUT.dense ? 0 : DIM_EDGE;
  const edgeLevel = (step, edge) => {
    if (step.plain) return LAYOUT.dense ? 0 : plainLevel(step);
    return step.nodes.includes(edge.src) || step.nodes.includes(edge.dst) ? 1 : hidden;
  };

  const caption = $("caption");
  const summary = $("summary");
  let captionFor = -1;

  function fillCaption(index) {
    if (captionFor === index) return;
    captionFor = index;
    const text = timeline[index].caption;
    const kicker = add(el("div", "cap-kicker"), el("span", "", text.kicker), el("span", "cap-count", text.count));
    caption.replaceChildren(kicker, el("div", "cap-main", text.main), el("div", "cap-sub", text.sub));
  }

  function fillSummary() {
    summary.replaceChildren();
    const cell = (num, label, cls) => add(el("div", `sum-cell ${cls || ""}`), el("div", "sum-num", num), el("div", "sum-label", label));
    const grid = add(el("div", "sum-grid"),
      cell(changed.length, changed.length === 1 ? "symbol changed" : "symbols changed"),
      cell(added ? `+${added}` : "0", added === 1 ? "call added" : "calls added", added ? "good" : ""),
      cell(removed ? `${MINUS}${removed}` : "0", removed === 1 ? "call removed" : "calls removed", removed ? "bad" : ""),
      cell(callSites, "call sites affected"),
      cell(untested.length, `changed ${untested.length === 1 ? "symbol" : "symbols"} with ${NO_TEST}`, untested.length ? "warn" : "good"),
      cell(ci.word, ci.failed ? `CI failed: ${ci.failed.map((c) => c.name).join(", ")}` : "CI on the head commit", ci.cls));
    const toured = new Set(MAP.tour.flatMap((step) => step.focus));
    const skipped = changedCode.filter((n) => !toured.has(n.sym.id)).length;
    const note = skipped ? el("div", "sum-note", `${plural(skipped, "more changed symbol", "more changed symbols")} on the map, not in this tour`) : null;
    add(summary, el("div", "sum-kicker", "What this PR rewired"), el("div", "sum-title", MAP.title), grid, note,
      el("div", "sum-brand", "PR map \u00b7 computed from the code, no AI drew this"));
  }

  fillSummary();

  let touring = false;

  function enterTour() {
    if (touring) return;
    select(null);
    light(null);
    touring = true;
    document.body.classList.add("touring");
  }

  function exitTour() {
    pause();
    if (!touring) return;
    touring = false;
    document.body.classList.remove("touring");
    for (const n of nodes) {
      n.el.style.opacity = "";
      n.el.classList.remove("focus");
    }
    for (const e of edges) {
      e.el.style.opacity = "";
      e.el.style.strokeDashoffset = "";
    }
    captionFor = -1;
  }

  function stepAt(t) {
    let index = 0;
    while (index + 1 < timeline.length && timeline[index + 1].start <= t) index++;
    return index;
  }

  function seek(time) {
    if (!timeline.length) return;
    const t = clamp(Number(time) || 0, 0, duration);
    enterTour();
    const index = stepAt(t);
    const step = timeline[index];
    const prev = timeline[Math.max(index - 1, 0)];
    const u = t - step.start;
    const p = index === 0 ? 1 : ease(clamp(u / MOVE, 0, 1));
    const cams = camerasFor();
    const from = cams[Math.max(index - 1, 0)];
    const to = cams[index];
    const k = from.k * Math.pow(to.k / from.k, p);
    const vw = viewport.clientWidth / 2;
    const vh = viewport.clientHeight / 2;
    const cx = lerp((vw - from.x) / from.k, (vw - to.x) / to.k, p);
    const cy = lerp((vh - from.y) / from.k, (vh - to.y) / to.k, p);
    Object.assign(cam, { k, x: vw - cx * k, y: vh - cy * k });
    applyCamera();

    for (const n of nodes) {
      n.el.style.opacity = String(round(lerp(nodeLevel(prev, n), nodeLevel(step, n), p) * 100) / 100);
      n.el.classList.toggle("focus", !step.plain && step.nodes.includes(n));
    }
    const offset = String(-round((t * 28) % 28));
    for (const e of edges) {
      e.el.style.opacity = String(round(lerp(edgeLevel(prev, e), edgeLevel(step, e), p) * 100) / 100);
      if (e.status === "added") e.el.style.strokeDashoffset = offset;
    }

    const last = index === timeline.length - 1;
    const fadeIn = clamp((u - 0.25) / 0.45, 0, 1);
    const fadeOut = last ? 1 : clamp((step.duration - u) / 0.35, 0, 1);
    fillCaption(index);
    caption.style.opacity = step.kind === "summary" ? "0" : String(round(Math.min(fadeIn, fadeOut) * 100) / 100);
    summary.style.opacity = step.kind === "summary" ? String(round(clamp((u - 0.3) / 0.6, 0, 1) * 100) / 100) : "0";
    $("progress-bar").style.width = `${round((t / duration) * 1000) / 10}%`;
  }

  /* Playback */

  const player = { t: 0, playing: false, until: null, last: 0 };

  function setPlaying(on) {
    player.playing = on;
    document.body.classList.toggle("playing", on);
    $("play-label").textContent = on ? "Pause" : player.t >= duration && touring ? "Replay" : "Play tour";
  }

  function frame(now) {
    if (!player.playing) return;
    player.t = Math.min(duration, player.t + (now - player.last) / 1000);
    player.last = now;
    if (player.until !== null && player.t >= player.until) player.t = player.until;
    seek(player.t);
    if (player.t >= duration || (player.until !== null && player.t >= player.until)) setPlaying(false);
    else requestAnimationFrame(frame);
  }

  function run(from, until) {
    flight++;
    player.t = from;
    player.until = until;
    player.last = performance.now();
    seek(from);
    setPlaying(true);
    requestAnimationFrame(frame);
  }

  function pause() {
    if (player.playing) setPlaying(false);
  }

  function goto(index) {
    const i = clamp(index, 0, timeline.length - 1);
    const step = timeline[i];
    run(step.start, step.start + Math.min(step.duration - 0.4, MOVE + 0.6));
  }

  function next() {
    if (!touring) return goto(0);
    goto(stepAt(player.t) + 1);
  }

  function prev() {
    if (!touring) return goto(0);
    goto(stepAt(player.t) - 1);
  }

  $("play").addEventListener("click", () => {
    if (player.playing) return pause();
    const from = touring && player.t < duration ? player.t : 0;
    run(from, null);
  });

  document.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const key = event.key;
    if (key === "Escape") {
      if (drawerOpen()) select(null);
      else if (touring) exitTour();
    } else if (key === "ArrowRight" || key === " " || key === "PageDown") {
      next();
    } else if (key === "ArrowLeft" || key === "PageUp") {
      prev();
    } else if (key === "f" || key === "F") {
      if (touring) exitTour();
      userMoved = false;
      fit();
    } else if (key === "+" || key === "=") {
      zoomAt(1.25, viewport.clientWidth / 2, viewport.clientHeight / 2);
    } else if (key === "-" || key === "_") {
      zoomAt(0.8, viewport.clientWidth / 2, viewport.clientHeight / 2);
    } else {
      return;
    }
    event.preventDefault();
  });

  window.addEventListener("resize", () => {
    if (touring) seek(player.t);
    else if (!userMoved) open();
  });

  open();

  window.prcTour = Object.freeze({
    duration,
    steps: timeline.map((s) => Object.freeze({
      kind: s.kind, focus: [...s.focus], via: s.via, start: s.start, duration: s.duration,
      caption: Object.freeze({ ...s.caption }),
    })),
    seek: (t) => {
      pause();
      player.t = clamp(Number(t) || 0, 0, duration);
      seek(player.t);
    },
  });
})();
</script></body></html>
